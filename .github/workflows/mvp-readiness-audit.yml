name: MVP production readiness audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      statuses: write
    env:
      TRACKFLEET_BASE_URL: https://trackfleet.chronoplan.workers.dev
    steps:
      - name: Read production health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$TRACKFLEET_BASE_URL/api/health" -o /tmp/trackfleet-health.json
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/trackfleet-health.json', 'utf8'));
          const summary = {
            ok: health?.ok === true,
            storage: {
              mode: health?.storage?.mode ?? null,
              persistent: health?.storage?.persistent ?? null,
              connected: health?.storage?.connected ?? null,
              error: health?.storage?.error ?? null,
              failover: {
                available: health?.storage?.failover?.available ?? null,
                connected: health?.storage?.failover?.connected ?? null,
                ready: health?.storage?.failover?.ready ?? null,
                automatic: health?.storage?.failover?.automatic ?? null,
                reason: health?.storage?.failover?.reason ?? null,
              },
            },
            sendatrackConfigured: health?.sendatrackConfigured === true,
            sendatrackTransportSecure: health?.sendatrackTransportSecure === true,
            sessionEncryptionConfigured: health?.sessionEncryptionConfigured === true,
            automation: {
              tickProtected: health?.automation?.tickProtected === true,
              whatsappEnabled: health?.automation?.whatsappEnabled === true,
              ready: health?.automation?.ready === true,
              missing: Array.isArray(health?.automation?.missing) ? health.automation.missing : ['health_shape_invalid'],
              heartbeatAvailable: health?.automation?.heartbeatAvailable ?? null,
              live: health?.automation?.live ?? null,
            },
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${summary.automation.ready ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `missing=${summary.automation.missing.join(',') || 'none'}\n`);
          if (!summary.ok || summary.storage.mode !== 'postgres' || summary.storage.connected !== true) process.exit(1);
          NODE

      - name: Probe SENDATRACK HTTPS transport
        if: steps.health.outputs.ready != 'true' && contains(steps.health.outputs.missing, 'sendatrack_https')
        shell: bash
        run: |
          set -u
          url="https://backend2.sendatrack.com/sendatrack/public/api/"
          code="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$url" 2>/tmp/sendatrack-https-error || true)"
          echo "SENDATRACK HTTPS probe HTTP status: ${code:-000}"
          if [ -s /tmp/sendatrack-https-error ]; then
            echo "SENDATRACK HTTPS probe transport output:"
            cat /tmp/sendatrack-https-error
          fi
          if [ -n "$code" ] && [ "$code" != "000" ]; then
            echo "SENDATRACK HTTPS transport is reachable."
          else
            echo "SENDATRACK HTTPS transport could not be established."
          fi

      - name: Publish MVP readiness status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          READY: ${{ steps.health.outputs.ready }}
          MISSING: ${{ steps.health.outputs.missing }}
        shell: bash
        run: |
          if [ "$HEALTH_OUTCOME" != "success" ]; then
            state="failure"
            description="Production Postgres health audit failed"
          elif [ "$READY" = "true" ]; then
            state="success"
            description="MVP runtime ready; automation requirements satisfied"
          else
            state="pending"
            description="MVP runtime pending: ${MISSING:-unknown}"
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context="trackfleet/mvp-readiness" \
            -f target_url="$RUN_URL" \
            -f description="${description:0:140}"

name: Patch explicit trip membership v2

on:
  push:
    paths:
      - ".github/workflows/patch-explicit-trip-membership-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Make persisted trip membership authoritative
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
            p = Path(path); s = p.read_text()
            if old not in s: raise SystemExit(f'{label} marker missing')
            p.write_text(s.replace(old, new, 1))

          replace_once('app/lib/delivery-store.types.ts',
            '  trackingToken: string | null;\n  createdAt: Date;\n',
            '  trackingToken: string | null;\n  tripId?: string | null;\n  createdAt: Date;\n', 'delivery type')

          p = Path('app/lib/delivery-store.postgres.ts'); s = p.read_text()
          if '  trip_id: string | null;\n' not in s:
            s = s.replace('  tracking_token: string | null;\n  created_at: string | Date;\n', '  tracking_token: string | null;\n  trip_id: string | null;\n  created_at: string | Date;\n', 1)
          if '    tripId: row.trip_id ?? null,\n' not in s:
            s = s.replace('    trackingToken: row.tracking_token,\n    createdAt: new Date(row.created_at),\n', '    trackingToken: row.tracking_token,\n    tripId: row.trip_id ?? null,\n    createdAt: new Date(row.created_at),\n', 1)
          p.write_text(s)

          p = Path('app/lib/delivery-store.cloudflare.ts'); s = p.read_text()
          if 'tripId: string | null;' not in s.split('type RawDelivery = {',1)[1].split('};',1)[0]:
            s = s.replace('  lastPositionAt: number | null; gpsSource: string; companyId: string; trackingToken: string | null; createdAt: number;\n', '  lastPositionAt: number | null; gpsSource: string; companyId: string; trackingToken: string | null; tripId: string | null; createdAt: number;\n', 1)
          if 'trip_id AS tripId' not in s:
            s = s.replace('  tracking_token AS trackingToken, created_at AS createdAt`;', '  tracking_token AS trackingToken, trip_id AS tripId, created_at AS createdAt`;', 1)
          p.write_text(s)

          p = Path('app/lib/delivery-store.memory.ts'); s = p.read_text()
          if '    delivery.tripId = tripId;\n' not in s:
            s = s.replace('    deliveryTripAssignments.set(key, tripId);\n    return true;\n', '    deliveryTripAssignments.set(key, tripId);\n    delivery.tripId = tripId;\n    return true;\n', 1)
          p.write_text(s)

          p = Path('app/lib/truck-stop-plan.ts'); s = p.read_text()
          if '  tripId: string | null;\n' not in s:
            s = s.replace('  routeTemplateId: string;\n  originSiteId: string | null;\n', '  routeTemplateId: string;\n  tripId: string | null;\n  originSiteId: string | null;\n', 1)
          old = '''  const active = deliveries.filter((delivery) => delivery.status !== "Delivered" && delivery.destinationSiteId && !isUnassignedVehicle(delivery));\n  const byVehicle = new Map<string, DeliveryRow[]>();\n\n  for (const delivery of active) {\n    const key = vehicleKey(delivery);\n    const rows = byVehicle.get(key) ?? [];\n    rows.push(delivery);\n    byVehicle.set(key, rows);\n  }\n\n  return [...byVehicle.entries()].map(([key, rows]) => {\n'''
          new = '''  const active = deliveries.filter((delivery) => delivery.status !== "Delivered" && delivery.destinationSiteId && !isUnassignedVehicle(delivery));\n  const groups = new Map<string, DeliveryRow[]>();\n\n  for (const delivery of active) {\n    const key = delivery.tripId ? `trip:${delivery.tripId}` : `vehicle:${vehicleKey(delivery)}`;\n    const rows = groups.get(key) ?? [];\n    rows.push(delivery);\n    groups.set(key, rows);\n  }\n\n  return [...groups.entries()].map(([, rows]) => {\n'''
          if old not in s: raise SystemExit('stop plan grouping marker missing')
          s = s.replace(old, new, 1)
          old = '''    const first = rows[0];\n    const originSiteId = routeOriginSiteId(rows);\n    return {\n      vehicleKey: key,\n      truck: first.truck,\n'''
          new = '''    const first = rows[0];\n    const originSiteId = routeOriginSiteId(rows);\n    const explicitTripIds = [...new Set(rows.map((delivery) => delivery.tripId).filter((value): value is string => Boolean(value)))];\n    return {\n      vehicleKey: vehicleKey(first),\n      truck: first.truck,\n'''
          if old not in s: raise SystemExit('stop plan return marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('      routeTemplateId: routeTemplateId(originSiteId, stops.map((stop) => stop.siteId)),\n      originSiteId,\n', '      routeTemplateId: routeTemplateId(originSiteId, stops.map((stop) => stop.siteId)),\n      tripId: explicitTripIds.length === 1 ? explicitTripIds[0] : null,\n      originSiteId,\n', 1)
          p.write_text(s)

          replace_once('app/api/deliveries/route.ts',
            '      const currentTripInstanceId = deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n',
            '      const currentTripInstanceId = plan.tripId ?? deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n', 'route trip id')
          replace_once('app/lib/server-automation.ts',
            '    const tripInstanceId = deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n',
            '    const tripInstanceId = plan.tripId ?? deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n', 'automation trip id')

          p = Path('app/page.tsx'); s = p.read_text()
          if '  tripId?: string | null;\n' not in s.split('type Delivery = {',1)[1].split('};',1)[0]:
            s = s.replace('  trackingToken?: string | null;\n', '  trackingToken?: string | null;\n  tripId?: string | null;\n', 1)
          old = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; tripInstanceId?: string | null; originSiteId: string | null;'
          if old in s:
            s = s.replace(old, 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; tripId?: string | null; tripInstanceId?: string | null; originSiteId: string | null;', 1)
          p.write_text(s)

          Path('tests/explicit-trip-membership.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { buildTruckStopPlans } from "../app/lib/truck-stop-plan.ts";\n\nfunction delivery(id, tripId, destinationSiteId) {\n  return { id, customer: id, originSiteId: "brussels", originLatitude: null, originLongitude: null, destinationSiteId, destination: destinationSiteId, destinationLatitude: null, destinationLongitude: null, arrivalRadiusKm: 0.5, truck: "TRK-1", driver: "", status: "Loading", eta: "", plannedArrivalAt: new Date("2026-08-20T12:00:00Z"), progress: 0, color: "#000", contact: "", sendatrackVehicleId: "gps-1", latitude: null, longitude: null, speed: null, lastPositionAt: null, gpsSource: "simulation", companyId: "c1", trackingToken: id, tripId, createdAt: new Date() };\n}\n\ntest("same truck can have separate explicit trips without mixing parcels", () => {\n  const plans = buildTruckStopPlans([delivery("A", "TRIP-A", "casablanca"), delivery("B", "TRIP-B", "agadir")]);\n  assert.equal(plans.length, 2);\n  assert.deepEqual(new Set(plans.map((plan) => plan.tripId)), new Set(["TRIP-A", "TRIP-B"]));\n});\n\ntest("legacy deliveries without trip id still group by vehicle", () => {\n  const plans = buildTruckStopPlans([delivery("A", null, "casablanca"), delivery("B", null, "agadir")]);\n  assert.equal(plans.length, 1);\n  assert.equal(plans[0].tripId, null);\n});\n''')

          p = Path('package.json'); s = p.read_text()
          marker = '    "test:trip-suggestion": "node --experimental-strip-types --test tests/trip-suggestion.test.mjs",\n'
          if 'test:explicit-trip-membership' not in s:
            if marker not in s: raise SystemExit('package marker missing')
            s = s.replace(marker, marker + '    "test:explicit-trip-membership": "node --experimental-strip-types --test tests/explicit-trip-membership.test.mjs",\n', 1)
          p.write_text(s)
      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:explicit-trip-membership
          pnpm run test:stop-plans
          pnpm run test:tour
          pnpm run test:trip-record
          pnpm run test:automation-trip-sync
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app tests package.json
          git commit -m "make explicit trip membership authoritative"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

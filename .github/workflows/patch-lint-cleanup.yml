name: Patch lint cleanup

on:
  push:
    paths:
      - ".github/workflows/patch-lint-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fix real ESLint findings
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/SiteManager.tsx')
          s = p.read_text()
          s = s.replace('    {open && <div className="modal-backdrop" role="presentation" onMouseDown={() => setOpen(false)}>\n      <section className="modal" role="dialog" aria-modal="true" onMouseDown={(event) => event.stopPropagation()}>', '    {open && <div className="modal-backdrop">\n      <section className="modal" role="dialog" aria-modal="true">')
          p.write_text(s)

          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          s = s.replace('import type { DeliveryRow, DeliveryTransition } from "../../lib/delivery-store.types";', 'import type { DeliveryTransition } from "../../lib/delivery-store.types";')
          s = s.replace('function normalized(value: string) {\n  return value.trim().toLowerCase().replace(/\\s+/g, " ");\n}\n\n', '')
          s = s.replace('      let row = await store.getPublic(tracking);', '      const row = await store.getPublic(tracking);')
          p.write_text(s)

          p = Path('app/lib/site-store.postgres.ts')
          s = p.read_text()
          s = s.replace('import { knownSites, type KnownSite } from "./known-sites";', 'import { knownSites } from "./known-sites";')
          s = s.replace('function hydrate(row: any): CompanySite {', 'function hydrate(row: Record<string, unknown>): CompanySite {')
          s = s.replace('    companyId: row.company_id,\n    id: row.id,\n    label: row.label,\n    city: row.city,\n    country: row.country,\n    address: row.address,', '    companyId: String(row.company_id),\n    id: String(row.id),\n    label: String(row.label),\n    city: String(row.city),\n    country: String(row.country) as "BE" | "MA",\n    address: String(row.address),')
          s = s.replace('    roles: JSON.parse(row.roles),\n    createdAt: new Date(row.created_at),\n    updatedAt: new Date(row.updated_at),', '    roles: JSON.parse(String(row.roles)) as CompanySite["roles"],\n    createdAt: new Date(String(row.created_at)),\n    updatedAt: new Date(String(row.updated_at)),')
          s = s.replace('    return rows.map(hydrate);', '    return rows.map((row) => hydrate(row as Record<string, unknown>));')
          s = s.replace('    return hydrate(rows[0]);', '    return hydrate(rows[0] as Record<string, unknown>);')
          p.write_text(s)

          p = Path('app/lib/site-store.cloudflare.ts')
          s = p.read_text()
          s = s.replace('function hydrate(row: any): CompanySite {', 'function hydrate(row: Record<string, unknown>): CompanySite {')
          s = s.replace('    companyId: row.company_id,\n    id: row.id,\n    label: row.label,\n    city: row.city,\n    country: row.country,\n    address: row.address,', '    companyId: String(row.company_id),\n    id: String(row.id),\n    label: String(row.label),\n    city: String(row.city),\n    country: String(row.country) as "BE" | "MA",\n    address: String(row.address),')
          s = s.replace('    roles: JSON.parse(row.roles),', '    roles: JSON.parse(String(row.roles)) as CompanySite["roles"],')
          s = s.replace('    return (result.results ?? []).map(hydrate);', '    return (result.results ?? []).map((row) => hydrate(row as Record<string, unknown>));')
          s = s.replace('    return hydrate(row);', '    return hydrate(row as Record<string, unknown>);')
          p.write_text(s)

          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('<header className="login-header"><a className="brand brand-dark" href="/"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></a><LanguageSwitcher', '<header className="login-header"><span className="brand brand-dark"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></span><LanguageSwitcher')
          s = s.replace('<a className="brand brand-dark" href="/" onClick={(event) => { event.preventDefault(); openDispatchView(); }}>', '<button type="button" className="brand brand-dark" onClick={openDispatchView}>')
          s = s.replace('</a>\n          <div className="customer-header-actions">', '</button>\n          <div className="customer-header-actions">')
          s = s.replace('<a className="brand" href="#"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></a>', '<div className="brand"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></div>')
          s = s.replace('<tr key={delivery.id} tabIndex={0} onClick=', '<tr key={delivery.id} role="button" tabIndex={0} onClick=')
          s = s.replace('{modalOpen && <div className="modal-backdrop" role="presentation" onMouseDown={() => setModalOpen(false)}><section className="modal" role="dialog" aria-modal="true" aria-labelledby="new-delivery-title" onMouseDown={(event) => event.stopPropagation()}>', '{modalOpen && <div className="modal-backdrop"><section className="modal" role="dialog" aria-modal="true" aria-labelledby="new-delivery-title">')
          s = s.replace(' required autoFocus placeholder={t.customerPlaceholder}', ' required placeholder={t.customerPlaceholder}')
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify lint typecheck and builds
        run: |
          pnpm run lint
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/SiteManager.tsx app/api/deliveries/route.ts app/lib/site-store.postgres.ts app/lib/site-store.cloudflare.ts app/page.tsx
          git commit -m "fix lint findings and modal accessibility"
          git push

name: Verify logical SENDATRACK fleet history ids once

on:
  push:
    branches: [main]

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: ${{ vars.TRACKFLEET_BASE_URL || 'https://trackfleet-self.vercel.app' }}
      CRON_SECRET: ${{ secrets.TRACKFLEET_CRON_SECRET }}
    steps:
      - name: Run one protected production tick
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const secret = (process.env.CRON_SECRET || '').trim();
          if (!secret) throw new Error('TRACKFLEET_CRON_SECRET is empty');
          const response = await fetch(`${baseUrl}/api/automation/tick`, {
            headers: { authorization: `Bearer ${secret}` },
            cache: 'no-store',
          });
          const body = await response.json();
          console.log(JSON.stringify({ ok: body.ok, connected: body.connected, vehicles: body.vehicles, fleetPositions: body.fleetPositions }));
          if (!response.ok || body.ok !== true || body.connected !== true || body.vehicles !== 6 || typeof body.fleetPositions !== 'number') process.exit(1);
          NODE

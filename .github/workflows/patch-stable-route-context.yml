name: Patch stable route context

on:
  push:
    paths:
      - ".github/workflows/patch-stable-route-context.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Stabilize route context after departure
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/lib/server-automation.ts')
          s = p.read_text()
          s = s.replace('import { buildEtaRouteContexts } from "./route-history";', 'import { buildEtaRouteContexts, stableEtaRouteContext } from "./route-history";')
          old = '''    const events = await store.listEvents(delivery.id);\n    const etaObservation = buildEtaObservation(delivery, events, deliveries, routeContexts.get(delivery.id) ?? null);'''
          new = '''    const events = await store.listEvents(delivery.id);\n    const previousEtaObservations = await store.listEtaObservations(delivery.id, 2000);\n    const routeContext = stableEtaRouteContext(routeContexts.get(delivery.id) ?? null, previousEtaObservations, events);\n    const etaObservation = buildEtaObservation(delivery, events, deliveries, routeContext);'''
          if old not in s: raise SystemExit('server automation marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          s = s.replace('import { buildEtaRouteContexts, summarizeRouteHistory } from "../../lib/route-history";', 'import { buildEtaRouteContexts, stableEtaRouteContext, summarizeRouteHistory } from "../../lib/route-history";')

          old = '''      const routeContext = routeContexts.get(row.id) ?? null;\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];\n      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);'''
          new = '''      const routeEvents = await store.listEvents(row.id);\n      const ownEtaHistory = await store.listEtaObservations(row.id, 2000);\n      const routeContext = stableEtaRouteContext(routeContexts.get(row.id) ?? null, ownEtaHistory, routeEvents);\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];\n      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);'''
          if old not in s: raise SystemExit('public API route history marker missing')
          s = s.replace(old, new, 1)

          old = '''      const routeContext = routeContexts.get(row.id) ?? null;\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];\n      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);\n      return (await enrichAndDetectDelay(row, serviceMinutes, history.usableEffectiveSpeedKmh, history.tripCount)).delivery;'''
          new = '''      const routeEvents = await store.listEvents(row.id);\n      const ownEtaHistory = await store.listEtaObservations(row.id, 2000);\n      const routeContext = stableEtaRouteContext(routeContexts.get(row.id) ?? null, ownEtaHistory, routeEvents);\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];\n      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);\n      return (await enrichAndDetectDelay(row, serviceMinutes, history.usableEffectiveSpeedKmh, history.tripCount)).delivery;'''
          if old not in s: raise SystemExit('authenticated API route history marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:route-history
          pnpm run test:eta-observation
          pnpm run build:vercel
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/server-automation.ts app/api/deliveries/route.ts
          git commit -m "freeze reusable route identity once trip departs"
          git push

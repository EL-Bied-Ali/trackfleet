name: Cloudflare production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trackfleet-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      TRACKFLEET_STORAGE: postgres
      TRACKFLEET_BASE_URL: https://trackfleet.chronoplan.workers.dev
    steps:
      - name: Resolve release commit
        id: release
        shell: bash
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Require validation workflows for the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100")"
            platform_run_id="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Platform build check" and .event == "push")][0].id // ""')"
            platform_url="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Platform build check" and .event == "push")][0].html_url // ""')"
            platform_status="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Platform build check" and .event == "push")][0].status // "missing"')"
            platform_conclusion="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Platform build check" and .event == "push")][0].conclusion // "pending"')"
            runtime_run_id="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Runtime schema safety" and .event == "push")][0].id // ""')"
            runtime_url="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Runtime schema safety" and .event == "push")][0].html_url // ""')"
            runtime_status="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Runtime schema safety" and .event == "push")][0].status // "missing"')"
            runtime_conclusion="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "Runtime schema safety" and .event == "push")][0].conclusion // "pending"')"

            echo "Platform build check: status=$platform_status conclusion=$platform_conclusion url=$platform_url"
            echo "Runtime schema safety: status=$runtime_status conclusion=$runtime_conclusion url=$runtime_url"

            if [ "$platform_conclusion" = "success" ] && [ "$runtime_conclusion" = "success" ]; then
              echo "Both release gates passed for $RELEASE_SHA."
              exit 0
            fi

            if [ "$platform_status" = "completed" ] && [ "$platform_conclusion" != "success" ]; then
              echo "Platform build check failed for $RELEASE_SHA. Production deployment is blocked."
              if [ -n "$platform_run_id" ]; then
                echo "--- Failed Platform build check logs ---"
                gh run view "$platform_run_id" --repo "$REPOSITORY" --log-failed || true
              fi
              exit 1
            fi
            if [ "$runtime_status" = "completed" ] && [ "$runtime_conclusion" != "success" ]; then
              echo "Runtime schema safety failed for $RELEASE_SHA. Production deployment is blocked."
              if [ -n "$runtime_run_id" ]; then
                echo "--- Failed Runtime schema safety logs ---"
                gh run view "$runtime_run_id" --repo "$REPOSITORY" --log-failed || true
              fi
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for release gates on $RELEASE_SHA. Production deployment is blocked."
          exit 1

      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-Postgres Cloudflare Worker
        run: pnpm exec vinext build

      - name: Prepare D1 fallback schema
        id: d1_prepare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/prepare-d1-schema.mjs --remote
          node scripts/prepare-d1-history-backfill-state.mjs --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body="$(curl --fail --silent --show-error --max-time 15 "$TRACKFLEET_BASE_URL/api/health" || true)"
            if BODY="$body" node - <<'NODE'
          const body = process.env.BODY || "";
          try {
            const health = JSON.parse(body);
            if (health?.ok === true && health?.storage?.mode === "postgres" && health?.storage?.connected === true) {
              process.exit(0);
            }
          } catch {}
          process.exit(1);
          NODE
            then
              echo "Cloudflare production health verified."
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare production health verification failed."
          exit 1

      - name: Publish D1 standby status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          D1_PREP_OUTCOME: ${{ steps.d1_prepare.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$D1_PREP_OUTCOME" != "success" ]; then
            result="pending|D1 standby preparation failed; Postgres production remains active"
          else
            body="$(curl --fail --silent --show-error --max-time 15 "$TRACKFLEET_BASE_URL/api/health" || true)"
            result="$(BODY="$body" node - <<'NODE'
          try {
            const health = JSON.parse(process.env.BODY || "{}");
            const failover = health?.storage?.failover;
            if (failover?.ready === true && failover?.reason === "replication_ready" && failover?.automatic === true) {
              console.log("success|D1 standby ready; read failover authorized");
            } else if (failover?.ready === true && failover?.reason === "replication_ready") {
              console.log("pending|D1 standby ready; read failover disabled");
            } else {
              console.log(`pending|D1 standby not ready: ${failover?.reason || "unknown"}`);
            }
          } catch {
            console.log("pending|D1 standby health unavailable");
          }
          NODE
            )"
          fi
          state="${result%%|*}"
          description="${result#*|}"
          gh api --method POST "repos/$REPOSITORY/statuses/$RELEASE_SHA" \
            -f state="$state" \
            -f context="trackfleet/d1-standby" \
            -f target_url="$RUN_URL" \
            -f description="$description"

      - name: Publish Cloudflare production status
        if: always() && steps.release.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$DEPLOY_JOB_STATUS" = "success" ]; then
            state="success"
            description="Cloudflare production deploy and health check passed"
          else
            state="failure"
            description="Cloudflare production deployment failed"
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$RELEASE_SHA" \
            -f state="$state" \
            -f context="trackfleet/cloudflare-production" \
            -f target_url="$RUN_URL" \
            -f description="$description"

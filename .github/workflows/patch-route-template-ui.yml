name: Patch reusable route template UI

on:
  push:
    paths:
      - ".github/workflows/patch-route-template-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose reusable route identity in dashboard
        shell: python
        run: |
          from pathlib import Path

          page = Path('app/page.tsx')
          s = page.read_text()
          old_type = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; source: "planned-arrival"; stops: TourStop[] };'
          new_type = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; originSiteId: string | null; source: "planned-arrival"; stops: TourStop[] };'
          if old_type in s:
            s = s.replace(old_type, new_type)
          elif 'routeTemplateId: string' not in s:
            raise SystemExit('TourPlan type marker missing')

          old_header = '<div className="tour-card-head"><div><strong>{plan.truck}</strong><span>{activeTourDisplayId(plan)}</span></div><small>{tourDeliveryCount(plan)} '
          new_header = '<div className="tour-card-head"><div><strong>{plan.truck}</strong><span>{activeTourDisplayId(plan)} · {plan.routeTemplateId}</span></div><small>{tourDeliveryCount(plan)} '
          if old_header in s:
            s = s.replace(old_header, new_header)
          elif '{plan.routeTemplateId}' not in s:
            raise SystemExit('tour card header marker missing')

          old_subtitle = '"Un camion, plusieurs agences, dans l’ordre prévu" : locale === "nl" ? "Eén vrachtwagen, meerdere locaties, in geplande volgorde" : "One truck, multiple stops, in planned order"'
          new_subtitle = '"La même séquence d’agences réutilise automatiquement la même route" : locale === "nl" ? "Dezelfde volgorde van locaties hergebruikt automatisch dezelfde route" : "The same stop sequence automatically reuses the same route"'
          if old_subtitle in s:
            s = s.replace(old_subtitle, new_subtitle)
          page.write_text(s)

          package = Path('package.json')
          p = package.read_text()
          marker = '    "test:tour-view": "node --experimental-strip-types --test tests/tour-view.test.mjs",\n'
          if 'test:route-template' not in p:
            if marker not in p: raise SystemExit('package tour-view marker missing')
            p = p.replace(marker, marker + '    "test:route-template": "node --experimental-strip-types --test tests/route-template.test.mjs",\n')
          package.write_text(p)

          ci = Path('.github/workflows/vercel-build-check.yml')
          c = ci.read_text()
          marker = '      - name: Verify active tour presentation\n        run: pnpm run test:tour-view\n'
          if 'Verify reusable route identity' not in c:
            if marker not in c: raise SystemExit('CI tour-view marker missing')
            c = c.replace(marker, marker + '      - name: Verify reusable route identity\n        run: pnpm run test:route-template\n')
          ci.write_text(c)

      - name: Test reusable route identity
        run: node --experimental-strip-types --test tests/route-template.test.mjs tests/multistop-tour.test.mjs
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx package.json .github/workflows/vercel-build-check.yml
          git commit -m "reuse stable route identity across truck trips"
          git push

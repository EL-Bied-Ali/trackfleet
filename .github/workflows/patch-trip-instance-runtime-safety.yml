name: Patch trip instance runtime safety

on:
  push:
    paths:
      - ".github/workflows/patch-trip-instance-runtime-safety.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fix route context scope and expose real trip instance ids
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          public_bad = '''      const routeContext = stableEtaRouteContext(routeContexts.get(row.id) ?? null, ownEtaHistory, routeEvents);\n      stableContexts.set(row.id, routeContext);\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];'''
          public_good = '''      const routeContext = stableEtaRouteContext(routeContexts.get(row.id) ?? null, ownEtaHistory, routeEvents);\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];'''
          if public_bad not in s: raise SystemExit('public stableContexts regression marker missing')
          s = s.replace(public_bad, public_good, 1)

          auth_marker = '''      const routeContext = stableEtaRouteContext(routeContexts.get(row.id) ?? null, ownEtaHistory, routeEvents);\n      const historyRows = routeContext ? await cachedEtaHistory(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];'''
          auth_replacement = '''      const routeContext = stableEtaRouteContext(routeContexts.get(row.id) ?? null, ownEtaHistory, routeEvents);\n      stableContexts.set(row.id, routeContext);\n      const historyRows = routeContext ? await cachedEtaHistory(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];'''
          if auth_marker not in s: raise SystemExit('authenticated stableContexts marker missing')
          s = s.replace(auth_marker, auth_replacement, 1)

          plan_old = '''      const currentTripInstanceId = deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;'''
          plan_new = '''      const currentTripInstanceId = deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;'''
          if plan_old not in s: raise SystemExit('trip instance marker missing')

          return_old = '''      return { ...plan, routeTemplateId: stableRouteTemplateId, learning };'''
          return_new = '''      return { ...plan, routeTemplateId: stableRouteTemplateId, tripInstanceId: currentTripInstanceId, learning };'''
          if return_old not in s: raise SystemExit('plan return marker missing')
          s = s.replace(return_old, return_new, 1)
          p.write_text(s)

          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; originSiteId: string | null; source: "planned-arrival"; stops: TourStop[]; learning?: { historicalTrips: number; requiredTrips: number; learnedStops: number; futureStops: number; unconfiguredStops: number; etaHistoryReady: boolean; dwellHistoryReady: boolean; stage: "collecting" | "partial" | "ready" } };'
          new = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; tripInstanceId?: string | null; originSiteId: string | null; source: "planned-arrival"; stops: TourStop[]; learning?: { historicalTrips: number; requiredTrips: number; learnedStops: number; futureStops: number; unconfiguredStops: number; etaHistoryReady: boolean; dwellHistoryReady: boolean; stage: "collecting" | "partial" | "ready" } };'
          if old not in s: raise SystemExit('TourPlan type marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/route-api-context-safety.test.mjs')
          p.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport fs from "node:fs";\n\nconst source = fs.readFileSync(new URL("../app/api/deliveries/route.ts", import.meta.url), "utf8");\n\ntest("public tracking never references the authenticated stable context cache", () => {\n  const publicStart = source.indexOf("if (tracking) {");\n  const authStart = source.indexOf("const session = await getCompanySession(request);");\n  assert.ok(publicStart >= 0 && authStart > publicStart);\n  const publicBranch = source.slice(publicStart, authStart);\n  assert.equal(publicBranch.includes("stableContexts.set("), false);\n});\n\ntest("authenticated enrichment records stable contexts and returns trip instance ids", () => {\n  assert.match(source, /stableContexts\\.set\\(row\\.id, routeContext\\)/);\n  assert.match(source, /tripInstanceId: currentTripInstanceId/);\n});\n''')

          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:tour-view": "node --experimental-strip-types --test tests/tour-view.test.mjs",\n'
          if 'test:route-api-context-safety' not in s:
            if marker not in s: raise SystemExit('tour view script marker missing')
            s = s.replace(marker, marker + '    "test:route-api-context-safety": "node --test tests/route-api-context-safety.test.mjs",\n')
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:tour-view
          pnpm run test:route-api-context-safety
          pnpm run test:route-history
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/deliveries/route.ts app/page.tsx tests/route-api-context-safety.test.mjs package.json
          git commit -m "use real stable trip ids and fix route context scope"
          git push

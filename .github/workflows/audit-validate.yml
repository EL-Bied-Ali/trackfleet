name: Audit hardening validation

on:
  push:
    branches: [audit-hardening-20260819]
    paths:
      - "app/**"
      - "tests/**"
      - "worker/**"
      - "vite.config.ts"
      - "tsconfig.vercel.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/audit-validate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-hardening-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: install
        name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - id: request_security
        name: Run request, dependency and login security contracts
        run: node --experimental-strip-types --test tests/request-json-safety.test.mjs
      - id: automation_health
        name: Run automation health and heartbeat contracts
        run: node --experimental-strip-types --test tests/automation-health.test.mjs
      - id: headers
        name: Run security header parity contract
        run: node --test tests/security-headers-contract.test.mjs
      - id: lint
        name: Lint
        shell: bash
        run: |
          set +e
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0 2>&1 | tee .audit-lint.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - id: typecheck
        name: Typecheck Vercel runtime
        run: pnpm exec tsc -p tsconfig.vercel.json --noEmit
      - id: build_vercel
        name: Build Vercel output
        env:
          VERCEL: "1"
          NITRO_PRESET: "vercel"
        run: pnpm run build:vercel
      - id: build_cloudflare
        name: Build Cloudflare output
        run: pnpm run build
      - name: Record validation outcome
        if: always()
        shell: bash
        run: |
          cat > .audit-validation-status.json <<'JSON'
          {
            "job": "${{ job.status }}",
            "install": "${{ steps.install.outcome }}",
            "requestSecurity": "${{ steps.request_security.outcome }}",
            "automationHealth": "${{ steps.automation_health.outcome }}",
            "headers": "${{ steps.headers.outcome }}",
            "lint": "${{ steps.lint.outcome }}",
            "typecheck": "${{ steps.typecheck.outcome }}",
            "buildVercel": "${{ steps.build_vercel.outcome }}",
            "buildCloudflare": "${{ steps.build_cloudflare.outcome }}"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit-validation-status.json
          if [ -f .audit-lint.log ]; then git add .audit-lint.log; fi
          git commit -m "record audit validation outcome" || exit 0
          git push origin HEAD:audit-hardening-20260819

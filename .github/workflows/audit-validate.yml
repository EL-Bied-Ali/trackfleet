name: Audit hardening validation

on:
  push:
    branches: [audit-hardening-20260819]
    paths:
      - "app/**"
      - "tests/**"
      - "worker/**"
      - "vite.config.ts"
      - "tsconfig.vercel.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".env.example"
      - ".github/workflows/audit-validate.yml"

permissions:
  contents: write

concurrency:
  group: audit-hardening-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - id: route_progress
        run: pnpm run test:route-progress
      - id: delivery_completion
        run: node --experimental-strip-types --test tests/delivery-completion.test.mjs tests/unloading-delay-suppression.test.mjs tests/unload-departure-guard.test.mjs tests/automation-delay.test.mjs
      - id: security
        run: node --experimental-strip-types --test tests/request-json-safety.test.mjs
      - id: automation
        run: node --experimental-strip-types --test tests/automation-health.test.mjs
      - id: headers
        run: node --test tests/security-headers-contract.test.mjs
      - id: lint
        shell: bash
        run: |
          set +e
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0 2>&1 | tee .audit-lint.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - id: typecheck
        run: pnpm exec tsc -p tsconfig.vercel.json --noEmit
      - id: vercel
        env:
          VERCEL: "1"
          NITRO_PRESET: "vercel"
        run: pnpm run build:vercel
      - id: cloudflare
        run: pnpm run build
      - name: Record outcome
        if: always()
        shell: bash
        run: |
          cat > .audit-validation-status.json <<'JSON'
          {
            "sourceSha": "${{ github.sha }}",
            "job": "${{ job.status }}",
            "install": "${{ steps.install.outcome }}",
            "routeProgress": "${{ steps.route_progress.outcome }}",
            "deliveryCompletion": "${{ steps.delivery_completion.outcome }}",
            "security": "${{ steps.security.outcome }}",
            "automation": "${{ steps.automation.outcome }}",
            "headers": "${{ steps.headers.outcome }}",
            "lint": "${{ steps.lint.outcome }}",
            "typecheck": "${{ steps.typecheck.outcome }}",
            "buildVercel": "${{ steps.vercel.outcome }}",
            "buildCloudflare": "${{ steps.cloudflare.outcome }}"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit-validation-status.json .audit-lint.log
          git commit -m "record audit validation outcome" || exit 0
          git push origin HEAD:audit-hardening-20260819

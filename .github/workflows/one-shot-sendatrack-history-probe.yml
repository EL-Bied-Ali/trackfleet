name: One-shot SENDATRACK history probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-sendatrack-history-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.TRACKFLEET_BASE_URL || 'https://trackfleet-self.vercel.app' }}
      CRON_SECRET: ${{ secrets.TRACKFLEET_CRON_SECRET }}
    steps:
      - name: Run protected logical-Device history probe
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "TRACKFLEET_CRON_SECRET is empty"
            exit 2
          fi
          code=$(curl --silent --show-error --output /tmp/history.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/automation/sendatrack-history-probe-v2" || true)
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/history.json', 'utf8'));
          const raw = String(body.providerError ?? '');
          const providerError = /authori[sz]ation|password/i.test(raw) ? 'invalid_authorization'
            : /account/i.test(raw) ? 'account_error'
            : /device/i.test(raw) ? 'device_error'
            : raw ? 'provider_error' : null;
          console.log(JSON.stringify({
            httpStatus: Number(process.env.HTTP_STATUS || 0),
            ok: body.ok === true,
            status: body.status,
            pointCount: body.pointCount,
            firstTimestamp: body.firstTimestamp,
            lastTimestamp: body.lastTimestamp,
            payloadKeys: body.payloadKeys,
            accountSource: body.accountSource ?? null,
            endpointSource: body.endpointSource ?? null,
            usedUserId: body.usedUserId ?? null,
            providerError,
            error: body.error ?? null,
          }));
          NODE
          echo "probe_http_status=$code"

# One isolated request against production: corrected logical Device, old dId/uId contract.

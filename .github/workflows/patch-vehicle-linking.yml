name: Patch vehicle linking

on:
  push:
    paths:
      - ".github/workflows/patch-vehicle-linking.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden automatic vehicle linking
        shell: python
        run: |
          from pathlib import Path

          # Memory store
          p = Path('app/lib/delivery-store.memory.ts')
          s = p.read_text()
          s = s.replace('import type { SendatrackSnapshot } from "./sendatrack";\n', 'import type { SendatrackSnapshot } from "./sendatrack";\nimport { matchDeliveryVehicle } from "./vehicle-linking";\n')
          s = s.replace('''function key(value: string) {\n  return value.toLowerCase().replace(/[^a-z0-9]/g, "");\n}\n''', '')
          old = '''      const vehicle = snapshot.vehicles.find((item) => item.id === delivery.sendatrackVehicleId)\n        ?? snapshot.vehicles.find((item) => key(item.name) === key(delivery.truck));\n      if (!vehicle) continue;\n      const previousStatus = delivery.status;\n      const previousProgress = delivery.progress;\n      const absoluteMetrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), explicitOrigin(delivery));\n      const metrics = rebaseRouteMetrics(absoluteMetrics, explicitOrigin(delivery) ? 0 : baselineProgress(delivery.id));\n      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n      const state = deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm, positionAgeMinutes);\n      const events = detectDeliveryEvents({ previousStatus, nextStatus: state.status, previousProgress, nextProgress: state.progress, distanceToDestinationKm: metrics.distanceToDestinationKm, positionAgeMinutes });\n'''
          new = '''      const match = matchDeliveryVehicle(delivery, snapshot.vehicles);\n      const vehicle = match.vehicle;\n      if (!vehicle) continue;\n      const firstLink = !delivery.sendatrackVehicleId && delivery.gpsSource !== "sendatrack";\n      const previousStatus = delivery.status;\n      const previousProgress = delivery.progress;\n      const absoluteMetrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), explicitOrigin(delivery));\n      if (firstLink && !deliveryEvents.some((event) => event.deliveryId === delivery.id && event.type === "GPS_BASELINE")) {\n        deliveryEvents.push({ deliveryId: delivery.id, type: "GPS_BASELINE", progress: absoluteMetrics.progress, createdAt: new Date() });\n      }\n      const metrics = rebaseRouteMetrics(absoluteMetrics, explicitOrigin(delivery) ? 0 : baselineProgress(delivery.id));\n      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n      const state = firstLink\n        ? { status: "Loading" as const, progress: previousProgress }\n        : deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm, positionAgeMinutes);\n      const events = firstLink ? [] : detectDeliveryEvents({ previousStatus, nextStatus: state.status, previousProgress, nextProgress: state.progress, distanceToDestinationKm: metrics.distanceToDestinationKm, positionAgeMinutes });\n'''
          if old not in s: raise SystemExit('memory match block missing')
          p.write_text(s.replace(old, new))

          # Postgres store
          p = Path('app/lib/delivery-store.postgres.ts')
          s = p.read_text()
          s = s.replace('import type { SendatrackSnapshot } from "./sendatrack";\n', 'import type { SendatrackSnapshot } from "./sendatrack";\nimport { matchDeliveryVehicle } from "./vehicle-linking";\n')
          s = s.replace('function key(value: string) { return value.toLowerCase().replace(/[^a-z0-9]/g, ""); }\n', '')
          old = '''      const vehicle = snapshot.vehicles.find((item) => item.id === delivery.sendatrackVehicleId)\n        ?? snapshot.vehicles.find((item) => key(item.name) === key(delivery.truck));\n      if (!vehicle) continue;\n\n      const previousStatus = delivery.status;\n      const previousProgress = delivery.progress;\n      const origin = explicitOrigin(delivery);\n      const absoluteMetrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), origin);\n      const metrics = rebaseRouteMetrics(absoluteMetrics, origin ? 0 : await baselineProgress(delivery.id));\n      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n      const state = deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm, positionAgeMinutes);\n      const events = detectDeliveryEvents({\n        previousStatus,\n        nextStatus: state.status,\n        previousProgress,\n        nextProgress: state.progress,\n        distanceToDestinationKm: metrics.distanceToDestinationKm,\n        positionAgeMinutes,\n      });\n'''
          new = '''      const match = matchDeliveryVehicle(delivery, snapshot.vehicles);\n      const vehicle = match.vehicle;\n      if (!vehicle) continue;\n\n      const firstLink = !delivery.sendatrackVehicleId && delivery.gpsSource !== "sendatrack";\n      const previousStatus = delivery.status;\n      const previousProgress = delivery.progress;\n      const origin = explicitOrigin(delivery);\n      const absoluteMetrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), origin);\n      if (firstLink) {\n        await sql`INSERT INTO delivery_events (delivery_id, type, progress, created_at)\n          VALUES (${delivery.id}, 'GPS_BASELINE', ${absoluteMetrics.progress}, ${new Date().toISOString()})\n          ON CONFLICT (delivery_id, type) DO NOTHING`;\n      }\n      const metrics = rebaseRouteMetrics(absoluteMetrics, origin ? 0 : await baselineProgress(delivery.id));\n      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n      const state = firstLink\n        ? { status: "Loading" as const, progress: previousProgress }\n        : deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm, positionAgeMinutes);\n      const events = firstLink ? [] : detectDeliveryEvents({\n        previousStatus,\n        nextStatus: state.status,\n        previousProgress,\n        nextProgress: state.progress,\n        distanceToDestinationKm: metrics.distanceToDestinationKm,\n        positionAgeMinutes,\n      });\n'''
          if old not in s: raise SystemExit('postgres match block missing')
          p.write_text(s.replace(old, new))

          # Cloudflare store
          p = Path('app/lib/delivery-store.cloudflare.ts')
          s = p.read_text()
          s = s.replace('import type { SendatrackSnapshot } from "./sendatrack";\n', 'import type { SendatrackSnapshot } from "./sendatrack";\nimport { matchDeliveryVehicle } from "./vehicle-linking";\n')
          s = s.replace('function key(value: string) { return value.toLowerCase().replace(/[^a-z0-9]/g, ""); }\n', '')
          old = '''      const vehicle = snapshot.vehicles.find((item) => item.id === delivery.sendatrackVehicleId) ?? snapshot.vehicles.find((item) => key(item.name) === key(delivery.truck));\n      if (!vehicle) continue;\n      const previousStatus = delivery.status;\n      const previousProgress = delivery.progress;\n      const origin = explicitOrigin(delivery);\n      const absoluteMetrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), origin);\n      const metrics = rebaseRouteMetrics(absoluteMetrics, origin ? 0 : await baselineProgress(delivery.id));\n      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n      const state = deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm, positionAgeMinutes);\n      const events = detectDeliveryEvents({ previousStatus, nextStatus: state.status, previousProgress, nextProgress: state.progress, distanceToDestinationKm: metrics.distanceToDestinationKm, positionAgeMinutes });\n'''
          new = '''      const match = matchDeliveryVehicle(delivery, snapshot.vehicles);\n      const vehicle = match.vehicle;\n      if (!vehicle) continue;\n      const firstLink = !delivery.sendatrackVehicleId && delivery.gpsSource !== "sendatrack";\n      const previousStatus = delivery.status;\n      const previousProgress = delivery.progress;\n      const origin = explicitOrigin(delivery);\n      const absoluteMetrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), origin);\n      if (firstLink) {\n        statements.push(db().prepare(`INSERT OR IGNORE INTO delivery_events (delivery_id, type, progress, created_at) VALUES (?, 'GPS_BASELINE', ?, ?)`).bind(delivery.id, absoluteMetrics.progress, Date.now()));\n      }\n      const metrics = rebaseRouteMetrics(absoluteMetrics, origin ? 0 : (firstLink ? absoluteMetrics.progress : await baselineProgress(delivery.id)));\n      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n      const state = firstLink\n        ? { status: "Loading" as const, progress: previousProgress }\n        : deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm, positionAgeMinutes);\n      const events = firstLink ? [] : detectDeliveryEvents({ previousStatus, nextStatus: state.status, previousProgress, nextProgress: state.progress, distanceToDestinationKm: metrics.distanceToDestinationKm, positionAgeMinutes });\n'''
          if old not in s: raise SystemExit('cloudflare match block missing')
          p.write_text(s.replace(old, new))

          # Delivery creation should use the same safe normalized matcher.
          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          import_marker = 'import { findCompanySiteByText, resolveExplicitCompanySite } from "../../lib/delivery-site-resolution";\n'
          if 'vehicle-linking' not in s:
            s = s.replace(import_marker, import_marker + 'import { matchDeliveryVehicle } from "../../lib/vehicle-linking";\n')
          old = '''    const snapshot = await getSendatrackSnapshot(session.credentials);\n    const liveVehicle = snapshot.vehicles.find((vehicle) => vehicle.id === sendatrackVehicleId)\n      ?? snapshot.vehicles.find((vehicle) => vehicle.name === truck);\n'''
          new = '''    const snapshot = await getSendatrackSnapshot(session.credentials);\n    const liveVehicle = matchDeliveryVehicle({ sendatrackVehicleId, truck }, snapshot.vehicles).vehicle;\n'''
          if old not in s: raise SystemExit('route vehicle lookup block missing')
          p.write_text(s.replace(old, new))

          # Tests
          Path('tests/vehicle-linking.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { matchDeliveryVehicle, normalizeVehicleIdentity } from "../app/lib/vehicle-linking.ts";\n\nconst vehicle = (id, name) => ({ id, name, latitude: 50.8, longitude: 4.3, speed: 0, updatedAt: Date.now() });\n\ntest("normalizes case spaces and punctuation", () => {\n  assert.equal(normalizeVehicleIdentity(" TRK-014 "), "trk014");\n  assert.equal(normalizeVehicleIdentity("trk 014"), "trk014");\n});\n\ntest("stable SENDATRACK id has priority", () => {\n  const vehicles = [vehicle("send-1", "TRK-014"), vehicle("send-2", "TRK-014")];\n  const match = matchDeliveryVehicle({ sendatrackVehicleId: "send-2", truck: "TRK-014" }, vehicles);\n  assert.equal(match.vehicle?.id, "send-2");\n  assert.equal(match.reason, "id");\n});\n\ntest("links a unique normalized manual truck name", () => {\n  const match = matchDeliveryVehicle({ sendatrackVehicleId: "", truck: "trk 014" }, [vehicle("send-1", "TRK-014")]);\n  assert.equal(match.vehicle?.id, "send-1");\n  assert.equal(match.reason, "normalized_name");\n});\n\ntest("does not auto-link an ambiguous normalized name", () => {\n  const match = matchDeliveryVehicle({ sendatrackVehicleId: "", truck: "TRK 014" }, [vehicle("send-1", "TRK-014"), vehicle("send-2", "TRK 014")]);\n  assert.equal(match.vehicle, null);\n  assert.equal(match.reason, "ambiguous");\n  assert.equal(match.candidates.length, 2);\n});\n\ntest("does not fuzzy-match a different vehicle number", () => {\n  const match = matchDeliveryVehicle({ sendatrackVehicleId: "", truck: "TRK-14" }, [vehicle("send-1", "TRK-014"), vehicle("send-2", "TRK-140")]);\n  assert.equal(match.vehicle, null);\n  assert.equal(match.reason, "none");\n});\n''')

          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:origin-preference": "node --experimental-strip-types --test tests/origin-preference.test.mjs",\n'
          if 'test:vehicle-linking' not in s:
            if marker not in s: raise SystemExit('package marker missing')
            s = s.replace(marker, marker + '    "test:vehicle-linking": "node --experimental-strip-types --test tests/vehicle-linking.test.mjs",\n')
          p.write_text(s)

          p = Path('.github/workflows/vercel-build-check.yml')
          s = p.read_text()
          marker = '      - name: Verify remembered origin preference\n        run: pnpm run test:origin-preference\n'
          if 'Verify safe vehicle linking' not in s:
            if marker not in s: raise SystemExit('CI marker missing')
            s = s.replace(marker, marker + '      - name: Verify safe vehicle linking\n        run: pnpm run test:vehicle-linking\n')
          p.write_text(s)

      - name: Test vehicle linking
        run: node --experimental-strip-types --test tests/vehicle-linking.test.mjs
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/vehicle-linking.ts app/lib/delivery-store.memory.ts app/lib/delivery-store.postgres.ts app/lib/delivery-store.cloudflare.ts app/api/deliveries/route.ts tests/vehicle-linking.test.mjs package.json .github/workflows/vercel-build-check.yml
          git commit -m "harden automatic SENDATRACK vehicle linking"
          git push

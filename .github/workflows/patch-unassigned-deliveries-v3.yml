name: Patch unassigned deliveries v3

on:
  push:
    paths:
      - ".github/workflows/patch-unassigned-deliveries-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply unassigned delivery patch with Node-compatible import
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/patch-unassigned-deliveries.yml').read_text()
          start = source.index('      - name: Keep new parcels unassigned until a truck is confirmed')
          run_start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - run: pnpm install --no-frozen-lockfile', run_start)
          script = textwrap.dedent(source[run_start:end])
          script = script.replace('import { isUnassignedVehicle } from "./delivery-vehicle-choice";', 'import { isUnassignedVehicle } from "./delivery-vehicle-choice.ts";')
          exec(compile(script, '<unassigned-delivery-patch>', 'exec'))
      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:delivery-vehicle-choice
          pnpm run test:vehicle-linking
          pnpm run test:unassigned-trip-safety
          pnpm run test:stop-plans
          pnpm run test:trip-record
          pnpm run test:automation-trip-sync
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app tests package.json
          git commit -m "keep parcels unassigned until truck confirmation"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

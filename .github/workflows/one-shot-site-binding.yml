name: One-shot Morocco city fallback routing

on:
  push:
    paths:
      - .github/workflows/one-shot-site-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add city-specific fallback route points
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/lib/route-progress.ts')
          t = p.read_text()
          old = '''const knownDestinations: Array<{ names: string[]; point: [number, number] }> = [\n  { names: ["CASABLANCA"], point: [-7.5898, 33.5731] },\n  { names: ["RABAT"], point: [-6.8498, 33.9716] },\n  { names: ["TANGIER", "TANGER"], point: [-5.8128, 35.7673] },\n  { names: ["BRUSSELS", "BRUXELLES", "BRUSSEL"], point: [4.3517, 50.8503] },\n  { names: ["ANTWERP", "ANTWERPEN", "ANVERS"], point: [4.4025, 51.2194] },\n  { names: ["LIÈGE", "LIEGE", "LUIK"], point: [5.5797, 50.6326] },\n];'''
          new = '''const knownDestinations: Array<{ names: string[]; point: [number, number] }> = [\n  // City-level fallbacks only. Exact agency coordinates override these points\n  // as soon as a confirmed map pin is available.\n  { names: ["CASABLANCA"], point: [-7.5898, 33.5731] },\n  { names: ["RABAT", "SALÉ", "SALE"], point: [-6.7985, 34.0337] },\n  { names: ["TANGER MED", "TANGIER MED", "KSAR AL MAJAZ"], point: [-5.5000, 35.8900] },\n  { names: ["TANGIER", "TANGER"], point: [-5.8128, 35.7673] },\n  { names: ["TÉTOUAN", "TETOUAN"], point: [-5.3626, 35.5889] },\n  { names: ["MARRAKECH", "MARRAKESH"], point: [-7.9811, 31.6295] },\n  { names: ["AGADIR", "TIKIOUINE"], point: [-9.5981, 30.4278] },\n  { names: ["KHOURIBGA"], point: [-6.9063, 32.8811] },\n  { names: ["FQUIH BEN SALAH", "FQIH BEN SALAH"], point: [-6.6906, 32.5009] },\n  { names: ["BRUSSELS", "BRUXELLES", "BRUSSEL"], point: [4.3517, 50.8503] },\n  { names: ["ANTWERP", "ANTWERPEN", "ANVERS"], point: [4.4025, 51.2194] },\n  { names: ["LIÈGE", "LIEGE", "LUIK"], point: [5.5797, 50.6326] },\n];'''
          if old not in t: raise SystemExit('known destination routing anchor not found')
          p.write_text(t.replace(old, new, 1))

          p = Path('tests/route-progress.test.mjs')
          t = p.read_text()
          anchor = 'test("uses an exact customer site instead of the city fallback when provided", () => {\n'
          addition = '''test("uses the correct Morocco city fallback instead of Casablanca for agency stops", () => {\n  const marrakech = calculateRouteMetrics(31.6295, -7.9811, "12 Boulevard Essaouira, Marrakech, Maroc");\n  assert.equal(marrakech.progress, 100);\n  assert.ok(marrakech.distanceToDestinationKm < 0.1);\n\n  const agadir = calculateRouteMetrics(30.4278, -9.5981, "Lot 103/A Zaitoune Tikiouine, Agadir, Maroc");\n  assert.equal(agadir.progress, 100);\n  assert.ok(agadir.distanceToDestinationKm < 0.1);\n\n  const tetouan = calculateRouteMetrics(35.5889, -5.3626, "146 Avenue Cortoba, Tétouan, Maroc");\n  assert.equal(tetouan.progress, 100);\n  assert.ok(tetouan.distanceToDestinationKm < 0.1);\n});\n\n'''
          if anchor not in t: raise SystemExit('route test anchor not found')
          p.write_text(t.replace(anchor, addition + anchor, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/lib/route-progress.ts tests/route-progress.test.mjs
          git commit -m "route agency deliveries to their Morocco cities"
          git push

name: One-shot delivery site binding fix

on:
  push:
    paths:
      - .github/workflows/one-shot-site-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix D1 insert placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/lib/delivery-store.cloudflare.ts')
          t = p.read_text()
          old = '      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?`)'
          new = '      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`)'
          count = t.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 malformed D1 VALUES blocks, found {count}')
          p.write_text(t.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/lib/delivery-store.cloudflare.ts
          git commit -m "fix D1 site binding inserts"
          git push

name: Apply trip snapshot refresh patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh persisted trip snapshots and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected block not found in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'app/lib/delivery-store.memory.ts',
            `    if (existing) {\n      existing.truck = input.truck;\n      existing.sendatrackVehicleId = input.sendatrackVehicleId;\n      existing.vehicleKey = input.vehicleKey;\n      existing.status = input.status;\n      existing.updatedAt = new Date();\n      return { ...existing, stops: existing.stops.map((stop) => ({ ...stop })) };\n    }`,
            `    if (existing) {\n      existing.routeTemplateId = input.routeTemplateId;\n      existing.vehicleKey = input.vehicleKey;\n      existing.truck = input.truck;\n      existing.sendatrackVehicleId = input.sendatrackVehicleId;\n      existing.originSiteId = input.originSiteId;\n      existing.stops = input.stops.map((stop) => ({ ...stop }));\n      existing.status = input.status;\n      existing.updatedAt = new Date();\n      return { ...existing, stops: existing.stops.map((stop) => ({ ...stop })) };\n    }`
          );

          replaceExact(
            'app/lib/delivery-store.postgres.ts',
            `      await sql\`UPDATE trips SET vehicle_key = \${input.vehicleKey}, truck = \${input.truck}, sendatrack_vehicle_id = \${input.sendatrackVehicleId}, status = \${input.status}, updated_at = \${new Date().toISOString()} WHERE company_id = \${input.companyId} AND id = \${input.id}\`;`,
            `      await sql\`UPDATE trips SET route_template_id = \${input.routeTemplateId}, vehicle_key = \${input.vehicleKey}, truck = \${input.truck}, sendatrack_vehicle_id = \${input.sendatrackVehicleId}, origin_site_id = \${input.originSiteId}, stops_json = \${JSON.stringify(input.stops.map((stop) => ({ ...stop, plannedArrivalAt: stop.plannedArrivalAt?.toISOString() ?? null })))}, status = \${input.status}, updated_at = \${new Date().toISOString()} WHERE company_id = \${input.companyId} AND id = \${input.id}\`;`
          );

          replaceExact(
            'app/lib/delivery-store.cloudflare.ts',
            `    } else {\n      await db().prepare("UPDATE trips SET vehicle_key = ?, truck = ?, sendatrack_vehicle_id = ?, status = ?, updated_at = ? WHERE company_id = ? AND id = ?").bind(input.vehicleKey, input.truck, input.sendatrackVehicleId, input.status, Date.now(), input.companyId, input.id).run();\n    }`,
            `    } else {\n      const stopsJson = JSON.stringify(input.stops.map((stop) => ({ ...stop, plannedArrivalAt: stop.plannedArrivalAt?.getTime() ?? null })));\n      await db().prepare("UPDATE trips SET route_template_id = ?, vehicle_key = ?, truck = ?, sendatrack_vehicle_id = ?, origin_site_id = ?, stops_json = ?, status = ?, updated_at = ? WHERE company_id = ? AND id = ?").bind(input.routeTemplateId, input.vehicleKey, input.truck, input.sendatrackVehicleId, input.originSiteId, stopsJson, input.status, Date.now(), input.companyId, input.id).run();\n    }`
          );

          const test = `import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst memory = fs.readFileSync(new URL("../app/lib/delivery-store.memory.ts", import.meta.url), "utf8");\nconst postgres = fs.readFileSync(new URL("../app/lib/delivery-store.postgres.ts", import.meta.url), "utf8");\nconst cloudflare = fs.readFileSync(new URL("../app/lib/delivery-store.cloudflare.ts", import.meta.url), "utf8");\n\ntest("trip upserts refresh the complete mutable snapshot", () => {\n  assert.match(memory, /existing\\.routeTemplateId = input\\.routeTemplateId/);\n  assert.match(memory, /existing\\.originSiteId = input\\.originSiteId/);\n  assert.match(memory, /existing\\.stops = input\\.stops\\.map/);\n\n  assert.match(postgres, /UPDATE trips SET route_template_id = .*origin_site_id = .*stops_json = .*status =/s);\n  assert.match(cloudflare, /UPDATE trips SET route_template_id = \\?, vehicle_key = \\?, truck = \\?, sendatrack_vehicle_id = \\?, origin_site_id = \\?, stops_json = \\?, status = \\?/);\n});\n`;
          fs.writeFileSync('tests/trip-upsert-refresh.test.mjs', test);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['test:trip-upsert-refresh'] = 'node --test tests/trip-upsert-refresh.test.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          node --test tests/trip-upsert-refresh.test.mjs
          git diff --check

          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/delivery-store.memory.ts app/lib/delivery-store.postgres.ts app/lib/delivery-store.cloudflare.ts tests/trip-upsert-refresh.test.mjs package.json
          git commit -m "refresh persisted trip snapshots on upsert"
          git push origin HEAD:main

name: One-shot customer contact patch

on:
  push:
    paths:
      - .github/workflows/one-shot-tracking-expiry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted customer contact patch
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/deliveries/route.ts')
          text = route.read_text()

          needle = 'import { publicTrackingIsActive, trackingExpiresAt } from "../../lib/tracking-access";\n'
          replacement = needle + 'import { normalizeCustomerPhone } from "../../lib/customer-contact";\n'
          if needle not in text:
              raise SystemExit('contact import anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '    if (!customer || !destination || !truck || (!plannedArrivalAt && !validLegacyEta)) {\n      return Response.json({ error: "customer, destination, truck, and a valid planned arrival are required" }, { status: 400 });\n    }\n\n'
          replacement = needle + '    const contactInput = String(payload.contact ?? "").trim();\n    const contact = normalizeCustomerPhone(contactInput);\n    if (contact === null) {\n      return Response.json({ error: "contact must use an international phone format, for example +212... or +32..." }, { status: 400 });\n    }\n\n'
          if needle not in text:
              raise SystemExit('contact validation anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '      contact: String(payload.contact ?? "").trim(),\n'
          replacement = '      contact,\n'
          if needle not in text:
              raise SystemExit('contact persistence anchor not found')
          route.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/api/deliveries/route.ts
          git commit -m "validate customer WhatsApp contact on delivery creation"
          git push

name: One-shot departure freshness patch

on:
  push:
    paths:
      - .github/workflows/one-shot-tracking-expiry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply departure freshness patch
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('app/lib/delivery-store.memory.ts'),
              Path('app/lib/delivery-store.postgres.ts'),
              Path('app/lib/delivery-store.cloudflare.ts'),
          ]

          for path in files:
              text = path.read_text()
              old = '      const state = deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm);\n      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n'
              new = '      const positionAgeMinutes = Math.max(0, Math.round((Date.now() - vehicle.updatedAt) / 60_000));\n      const state = deriveDeliveryState(delivery.status, metrics, vehicle.speed, previousProgress, delivery.arrivalRadiusKm, positionAgeMinutes);\n'
              if old not in text:
                  raise SystemExit(f'departure state anchor not found in {path}')
              path.write_text(text.replace(old, new, 1))

          tests = Path('tests/route-progress.test.mjs')
          text = tests.read_text()
          anchor = 'test("does not move customer progress backwards after a noisier GPS fix", () => {\n'
          addition = '''test("does not mark departure from a stale GPS position", () => {\n  const moved = {\n    progress: 3, routeDistanceKm: 1000, completedDistanceKm: 30, remainingDistanceKm: 970,\n    distanceFromOriginKm: 30, distanceToDestinationKm: 970,\n  };\n  const state = deriveDeliveryState("Loading", moved, 60, 0, 0.5, 45);\n  assert.equal(state.status, "Loading");\n});\n\ntest("does not mark departure from GPS displacement while the truck is stopped", () => {\n  const moved = {\n    progress: 3, routeDistanceKm: 1000, completedDistanceKm: 30, remainingDistanceKm: 970,\n    distanceFromOriginKm: 30, distanceToDestinationKm: 970,\n  };\n  const state = deriveDeliveryState("Loading", moved, 0, 0, 0.5, 2);\n  assert.equal(state.status, "Loading");\n});\n\ntest("marks departure only after fresh movement beyond the departure zone", () => {\n  const moved = {\n    progress: 2, routeDistanceKm: 1000, completedDistanceKm: 20, remainingDistanceKm: 980,\n    distanceFromOriginKm: 20, distanceToDestinationKm: 980,\n  };\n  const state = deriveDeliveryState("Loading", moved, 35, 0, 0.5, 2);\n  assert.equal(state.status, "In transit");\n});\n\n'''
          if anchor not in text:
              raise SystemExit('route test anchor not found')
          tests.write_text(text.replace(anchor, addition + anchor, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/lib/delivery-store.memory.ts app/lib/delivery-store.postgres.ts app/lib/delivery-store.cloudflare.ts tests/route-progress.test.mjs
          git commit -m "require fresh movement before automatic departure"
          git push

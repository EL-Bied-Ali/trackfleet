name: One-shot tenant isolation fix

on:
  push:
    paths:
      - .github/workflows/one-shot-tracking-expiry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix pending notification tenant scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/lib/delivery-store.postgres.ts')
          t = p.read_text()
          old = "      WHERE (d.company_id = ${companyId} OR d.company_id = 'demo')\n"
          new = "      WHERE d.company_id = ${companyId}\n"
          if old not in t:
              raise SystemExit('postgres notification tenant anchor not found')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/lib/delivery-store.postgres.ts
          git commit -m "isolate postgres notification queue by company"
          git push

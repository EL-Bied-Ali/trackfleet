name: One-shot TrackFleet UI upgrade

on:
  push:
    paths:
      - .github/workflows/one-shot-ui-upgrade.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch TrackFleet UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()

          def replace(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace(
              'type DeliveryEventType = "DEPARTED" | "PROGRESS_25" | "PROGRESS_50" | "PROGRESS_75" | "NEAR_DESTINATION" | "ARRIVED" | "GPS_STALE";',
              'type DeliveryEventType = "DEPARTED" | "PROGRESS_25" | "PROGRESS_50" | "PROGRESS_75" | "NEAR_DESTINATION" | "DELAY_DETECTED" | "ARRIVED" | "GPS_STALE";',
              'delivery event type',
          )

          replace(
              '  gpsFresh?: boolean;\n};',
              '  gpsFresh?: boolean;\n  plannedArrivalAt?: string | null;\n  estimatedArrivalAt?: string | null;\n  etaDelayMinutes?: number | null;\n  etaConfidence?: "none" | "low" | "medium";\n  etaSource?: "unavailable" | "baseline-model" | "observed-pace";\n  effectiveSpeedKmh?: number | null;\n  destinationLatitude?: number | null;\n  destinationLongitude?: number | null;\n  arrivalRadiusKm?: number;\n};',
              'delivery ETA fields',
          )

          replace(
              'type CompanyIdentity = { account: string; user: string };',
              'type CompanyIdentity = { account: string; user: string };\ntype KnownSite = { id: string; label: string; address: string; country: "BE" | "MA"; latitude: number | null; longitude: number | null; arrivalRadiusKm: number; geofenceReady: boolean };',
              'known site type',
          )

          replace(
              '  const [deliveryEvents, setDeliveryEvents] = useState<DeliveryEventRow[]>([]);',
              '  const [deliveryEvents, setDeliveryEvents] = useState<DeliveryEventRow[]>([]);\n  const [knownSites, setKnownSites] = useState<KnownSite[]>([]);',
              'known site state',
          )

          marker = '''  useEffect(() => {\n    const requestedLocale = new URLSearchParams(window.location.search).get("lang");'''
          insertion = '''  useEffect(() => {\n    if (authState !== "authenticated") return;\n    let active = true;\n    void fetch("/api/sites", { cache: "no-store" })\n      .then(async (response) => response.ok ? response.json() as Promise<{ sites: KnownSite[] }> : { sites: [] })\n      .then((data) => { if (active) setKnownSites(data.sites ?? []); })\n      .catch(() => { if (active) setKnownSites([]); });\n    return () => { active = false; };\n  }, [authState]);\n\n  useEffect(() => {\n    const requestedLocale = new URLSearchParams(window.location.search).get("lang");'''
          replace(marker, insertion, 'site loading effect')

          old_create = '''    const draftDelivery = {\n      customer: String(form.get("customer")),\n      destination: String(form.get("destination")),\n      truck,\n      sendatrackVehicleId: liveVehicle?.id ?? "",\n      eta: String(form.get("eta")),\n      contact: String(form.get("contact")),\n    };'''
          new_create = '''    const destination = String(form.get("destination") ?? "").trim();\n    const selectedSite = knownSites.find((site) => site.address === destination || site.label === destination);\n    const plannedArrivalInput = String(form.get("plannedArrivalAt") ?? "").trim();\n    const plannedArrivalAt = plannedArrivalInput ? new Date(plannedArrivalInput).toISOString() : "";\n    const draftDelivery = {\n      customer: String(form.get("customer")),\n      destination,\n      destinationSiteId: selectedSite?.id ?? "",\n      destinationLatitude: selectedSite?.latitude ?? null,\n      destinationLongitude: selectedSite?.longitude ?? null,\n      arrivalRadiusKm: selectedSite?.arrivalRadiusKm ?? 0.5,\n      truck,\n      sendatrackVehicleId: liveVehicle?.id ?? "",\n      plannedArrivalAt,\n      contact: String(form.get("contact")),\n    };'''
          replace(old_create, new_create, 'create delivery payload')

          replace(
              '          NEAR_DESTINATION: "Le camion approche",\n          ARRIVED: "Livraison arrivée",',
              '          NEAR_DESTINATION: "Le camion approche",\n          DELAY_DETECTED: "Retard détecté",\n          ARRIVED: "Livraison arrivée",',
              'French delay copy',
          )
          replace(
              '          NEAR_DESTINATION: "Truck is approaching",\n          ARRIVED: "Delivery arrived",',
              '          NEAR_DESTINATION: "Truck is approaching",\n          DELAY_DETECTED: "Delay detected",\n          ARRIVED: "Delivery arrived",',
              'English delay copy',
          )
          replace(
              '          NEAR_DESTINATION: "Vrachtwagen nadert",\n          ARRIVED: "Levering aangekomen",',
              '          NEAR_DESTINATION: "Vrachtwagen nadert",\n          DELAY_DETECTED: "Vertraging gedetecteerd",\n          ARRIVED: "Levering aangekomen",',
              'Dutch delay copy',
          )

          old_eta_setup = '''    const gpsText = selected.positionAgeMinutes == null\n      ? copy.noGps\n      : selected.gpsFresh\n        ? `${copy.fresh} · ${selected.positionAgeMinutes} min`\n        : `${selected.positionAgeMinutes} min`;'''
          new_eta_setup = '''    const gpsText = selected.positionAgeMinutes == null\n      ? copy.noGps\n      : selected.gpsFresh\n        ? `${copy.fresh} · ${selected.positionAgeMinutes} min`\n        : `${selected.positionAgeMinutes} min`;\n    const displayedEta = selected.estimatedArrivalAt\n      ? new Date(selected.estimatedArrivalAt).toLocaleString(dateLocale, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })\n      : selected.plannedArrivalAt\n        ? new Date(selected.plannedArrivalAt).toLocaleString(dateLocale, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })\n        : selected.eta;\n    const etaNote = selected.etaDelayMinutes != null && selected.etaDelayMinutes >= 60\n      ? `+${Math.round(selected.etaDelayMinutes / 60)} h`\n      : selected.etaConfidence === "medium"\n        ? (locale === "fr" ? "Estimation basée sur le trajet réel" : locale === "nl" ? "Schatting op basis van werkelijk traject" : "Estimate based on observed trip pace")\n        : (locale === "fr" ? "Estimation indicative" : locale === "nl" ? "Indicatieve schatting" : "Indicative estimate");'''
          replace(old_eta_setup, new_eta_setup, 'ETA display setup')

          replace(
              '<strong>{selected.eta}</strong>\n              <small className={`eta-${selected.status.toLowerCase().replace(" ", "-")}`}>{customerCopy.etaNote}</small>',
              '<strong>{displayedEta}</strong>\n              <small className={`eta-${selected.etaDelayMinutes != null && selected.etaDelayMinutes >= 60 ? "delayed" : selected.status.toLowerCase().replace(" ", "-")}`}>{etaNote}</small>',
              'customer ETA card',
          )

          replace(
              '<div><dt>{t.eta}</dt><dd>{selected.eta}</dd></div>',
              '<div><dt>{t.eta}</dt><dd>{selected.estimatedArrivalAt ? new Date(selected.estimatedArrivalAt).toLocaleString(locale === "fr" ? "fr-BE" : locale === "nl" ? "nl-BE" : "en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : selected.eta}</dd></div>',
              'popover ETA',
          )

          old_form = '''<form onSubmit={createDelivery}><label>{t.customerCompany}<input name="customer" required autoFocus placeholder={t.customerPlaceholder} /></label><label>{t.destination}<input name="destination" required placeholder={t.destinationPlaceholder} /></label><div className="form-row"><label>{t.assignTruck}<select name="sendatrackVehicleId" defaultValue={integration.vehicles[0]?.id ?? "TRK-005"}>{integration.vehicles.length ? integration.vehicles.map((vehicle) => <option key={vehicle.id} value={vehicle.id}>{vehicle.name}</option>) : <><option>TRK-005</option><option>TRK-008</option><option>TRK-012</option><option>TRK-017</option></>}</select></label><label>{t.expectedArrival}<input name="eta" required type="time" defaultValue="15:30" /></label></div><label>{t.customerContact} <span>({t.optional})</span><input name="contact" placeholder={t.contactPlaceholder} /></label>'''
          new_form = '''<form onSubmit={createDelivery}><label>{t.customerCompany}<input name="customer" required autoFocus placeholder={t.customerPlaceholder} /></label><label>{t.destination}<input name="destination" required list="trackfleet-known-sites" placeholder={t.destinationPlaceholder} /><datalist id="trackfleet-known-sites">{knownSites.map((site) => <option key={site.id} value={site.address}>{site.label}</option>)}</datalist></label><div className="form-row"><label>{t.assignTruck}<select name="sendatrackVehicleId" defaultValue={integration.vehicles[0]?.id ?? "TRK-005"}>{integration.vehicles.length ? integration.vehicles.map((vehicle) => <option key={vehicle.id} value={vehicle.id}>{vehicle.name}</option>) : <><option>TRK-005</option><option>TRK-008</option><option>TRK-012</option><option>TRK-017</option></>}</select></label><label>{t.expectedArrival}<input name="plannedArrivalAt" required type="datetime-local" /></label></div><label>{t.customerContact} <span>({t.optional})</span><input name="contact" placeholder={t.contactPlaceholder} /></label>'''
          replace(old_form, new_form, 'delivery form')

          path.write_text(text)
          PY
      - name: Commit UI upgrade
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --check
          git commit -m "show dynamic ETA and known delivery sites"
          git push

name: Patch explicit trip UI identity

on:
  push:
    paths:
      - ".github/workflows/patch-trip-ui-identity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Keep active trip cards uniquely identified
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/lib/tour-view.ts')
          s = p.read_text()
          s = s.replace('  tripInstanceId?: string | null;\n', '  tripId?: string | null;\n  tripInstanceId?: string | null;\n', 1)
          s = s.replace('export function activeTourDisplayId(plan: Pick<TourPlanLike, "vehicleKey" | "tripInstanceId">) {\n  if (plan.tripInstanceId?.trim()) return plan.tripInstanceId;\n', 'export function activeTourDisplayId(plan: Pick<TourPlanLike, "vehicleKey" | "tripId" | "tripInstanceId">) {\n  if (plan.tripId?.trim()) return plan.tripId;\n  if (plan.tripInstanceId?.trim()) return plan.tripInstanceId;\n', 1)
          if 'export function activeTourKey' not in s:
            marker = 'export function tourDeliveryCount('
            helper = 'export function activeTourKey(plan: Pick<TourPlanLike, "vehicleKey" | "tripId" | "tripInstanceId">) {\n  return plan.tripId?.trim() || plan.tripInstanceId?.trim() || plan.vehicleKey;\n}\n\n'
            s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('import { activeTourDisplayId, stopSequence, tourCustomerCount, tourDeliveryCount } from "./lib/tour-view";', 'import { activeTourDisplayId, activeTourKey, stopSequence, tourCustomerCount, tourDeliveryCount } from "./lib/tour-view";', 1)
          s = s.replace('{stopPlans.map((plan) => <article className="tour-card" key={plan.vehicleKey}>', '{stopPlans.map((plan) => <article className="tour-card" key={activeTourKey(plan)}>')
          p.write_text(s)

          p = Path('tests/tour-view.test.mjs')
          s = p.read_text()
          s = s.replace('import { activeTourDisplayId, stopSequence, tourCustomerCount, tourDeliveryCount } from "../app/lib/tour-view.ts";', 'import { activeTourDisplayId, activeTourKey, stopSequence, tourCustomerCount, tourDeliveryCount } from "../app/lib/tour-view.ts";')
          if 'explicit trip ids keep two trips of the same truck visually distinct' not in s:
            s += '''\n\ntest("explicit trip ids keep two trips of the same truck visually distinct", () => {\n  const base = { vehicleKey: "gps-1", truck: "TRK-1", sendatrackVehicleId: "gps-1", stops: [] };\n  const a = { ...base, tripId: "TRIP-A", tripInstanceId: "LEGACY-A" };\n  const b = { ...base, tripId: "TRIP-B", tripInstanceId: "LEGACY-B" };\n  assert.equal(activeTourDisplayId(a), "TRIP-A");\n  assert.equal(activeTourDisplayId(b), "TRIP-B");\n  assert.notEqual(activeTourKey(a), activeTourKey(b));\n});\n'''
          p.write_text(s)

          Path('tests/trip-ui-key-contract.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst page = fs.readFileSync(new URL("../app/page.tsx", import.meta.url), "utf8");\n\ntest("active trip cards use trip-aware React keys", () => {\n  assert.match(page, /key=\{activeTourKey\(plan\)\}/);\n  assert.doesNotMatch(page, /key=\{plan\.vehicleKey\}/);\n});\n''')

          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:tour-view": "node --experimental-strip-types --test tests/tour-view.test.mjs",\n'
          if marker not in s: raise SystemExit('tour view script marker missing')
          if 'test:trip-ui-key-contract' not in s:
            s = s.replace(marker, marker + '    "test:trip-ui-key-contract": "node --test tests/trip-ui-key-contract.test.mjs",\n', 1)
          p.write_text(s)
      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:tour-view
          pnpm run test:trip-ui-key-contract
          pnpm run test:explicit-trip-membership
          pnpm run test:trip-assignment
          pnpm run test:planned-trip-assignment-contract
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app tests package.json
          git commit -m "keep same-truck trips distinct in dashboard"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

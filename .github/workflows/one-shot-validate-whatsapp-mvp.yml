name: Validate WhatsApp MVP once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Run focused WhatsApp MVP validation
        shell: bash
        run: |
          set +e
          : > .whatsapp-mvp-validation.txt
          run_check() {
            name="$1"
            shift
            echo "--- $name ---" >> .whatsapp-mvp-validation.txt
            "$@" >> .whatsapp-mvp-validation.txt 2>&1
            code=$?
            echo "RESULT $name=$code" >> .whatsapp-mvp-validation.txt
            return $code
          }
          failed=0
          run_check whatsapp_mvp pnpm run test:whatsapp-mvp || failed=1
          run_check notification_policy pnpm run test:notification-policy || failed=1
          run_check notification_queue pnpm run test:notifications || failed=1
          run_check whatsapp_preview pnpm run test:whatsapp-preview || failed=1
          run_check whatsapp_readiness pnpm run test:whatsapp-readiness || failed=1
          run_check typecheck pnpm exec tsc -p tsconfig.vercel.json --noEmit || failed=1
          run_check lint pnpm exec eslint app/lib/delivery-events.ts app/lib/notification-policy.ts app/lib/whatsapp-automation.ts app/lib/notification-runner.ts app/lib/server-automation.ts app/api/deliveries/route.ts app/api/whatsapp/preview/route.ts tests/whatsapp-mvp-flow.test.mjs --max-warnings=0 || failed=1
          echo "FINAL_RESULT=$failed" >> .whatsapp-mvp-validation.txt
          git config user.name "TrackFleet validation"
          git config user.email "actions@users.noreply.github.com"
          git add .whatsapp-mvp-validation.txt
          git commit -m "record WhatsApp MVP validation result"
          git push

name: Patch React quality warning

on:
  push:
    paths:
      - ".github/workflows/patch-ci-quality.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remove final React Hook warning
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '          if (data.deliveries.length && !data.deliveries.some((delivery) => delivery.id === selectedId)) setSelectedId(data.deliveries[0].id);'
          new = '          setSelectedId((current) => data.deliveries.length && !data.deliveries.some((delivery) => delivery.id === current) ? data.deliveries[0].id : current);'
          if old in s:
            s = s.replace(old, new, 1)
          old = '        if (active && !silent) setToast(t.cloudReconnecting);'
          new = '        if (active && !silent) setToast(translations[locale].cloudReconnecting);'
          if old in s:
            s = s.replace(old, new, 1)
          old = '    return () => { active = false; window.clearInterval(timer); };\n  }, [authState]);'
          new = '    return () => { active = false; window.clearInterval(timer); };\n  }, [authState, locale]);'
          if old in s:
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify zero-warning lint typecheck and builds
        run: |
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit page fix
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "Page fix already present"
            exit 0
          fi
          git commit -m "fix delivery refresh hook dependencies"
          git pull --rebase origin main
          git push

name: Patch unload departure guard

on:
  push:
    branches: [audit-hardening-20260819]
    paths:
      - ".github/workflows/patch-arrival-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-hardening-20260819
      - name: Require departure before unloading dwell
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/lib/server-automation.ts')
          text = path.read_text()
          old = '      insideArrivalZone = positionAgeMinutes <= 30\n        && distanceToDestinationKm <= radiusKm'
          new = '      insideArrivalZone = delivery.status !== "Loading"\n        && positionAgeMinutes <= 30\n        && distanceToDestinationKm <= radiusKm'
          if old not in text:
              raise SystemExit('arrival zone marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/server-automation.ts
          git commit -m "require departure before unload dwell" || exit 0
          git push origin HEAD:audit-hardening-20260819

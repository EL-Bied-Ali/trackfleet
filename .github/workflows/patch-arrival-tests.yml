name: Patch manual completion refresh

on:
  push:
    branches: [audit-hardening-20260819]
    paths:
      - ".github/workflows/patch-arrival-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-hardening-20260819
      - name: Refresh dashboard after manual completion
        run: |
          python - <<'PY'
          from pathlib import Path
          manager = Path('app/SiteManager.tsx')
          text = manager.read_text()
          old = '      window.dispatchEvent(new Event("trackfleet-deliveries-changed"));'
          new = '      window.location.reload();'
          if old not in text:
              raise SystemExit('manual completion refresh marker not found')
          manager.write_text(text.replace(old, new, 1))

          test_path = Path('tests/delivery-completion.test.mjs')
          test_text = test_path.read_text()
          marker = '  assert.match(siteManager, /confirmDelivered: true/);'
          refresh_assertion = '  assert.match(siteManager, /window\\.location\\.reload\\(\\)/);'
          if refresh_assertion not in test_text:
              test_text = test_text.replace(marker, marker + '\n' + refresh_assertion)
          test_path.write_text(test_text)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/SiteManager.tsx tests/delivery-completion.test.mjs
          git commit -m "refresh dashboard after manual completion" || exit 0
          git push origin HEAD:audit-hardening-20260819

name: Patch unloading delay suppression

on:
  push:
    branches: [audit-hardening-20260819]
    paths:
      - ".github/workflows/patch-arrival-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-hardening-20260819
      - name: Suppress authenticated delay detection during unloading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/deliveries/route.ts')
          text = path.read_text()
          old = '    delivered: row.status === "Delivered",\n    alreadyDetected: events.some((event) => event.type === "DELAY_DETECTED"),'
          new = '    delivered: row.status === "Delivered" || events.some((event) => event.type === "ARRIVED_AT_SITE"),\n    alreadyDetected: events.some((event) => event.type === "DELAY_DETECTED"),'
          if old not in text:
              raise SystemExit('authenticated delay detection marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/deliveries/route.ts
          git commit -m "suppress delay during unloading refresh" || exit 0
          git push origin HEAD:audit-hardening-20260819

name: Patch permanent unload regression coverage

on:
  push:
    branches: [audit-hardening-20260819]
    paths:
      - ".github/workflows/patch-arrival-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-hardening-20260819
      - name: Expand permanent unload regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/vercel-build-check.yml')
          text = path.read_text()
          old = '      - name: Verify unload dwell and manual delivery fallback\n        run: node --experimental-strip-types --test tests/delivery-completion.test.mjs'
          new = '      - name: Verify unload dwell and manual delivery fallback\n        run: node --experimental-strip-types --test tests/delivery-completion.test.mjs tests/unloading-delay-suppression.test.mjs tests/unload-departure-guard.test.mjs'
          if old not in text:
              raise SystemExit('permanent unload test step marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/vercel-build-check.yml
          git commit -m "expand unload regression coverage" || exit 0
          git push origin HEAD:audit-hardening-20260819

name: Patch arrival regression expectations

on:
  push:
    branches: [audit-hardening-20260819]
    paths:
      - ".github/workflows/patch-arrival-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-hardening-20260819
      - name: Update arrival expectations and schema event contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/route-progress.test.mjs')
          text = path.read_text()
          old1 = 'assert.equal(deriveDeliveryState("In transit", metrics, 0, 99, 1).status, "Delivered");'
          new1 = 'assert.equal(deriveDeliveryState("In transit", metrics, 0, 99, 1).status, "In transit");\n  assert.equal(deriveDeliveryState("In transit", metrics, 0, 99, 1).progress, 99);'
          old2 = 'assert.deepEqual(deriveDeliveryState("In transit", destination, 0), { status: "Delivered", progress: 100 });'
          new2 = 'assert.deepEqual(deriveDeliveryState("In transit", destination, 0), { status: "In transit", progress: 99 });'
          if old1 in text:
              text = text.replace(old1, new1)
          if old2 in text:
              text = text.replace(old2, new2)
          path.write_text(text)

          schema = Path('db/schema.ts')
          schema_text = schema.read_text()
          old_events = '    "DELAY_DETECTED",\n    "ARRIVED",\n    "GPS_STALE",'
          new_events = '    "DELAY_DETECTED",\n    "ARRIVED_AT_SITE",\n    "ARRIVED",\n    "MANUAL_DELIVERED",\n    "GPS_STALE",'
          if old_events in schema_text:
              schema_text = schema_text.replace(old_events, new_events)
          schema.write_text(schema_text)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/route-progress.test.mjs db/schema.ts
          git commit -m "align arrival dwell tests and event schema" || exit 0
          git push origin HEAD:audit-hardening-20260819

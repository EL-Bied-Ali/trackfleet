name: Patch route history persistence

on:
  push:
    paths:
      - ".github/workflows/patch-route-history.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch persistent ETA route history
        shell: python
        run: |
          from pathlib import Path

          # Postgres
          p = Path('app/lib/delivery-store.postgres.ts')
          s = p.read_text()
          create_marker = '''    await sql`CREATE INDEX IF NOT EXISTS idx_eta_observations_delivery_position ON delivery_eta_observations(delivery_id, position_at DESC)`;\n'''
          if 'ALTER TABLE delivery_eta_observations ADD COLUMN IF NOT EXISTS route_template_id' not in s:
            if create_marker not in s: raise SystemExit('postgres ETA schema marker missing')
            s = s.replace(create_marker, create_marker + '''    await sql`ALTER TABLE delivery_eta_observations ADD COLUMN IF NOT EXISTS route_template_id text`;\n    await sql`ALTER TABLE delivery_eta_observations ADD COLUMN IF NOT EXISTS trip_instance_id text`;\n    await sql`ALTER TABLE delivery_eta_observations ADD COLUMN IF NOT EXISTS destination_site_id text`;\n    await sql`CREATE INDEX IF NOT EXISTS idx_eta_observations_route_destination ON delivery_eta_observations(route_template_id, destination_site_id, position_at DESC)`;\n''')

          old_insert = '''    const rows = await sql`INSERT INTO delivery_eta_observations (\n      delivery_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at\n    ) VALUES (\n      ${input.deliveryId}, ${input.positionAt.toISOString()}, ${input.estimatedArrivalAt.toISOString()}, ${input.plannedArrivalAt?.toISOString() ?? null}, ${input.delayMinutes}, ${input.effectiveSpeedKmh}, ${input.remainingDistanceKm}, ${input.progress}, ${input.confidence}, ${input.source}, ${new Date().toISOString()}\n    ) ON CONFLICT (delivery_id, position_at) DO NOTHING RETURNING delivery_id` as Array<{ delivery_id: string }>;\n'''
          new_insert = '''    const rows = await sql`INSERT INTO delivery_eta_observations (\n      delivery_id, route_template_id, trip_instance_id, destination_site_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at\n    ) VALUES (\n      ${input.deliveryId}, ${input.routeTemplateId}, ${input.tripInstanceId}, ${input.destinationSiteId}, ${input.positionAt.toISOString()}, ${input.estimatedArrivalAt.toISOString()}, ${input.plannedArrivalAt?.toISOString() ?? null}, ${input.delayMinutes}, ${input.effectiveSpeedKmh}, ${input.remainingDistanceKm}, ${input.progress}, ${input.confidence}, ${input.source}, ${new Date().toISOString()}\n    ) ON CONFLICT (delivery_id, position_at) DO NOTHING RETURNING delivery_id` as Array<{ delivery_id: string }>;\n'''
          if old_insert in s: s = s.replace(old_insert, new_insert)

          old_select = '''    const rows = await sql`SELECT delivery_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at\n      FROM delivery_eta_observations WHERE delivery_id = ${deliveryId} ORDER BY position_at DESC LIMIT ${capped}` as Array<Record<string, unknown>>;\n    return rows.map((row) => ({\n      deliveryId: String(row.delivery_id), positionAt: new Date(String(row.position_at)), estimatedArrivalAt: new Date(String(row.estimated_arrival_at)),\n      plannedArrivalAt: row.planned_arrival_at ? new Date(String(row.planned_arrival_at)) : null, delayMinutes: row.delay_minutes === null ? null : Number(row.delay_minutes),\n      effectiveSpeedKmh: row.effective_speed_kmh === null ? null : Number(row.effective_speed_kmh), remainingDistanceKm: Number(row.remaining_distance_km), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(String(row.created_at)),\n    }));\n  },\n\n'''
          new_select = '''    const rows = await sql`SELECT delivery_id, route_template_id, trip_instance_id, destination_site_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at\n      FROM delivery_eta_observations WHERE delivery_id = ${deliveryId} ORDER BY position_at DESC LIMIT ${capped}` as Array<Record<string, unknown>>;\n    return rows.map((row) => ({\n      deliveryId: String(row.delivery_id), routeTemplateId: row.route_template_id ? String(row.route_template_id) : null, tripInstanceId: row.trip_instance_id ? String(row.trip_instance_id) : null, destinationSiteId: row.destination_site_id ? String(row.destination_site_id) : null,\n      positionAt: new Date(String(row.position_at)), estimatedArrivalAt: new Date(String(row.estimated_arrival_at)),\n      plannedArrivalAt: row.planned_arrival_at ? new Date(String(row.planned_arrival_at)) : null, delayMinutes: row.delay_minutes === null ? null : Number(row.delay_minutes),\n      effectiveSpeedKmh: row.effective_speed_kmh === null ? null : Number(row.effective_speed_kmh), remainingDistanceKm: Number(row.remaining_distance_km), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(String(row.created_at)),\n    }));\n  },\n  async listEtaObservationsForRoute(routeTemplateId, destinationSiteId, limit = 5000) {\n    await ensureSchema();\n    const capped = Math.max(1, Math.min(10000, Math.round(limit)));\n    const rows = await sql`SELECT delivery_id, route_template_id, trip_instance_id, destination_site_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at\n      FROM delivery_eta_observations WHERE route_template_id = ${routeTemplateId} AND destination_site_id = ${destinationSiteId} ORDER BY position_at DESC LIMIT ${capped}` as Array<Record<string, unknown>>;\n    return rows.map((row) => ({\n      deliveryId: String(row.delivery_id), routeTemplateId: row.route_template_id ? String(row.route_template_id) : null, tripInstanceId: row.trip_instance_id ? String(row.trip_instance_id) : null, destinationSiteId: row.destination_site_id ? String(row.destination_site_id) : null,\n      positionAt: new Date(String(row.position_at)), estimatedArrivalAt: new Date(String(row.estimated_arrival_at)),\n      plannedArrivalAt: row.planned_arrival_at ? new Date(String(row.planned_arrival_at)) : null, delayMinutes: row.delay_minutes === null ? null : Number(row.delay_minutes),\n      effectiveSpeedKmh: row.effective_speed_kmh === null ? null : Number(row.effective_speed_kmh), remainingDistanceKm: Number(row.remaining_distance_km), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(String(row.created_at)),\n    }));\n  },\n\n'''
          if old_select in s:
            s = s.replace(old_select, new_select)
          elif 'async listEtaObservationsForRoute' not in s:
            raise SystemExit('postgres ETA select marker missing')
          p.write_text(s)

          # Cloudflare D1
          p = Path('app/lib/delivery-store.cloudflare.ts')
          s = p.read_text()
          ensure_marker = '''  if (!columns.has("planned_arrival_at")) await db().prepare("ALTER TABLE deliveries ADD COLUMN planned_arrival_at integer").run();\n}\n'''
          # ETA table migration is done after its CREATE TABLE because it is a separate table.
          eta_create_marker = '''  await database.prepare(`CREATE TABLE IF NOT EXISTS delivery_eta_observations (\n    delivery_id text NOT NULL, position_at integer NOT NULL, estimated_arrival_at integer NOT NULL, planned_arrival_at integer,\n    delay_minutes integer, effective_speed_kmh real, remaining_distance_km real NOT NULL, progress integer NOT NULL,\n    confidence text NOT NULL, source text NOT NULL, created_at integer NOT NULL, PRIMARY KEY (delivery_id, position_at)\n  )`).run();\n'''
          if 'PRAGMA table_info(delivery_eta_observations)' not in s:
            if eta_create_marker not in s: raise SystemExit('d1 ETA create marker missing')
            s = s.replace(eta_create_marker, eta_create_marker + '''  const etaColumnsResult = await database.prepare("PRAGMA table_info(delivery_eta_observations)").all<{ name: string }>();\n  const etaColumns = new Set((etaColumnsResult.results ?? []).map((column) => column.name));\n  if (!etaColumns.has("route_template_id")) await database.prepare("ALTER TABLE delivery_eta_observations ADD COLUMN route_template_id text").run();\n  if (!etaColumns.has("trip_instance_id")) await database.prepare("ALTER TABLE delivery_eta_observations ADD COLUMN trip_instance_id text").run();\n  if (!etaColumns.has("destination_site_id")) await database.prepare("ALTER TABLE delivery_eta_observations ADD COLUMN destination_site_id text").run();\n''')
            s = s.replace('database.prepare("CREATE INDEX IF NOT EXISTS idx_eta_observations_delivery_position ON delivery_eta_observations(delivery_id, position_at DESC)"),\n', 'database.prepare("CREATE INDEX IF NOT EXISTS idx_eta_observations_delivery_position ON delivery_eta_observations(delivery_id, position_at DESC)"),\n    database.prepare("CREATE INDEX IF NOT EXISTS idx_eta_observations_route_destination ON delivery_eta_observations(route_template_id, destination_site_id, position_at DESC)"),\n')

          old_insert = '''    const result = await db().prepare(`INSERT OR IGNORE INTO delivery_eta_observations\n      (delivery_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at)\n      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`\n      ).bind(input.deliveryId, input.positionAt.getTime(), input.estimatedArrivalAt.getTime(), input.plannedArrivalAt?.getTime() ?? null, input.delayMinutes, input.effectiveSpeedKmh, input.remainingDistanceKm, input.progress, input.confidence, input.source, Date.now()).run();\n'''
          new_insert = '''    const result = await db().prepare(`INSERT OR IGNORE INTO delivery_eta_observations\n      (delivery_id, route_template_id, trip_instance_id, destination_site_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at)\n      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`\n      ).bind(input.deliveryId, input.routeTemplateId, input.tripInstanceId, input.destinationSiteId, input.positionAt.getTime(), input.estimatedArrivalAt.getTime(), input.plannedArrivalAt?.getTime() ?? null, input.delayMinutes, input.effectiveSpeedKmh, input.remainingDistanceKm, input.progress, input.confidence, input.source, Date.now()).run();\n'''
          if old_insert in s: s = s.replace(old_insert, new_insert)

          old_select = '''    const result = await db().prepare(`SELECT delivery_id AS deliveryId, position_at AS positionAt, estimated_arrival_at AS estimatedArrivalAt, planned_arrival_at AS plannedArrivalAt, delay_minutes AS delayMinutes, effective_speed_kmh AS effectiveSpeedKmh, remaining_distance_km AS remainingDistanceKm, progress, confidence, source, created_at AS createdAt FROM delivery_eta_observations WHERE delivery_id = ? ORDER BY position_at DESC LIMIT ?`).bind(deliveryId, capped).all<Record<string, unknown>>();\n    return (result.results ?? []).map((row) => ({\n      deliveryId: String(row.deliveryId), positionAt: new Date(Number(row.positionAt)), estimatedArrivalAt: new Date(Number(row.estimatedArrivalAt)),\n      plannedArrivalAt: row.plannedArrivalAt == null ? null : new Date(Number(row.plannedArrivalAt)), delayMinutes: row.delayMinutes == null ? null : Number(row.delayMinutes),\n      effectiveSpeedKmh: row.effectiveSpeedKmh == null ? null : Number(row.effectiveSpeedKmh), remainingDistanceKm: Number(row.remainingDistanceKm), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(Number(row.createdAt)),\n    }));\n  },\n'''
          new_select = '''    const result = await db().prepare(`SELECT delivery_id AS deliveryId, route_template_id AS routeTemplateId, trip_instance_id AS tripInstanceId, destination_site_id AS destinationSiteId, position_at AS positionAt, estimated_arrival_at AS estimatedArrivalAt, planned_arrival_at AS plannedArrivalAt, delay_minutes AS delayMinutes, effective_speed_kmh AS effectiveSpeedKmh, remaining_distance_km AS remainingDistanceKm, progress, confidence, source, created_at AS createdAt FROM delivery_eta_observations WHERE delivery_id = ? ORDER BY position_at DESC LIMIT ?`).bind(deliveryId, capped).all<Record<string, unknown>>();\n    return (result.results ?? []).map((row) => ({\n      deliveryId: String(row.deliveryId), routeTemplateId: row.routeTemplateId == null ? null : String(row.routeTemplateId), tripInstanceId: row.tripInstanceId == null ? null : String(row.tripInstanceId), destinationSiteId: row.destinationSiteId == null ? null : String(row.destinationSiteId), positionAt: new Date(Number(row.positionAt)), estimatedArrivalAt: new Date(Number(row.estimatedArrivalAt)),\n      plannedArrivalAt: row.plannedArrivalAt == null ? null : new Date(Number(row.plannedArrivalAt)), delayMinutes: row.delayMinutes == null ? null : Number(row.delayMinutes),\n      effectiveSpeedKmh: row.effectiveSpeedKmh == null ? null : Number(row.effectiveSpeedKmh), remainingDistanceKm: Number(row.remainingDistanceKm), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(Number(row.createdAt)),\n    }));\n  },\n  async listEtaObservationsForRoute(routeTemplateId, destinationSiteId, limit = 5000) {\n    await ensureTable();\n    const capped = Math.max(1, Math.min(10000, Math.round(limit)));\n    const result = await db().prepare(`SELECT delivery_id AS deliveryId, route_template_id AS routeTemplateId, trip_instance_id AS tripInstanceId, destination_site_id AS destinationSiteId, position_at AS positionAt, estimated_arrival_at AS estimatedArrivalAt, planned_arrival_at AS plannedArrivalAt, delay_minutes AS delayMinutes, effective_speed_kmh AS effectiveSpeedKmh, remaining_distance_km AS remainingDistanceKm, progress, confidence, source, created_at AS createdAt FROM delivery_eta_observations WHERE route_template_id = ? AND destination_site_id = ? ORDER BY position_at DESC LIMIT ?`).bind(routeTemplateId, destinationSiteId, capped).all<Record<string, unknown>>();\n    return (result.results ?? []).map((row) => ({\n      deliveryId: String(row.deliveryId), routeTemplateId: row.routeTemplateId == null ? null : String(row.routeTemplateId), tripInstanceId: row.tripInstanceId == null ? null : String(row.tripInstanceId), destinationSiteId: row.destinationSiteId == null ? null : String(row.destinationSiteId), positionAt: new Date(Number(row.positionAt)), estimatedArrivalAt: new Date(Number(row.estimatedArrivalAt)),\n      plannedArrivalAt: row.plannedArrivalAt == null ? null : new Date(Number(row.plannedArrivalAt)), delayMinutes: row.delayMinutes == null ? null : Number(row.delayMinutes),\n      effectiveSpeedKmh: row.effectiveSpeedKmh == null ? null : Number(row.effectiveSpeedKmh), remainingDistanceKm: Number(row.remainingDistanceKm), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(Number(row.createdAt)),\n    }));\n  },\n'''
          if old_select in s:
            s = s.replace(old_select, new_select)
          elif 'async listEtaObservationsForRoute' not in s:
            raise SystemExit('d1 ETA select marker missing')
          p.write_text(s)

      - name: Test route history helper
        run: node --experimental-strip-types --test tests/route-history.test.mjs tests/eta-observation.test.mjs tests/eta-estimator.test.mjs
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/delivery-store.postgres.ts app/lib/delivery-store.cloudflare.ts
          git commit -m "persist ETA history by reusable route"
          git push

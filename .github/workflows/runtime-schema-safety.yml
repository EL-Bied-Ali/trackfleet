name: Runtime schema safety

on:
  push:
    branches:
      - main
      - dashboard-query-batching
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify runtime schema bootstrap safety
        run: node --test tests/runtime-schema-safety.test.mjs
      - name: Verify local D1 schema preparation
        run: |
          rm -rf .wrangler/state
          node scripts/prepare-d1-schema.mjs --local
          node scripts/prepare-d1-history-backfill-state.mjs --local
          node scripts/prepare-d1-schema.mjs --local
          node scripts/prepare-d1-history-backfill-state.mjs --local
      - name: Verify storage failover readiness contract
        run: node --experimental-strip-types --test tests/storage-failover-readiness.test.mjs tests/d1-standby-readiness-behavior.test.mjs
      - name: Verify D1 standby cron contract
        run: node --test tests/d1-standby-cron.test.mjs
      - name: Verify D1 session replication contract
        run: node --test tests/d1-session-replication.test.mjs
      - name: Verify D1 site replication contract
        run: node --test tests/d1-site-replication.test.mjs
      - name: Verify D1 delivery create replication contract
        run: node --test tests/d1-delivery-create-replication.test.mjs
      - name: Verify D1 delivery state replication contract
        run: node --test tests/d1-delivery-state-replication.test.mjs
      - name: Verify D1 append replication contract
        run: node --test tests/d1-append-replication.test.mjs
      - name: Verify D1 completion replication contract
        run: node --test tests/d1-completion-replication.test.mjs
      - name: Verify D1 reconciliation contract
        run: node --test tests/d1-reconciliation.test.mjs
      - name: Verify D1 telemetry reconciliation contract
        run: node --test tests/d1-telemetry-reconciliation.test.mjs
      - name: Verify D1 history backfill contract
        run: node --test tests/d1-history-backfill.test.mjs
      - name: Verify Postgres query budget
        run: node --test tests/postgres-query-budget.test.mjs
      - name: Verify batched-read behavior
        run: node --test tests/micro-batcher.test.mjs tests/postgres-read-batching.test.mjs
      - name: Verify bulk delivery CSV import
        run: node --test tests/bulk-delivery-import.test.mjs
      - name: Verify delivery creation idempotency
        run: node --experimental-strip-types --test tests/delivery-idempotency.test.mjs
      - name: Verify operational alert detection
        run: node --test tests/operational-alerts.test.mjs
      - name: Verify storage schema compatibility checks
        run: node --test tests/storage-schema-health.test.mjs
      - name: Verify authenticated quick tool navigation
        run: node --test tests/quick-tools-navigation.test.mjs
      - name: Verify production release gate
        run: node --test tests/release-gate-contract.test.mjs
      - name: Verify tenant telemetry growth reporting
        run: node --experimental-strip-types --test tests/telemetry-growth.test.mjs
      - name: Verify tenant-safe data export
        run: node --experimental-strip-types --test tests/tenant-data-export.test.mjs
      - name: Verify full-history export query scaling
        run: node --test tests/full-history-export-scaling.test.mjs
      - name: Verify retention maintenance heartbeat
        run: node --experimental-strip-types --test tests/retention-heartbeat.test.mjs tests/telemetry-retention.test.mjs
      - name: Verify bounded operational delivery window
        run: node --test tests/operational-delivery-window.test.mjs
      - name: Verify keyset delivery history pagination
        run: node --test tests/delivery-history-pagination.test.mjs
      - name: Typecheck Vercel runtime
        env:
          VERCEL: "1"
          NITRO_PRESET: "vercel"
        run: pnpm exec tsc -p tsconfig.vercel.json --noEmit
      - name: Build shared Postgres Cloudflare runtime
        env:
          TRACKFLEET_STORAGE: postgres
        run: pnpm exec vinext build

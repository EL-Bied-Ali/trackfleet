name: Patch route coordinate readiness

on:
  push:
    paths:
      - ".github/workflows/patch-route-coordinate-readiness.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Surface stops missing exact geofence coordinates
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          old_sig = 'async function learnedStopMinutes(companyId: string, routeTemplateId: string | null, currentTripInstanceId: string | null) {'
          new_sig = 'async function learnedStopMinutes(companyId: string, routeTemplateId: string | null, currentTripInstanceId: string | null, prefetchedSites?: Awaited<ReturnType<typeof siteStore.listForCompany>>) {'
          if old_sig in s: s = s.replace(old_sig, new_sig, 1)
          old_fetch = '''  const [positions, sites] = await Promise.all([\n    store.listTripPositionsForRoute(companyId, routeTemplateId, 20000),\n    siteStore.listForCompany(companyId),\n  ]);'''
          new_fetch = '''  const [positions, sites] = await Promise.all([\n    store.listTripPositionsForRoute(companyId, routeTemplateId, 20000),\n    prefetchedSites ? Promise.resolve(prefetchedSites) : siteStore.listForCompany(companyId),\n  ]);'''
          if old_fetch not in s: raise SystemExit('learned dwell site fetch marker missing')
          s = s.replace(old_fetch, new_fetch, 1)

          rows_marker = '''    const rows = await store.listForCompany(session.companyId);\n    const stopPlans = buildTruckStopPlans(rows);'''
          rows_new = '''    const rows = await store.listForCompany(session.companyId);\n    const companySites = await siteStore.listForCompany(session.companyId);\n    const siteById = new Map(companySites.map((site) => [site.id, site]));\n    const stopPlans = buildTruckStopPlans(rows);'''
          if rows_marker not in s: raise SystemExit('authenticated site preload marker missing')
          s = s.replace(rows_marker, rows_new, 1)

          cache_old = '        pending = learnedStopMinutes(session.companyId, routeTemplateId, tripInstanceId);\n'
          cache_new = '        pending = learnedStopMinutes(session.companyId, routeTemplateId, tripInstanceId, companySites);\n'
          if cache_old not in s: raise SystemExit('dwell cache site reuse marker missing')
          s = s.replace(cache_old, cache_new, 1)

          learning_old = '''      const futureStopIds = plan.stops.slice(0, -1).map((stop) => stop.siteId);\n      const learning = routeLearningState({\n        historicalTrips: history.tripCount,\n        learnedStops: futureStopIds.filter((siteId) => learnedDwell.has(siteId)).length,\n        futureStops: futureStopIds.length,\n      });'''
          learning_new = '''      const futureStopIds = plan.stops.slice(0, -1).map((stop) => stop.siteId);\n      const unconfiguredStops = futureStopIds.filter((siteId) => {\n        const site = siteById.get(siteId);\n        return !site || typeof site.latitude !== "number" || typeof site.longitude !== "number";\n      }).length;\n      const learning = routeLearningState({\n        historicalTrips: history.tripCount,\n        learnedStops: futureStopIds.filter((siteId) => learnedDwell.has(siteId)).length,\n        futureStops: futureStopIds.length,\n        unconfiguredStops,\n      });'''
          if learning_old not in s: raise SystemExit('route learning coordinate marker missing')
          s = s.replace(learning_old, learning_new, 1)
          p.write_text(s)

          p = Path('app/page.tsx')
          s = p.read_text()
          old_type = 'learning?: { historicalTrips: number; requiredTrips: number; learnedStops: number; futureStops: number; etaHistoryReady: boolean; dwellHistoryReady: boolean; stage: "collecting" | "partial" | "ready" }'
          new_type = 'learning?: { historicalTrips: number; requiredTrips: number; learnedStops: number; futureStops: number; unconfiguredStops: number; etaHistoryReady: boolean; dwellHistoryReady: boolean; stage: "collecting" | "partial" | "ready" }'
          if old_type not in s: raise SystemExit('route learning UI type marker missing')
          s = s.replace(old_type, new_type, 1)

          old_span = '<span>{plan.learning.historicalTrips}/{plan.learning.requiredTrips} {locale === "fr" ? "voyages" : locale === "nl" ? "ritten" : "trips"}{plan.learning.futureStops > 0 ? ` · ${plan.learning.learnedStops}/${plan.learning.futureStops} ${locale === "fr" ? "arrêts appris" : locale === "nl" ? "stops geleerd" : "stops learned"}` : ""}</span>'
          new_span = '<span>{plan.learning.historicalTrips}/{plan.learning.requiredTrips} {locale === "fr" ? "voyages" : locale === "nl" ? "ritten" : "trips"}{plan.learning.futureStops > 0 ? ` · ${plan.learning.learnedStops}/${plan.learning.futureStops} ${locale === "fr" ? "arrêts appris" : locale === "nl" ? "stops geleerd" : "stops learned"}` : ""}{plan.learning.unconfiguredStops > 0 ? ` · ${plan.learning.unconfiguredStops} ${locale === "fr" ? "sans coordonnées exactes" : locale === "nl" ? "zonder exacte coördinaten" : "missing exact coordinates"}` : ""}</span>'
          if old_span not in s: raise SystemExit('route learning UI detail marker missing')
          s = s.replace(old_span, new_span, 1)
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:route-learning
          pnpm run test:stop-dwell
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/deliveries/route.ts app/page.tsx
          git commit -m "surface route stops missing exact coordinates"
          git push

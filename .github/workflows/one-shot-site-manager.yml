name: One-shot site manager integration

on:
  push:
    paths:
      - .github/workflows/one-shot-site-manager.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate SiteManager into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          t = p.read_text()
          old = 'import InteractiveFleetMap from "./InteractiveFleetMap";\n'
          new = 'import InteractiveFleetMap from "./InteractiveFleetMap";\nimport SiteManager from "./SiteManager";\n'
          if old not in t: raise SystemExit('import anchor missing')
          t = t.replace(old, new, 1)
          old = '<div className="top-actions"><LanguageSwitcher locale={locale} label={t.language} onChange={changeLocale} /><button className="primary-button" onClick={() => setModalOpen(true)}><span>＋</span>{t.newDelivery}</button></div>'
          new = '<div className="top-actions"><LanguageSwitcher locale={locale} label={t.language} onChange={changeLocale} /><SiteManager locale={locale} /><button className="primary-button" onClick={() => setModalOpen(true)}><span>＋</span>{t.newDelivery}</button></div>'
          if old not in t: raise SystemExit('top actions anchor missing')
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "add agency manager to dispatch dashboard"
          git push

name: Validate fleet history feature once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Run focused validation
        shell: bash
        run: |
          set +e
          : > .fleet-history-validation.txt
          echo "fleet-trip-reconstruction" >> .fleet-history-validation.txt
          pnpm run test:fleet-trip-reconstruction >> .fleet-history-validation.txt 2>&1
          s1=$?
          echo "fleet-history-api" >> .fleet-history-validation.txt
          pnpm run test:fleet-history-api >> .fleet-history-validation.txt 2>&1
          s2=$?
          echo "typecheck" >> .fleet-history-validation.txt
          pnpm exec tsc -p tsconfig.vercel.json --noEmit >> .fleet-history-validation.txt 2>&1
          s3=$?
          echo "RESULT test_reconstruction=$s1 test_api=$s2 typecheck=$s3" >> .fleet-history-validation.txt
          git config user.name "TrackFleet validation"
          git config user.email "actions@users.noreply.github.com"
          git add .fleet-history-validation.txt
          git commit -m "record fleet history validation result"
          git push

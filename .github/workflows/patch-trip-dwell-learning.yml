name: Patch trip dwell learning

on:
  push:
    paths:
      - ".github/workflows/patch-trip-dwell-learning.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Persist trip positions and use learned dwell
        shell: python
        run: |
          from pathlib import Path

          # Memory adapter: tenant-scoped route query.
          p = Path('app/lib/delivery-store.memory.ts')
          s = p.read_text()
          s = s.replace('async listTripPositionsForRoute(routeTemplateId, limit = 10000) {\n    return tripPositions\n      .filter((item) => item.routeTemplateId === routeTemplateId)', 'async listTripPositionsForRoute(companyId, routeTemplateId, limit = 10000) {\n    return tripPositions\n      .filter((item) => item.companyId === companyId && item.routeTemplateId === routeTemplateId)')
          p.write_text(s)

          # Postgres persistent trip positions.
          p = Path('app/lib/delivery-store.postgres.ts')
          s = p.read_text()
          schema_marker = '    await sql`CREATE INDEX IF NOT EXISTS idx_eta_observations_route_destination ON delivery_eta_observations(route_template_id, destination_site_id, position_at DESC)`;\n'
          schema_add = '''    await sql`CREATE TABLE IF NOT EXISTS trip_position_observations (\n      company_id text NOT NULL,\n      route_template_id text NOT NULL,\n      trip_instance_id text NOT NULL,\n      vehicle_id text NOT NULL,\n      position_at timestamptz NOT NULL,\n      latitude double precision NOT NULL,\n      longitude double precision NOT NULL,\n      speed double precision NOT NULL,\n      created_at timestamptz NOT NULL,\n      PRIMARY KEY (company_id, trip_instance_id, position_at)\n    )`;\n    await sql`CREATE INDEX IF NOT EXISTS idx_trip_positions_company_route ON trip_position_observations(company_id, route_template_id, position_at DESC)`;\n'''
          if 'CREATE TABLE IF NOT EXISTS trip_position_observations' not in s:
            if schema_marker not in s: raise SystemExit('postgres trip schema marker missing')
            s = s.replace(schema_marker, schema_marker + schema_add)
          method_marker = '\n  async listPendingNotifications(companyId) {\n'
          methods = '''\n  async recordTripPosition(input) {\n    await ensureSchema();\n    const rows = await sql`INSERT INTO trip_position_observations (company_id, route_template_id, trip_instance_id, vehicle_id, position_at, latitude, longitude, speed, created_at)\n      VALUES (${input.companyId}, ${input.routeTemplateId}, ${input.tripInstanceId}, ${input.vehicleId}, ${input.positionAt.toISOString()}, ${input.latitude}, ${input.longitude}, ${input.speed}, ${new Date().toISOString()})\n      ON CONFLICT (company_id, trip_instance_id, position_at) DO NOTHING RETURNING trip_instance_id` as Array<{ trip_instance_id: string }>;\n    return rows.length > 0;\n  },\n  async listTripPositionsForRoute(companyId, routeTemplateId, limit = 10000) {\n    await ensureSchema();\n    const capped = Math.max(1, Math.min(20000, Math.round(limit)));\n    const rows = await sql`SELECT company_id, route_template_id, trip_instance_id, vehicle_id, position_at, latitude, longitude, speed, created_at\n      FROM trip_position_observations WHERE company_id = ${companyId} AND route_template_id = ${routeTemplateId} ORDER BY position_at DESC LIMIT ${capped}` as Array<Record<string, unknown>>;\n    return rows.map((row) => ({\n      companyId: String(row.company_id), routeTemplateId: String(row.route_template_id), tripInstanceId: String(row.trip_instance_id), vehicleId: String(row.vehicle_id),\n      positionAt: new Date(String(row.position_at)), latitude: Number(row.latitude), longitude: Number(row.longitude), speed: Number(row.speed), createdAt: new Date(String(row.created_at)),\n    }));\n  },\n'''
          if 'async recordTripPosition(input)' not in s:
            if method_marker not in s: raise SystemExit('postgres trip method marker missing')
            s = s.replace(method_marker, methods + method_marker, 1)
          p.write_text(s)

          # Cloudflare D1 persistent trip positions.
          p = Path('app/lib/delivery-store.cloudflare.ts')
          s = p.read_text()
          eta_marker = '''  if (!etaColumns.has("destination_site_id")) await database.prepare("ALTER TABLE delivery_eta_observations ADD COLUMN destination_site_id text").run();\n'''
          trip_schema = '''  await database.prepare(`CREATE TABLE IF NOT EXISTS trip_position_observations (\n    company_id text NOT NULL, route_template_id text NOT NULL, trip_instance_id text NOT NULL, vehicle_id text NOT NULL,\n    position_at integer NOT NULL, latitude real NOT NULL, longitude real NOT NULL, speed real NOT NULL, created_at integer NOT NULL,\n    PRIMARY KEY (company_id, trip_instance_id, position_at)\n  )`).run();\n'''
          if 'CREATE TABLE IF NOT EXISTS trip_position_observations' not in s:
            if eta_marker not in s: raise SystemExit('d1 trip schema marker missing')
            s = s.replace(eta_marker, eta_marker + trip_schema)
            index_marker = '    database.prepare("CREATE INDEX IF NOT EXISTS idx_eta_observations_route_destination ON delivery_eta_observations(route_template_id, destination_site_id, position_at DESC)"),\n'
            s = s.replace(index_marker, index_marker + '    database.prepare("CREATE INDEX IF NOT EXISTS idx_trip_positions_company_route ON trip_position_observations(company_id, route_template_id, position_at DESC)"),\n')
          method_marker = '  async listPendingNotifications(companyId) {\n'
          methods = '''  async recordTripPosition(input) {\n    await ensureTable();\n    const result = await db().prepare(`INSERT OR IGNORE INTO trip_position_observations\n      (company_id, route_template_id, trip_instance_id, vehicle_id, position_at, latitude, longitude, speed, created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`\n      ).bind(input.companyId, input.routeTemplateId, input.tripInstanceId, input.vehicleId, input.positionAt.getTime(), input.latitude, input.longitude, input.speed, Date.now()).run();\n    return Boolean(result.meta?.changes);\n  },\n  async listTripPositionsForRoute(companyId, routeTemplateId, limit = 10000) {\n    await ensureTable();\n    const capped = Math.max(1, Math.min(20000, Math.round(limit)));\n    const result = await db().prepare(`SELECT company_id AS companyId, route_template_id AS routeTemplateId, trip_instance_id AS tripInstanceId, vehicle_id AS vehicleId, position_at AS positionAt, latitude, longitude, speed, created_at AS createdAt FROM trip_position_observations WHERE company_id = ? AND route_template_id = ? ORDER BY position_at DESC LIMIT ?`).bind(companyId, routeTemplateId, capped).all<Record<string, unknown>>();\n    return (result.results ?? []).map((row) => ({\n      companyId: String(row.companyId), routeTemplateId: String(row.routeTemplateId), tripInstanceId: String(row.tripInstanceId), vehicleId: String(row.vehicleId), positionAt: new Date(Number(row.positionAt)), latitude: Number(row.latitude), longitude: Number(row.longitude), speed: Number(row.speed), createdAt: new Date(Number(row.createdAt)),\n    }));\n  },\n'''
          if 'async recordTripPosition(input)' not in s:
            if method_marker not in s: raise SystemExit('d1 trip method marker missing')
            s = s.replace(method_marker, methods + method_marker, 1)
          p.write_text(s)

          # Automation: keep one deduplicated GPS timeline per real trip.
          p = Path('app/lib/server-automation.ts')
          s = p.read_text()
          old = '''    const etaObservation = buildEtaObservation(delivery, events, deliveries, routeContext);\n    if (etaObservation && await store.recordEtaObservation(etaObservation)) etaObservations += 1;\n'''
          new = '''    const etaObservation = buildEtaObservation(delivery, events, deliveries, routeContext);\n    if (etaObservation && await store.recordEtaObservation(etaObservation)) etaObservations += 1;\n    if (routeContext && delivery.gpsSource === "sendatrack" && delivery.sendatrackVehicleId && typeof delivery.latitude === "number" && typeof delivery.longitude === "number" && delivery.lastPositionAt) {\n      await store.recordTripPosition({\n        companyId, routeTemplateId: routeContext.routeTemplateId, tripInstanceId: routeContext.tripInstanceId, vehicleId: delivery.sendatrackVehicleId,\n        positionAt: delivery.lastPositionAt, latitude: delivery.latitude, longitude: delivery.longitude, speed: delivery.speed ?? 0,\n      });\n    }\n'''
          if old not in s: raise SystemExit('automation trip position marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ETA API: use historical agency dwell only when enough completed visits exist.
          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          s = s.replace('import { buildTruckStopPlans, pendingServiceMinutesBefore } from "../../lib/truck-stop-plan";', 'import { buildTruckStopPlans, pendingServiceMinutesBefore, pendingServiceMinutesBeforeWithHistory } from "../../lib/truck-stop-plan";')
          route_import = 'import { buildEtaRouteContexts, stableEtaRouteContext, summarizeRouteHistory } from "../../lib/route-history";\n'
          if 'import { summarizeStopDwell } from "../../lib/stop-dwell";' not in s:
            s = s.replace(route_import, route_import + 'import { summarizeStopDwell } from "../../lib/stop-dwell";\n')
          helper_marker = '''function normalized(value: string) {\n  return value.trim().toLowerCase().replace(/\\s+/g, " ");\n}\n'''
          helper = '''\nasync function learnedStopMinutes(companyId: string, routeTemplateId: string | null, currentTripInstanceId: string | null) {\n  const learned = new Map<string, number>();\n  if (!routeTemplateId) return learned;\n  const [positions, sites] = await Promise.all([\n    store.listTripPositionsForRoute(companyId, routeTemplateId, 20000),\n    siteStore.listForCompany(companyId),\n  ]);\n  for (const site of sites) {\n    if (typeof site.latitude !== "number" || typeof site.longitude !== "number") continue;\n    const stats = summarizeStopDwell(positions, { latitude: site.latitude, longitude: site.longitude, arrivalRadiusKm: site.arrivalRadiusKm }, 3, currentTripInstanceId);\n    if (stats.usableMinutes !== null) learned.set(site.id, stats.usableMinutes);\n  }\n  return learned;\n}\n'''
          if 'async function learnedStopMinutes' not in s:
            if helper_marker not in s: raise SystemExit('API dwell helper marker missing')
            s = s.replace(helper_marker, helper_marker + helper)

          public_old = '      const serviceMinutes = pendingServiceMinutesBefore(row, companyRows);\n'
          public_new = '''      const learnedDwell = await learnedStopMinutes(row.companyId, routeContext?.routeTemplateId ?? null, routeContext?.tripInstanceId ?? null);\n      const serviceMinutes = pendingServiceMinutesBeforeWithHistory(row, companyRows, learnedDwell);\n'''
          if public_old not in s: raise SystemExit('public service minute marker missing')
          s = s.replace(public_old, public_new, 1)

          auth_old = '      const serviceMinutes = pendingServiceMinutesBefore(row, rows);\n      const routeEvents = await store.listEvents(row.id);\n'
          auth_new = '      const routeEvents = await store.listEvents(row.id);\n'
          if auth_old not in s: raise SystemExit('auth service minute marker missing')
          s = s.replace(auth_old, auth_new, 1)
          history_marker = '''      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);\n      return (await enrichAndDetectDelay(row, serviceMinutes, history.usableEffectiveSpeedKmh, history.tripCount)).delivery;'''
          history_new = '''      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);\n      const learnedDwell = await learnedStopMinutes(session.companyId, routeContext?.routeTemplateId ?? null, routeContext?.tripInstanceId ?? null);\n      const serviceMinutes = pendingServiceMinutesBeforeWithHistory(row, rows, learnedDwell);\n      return (await enrichAndDetectDelay(row, serviceMinutes, history.usableEffectiveSpeedKmh, history.tripCount)).delivery;'''
          if history_marker not in s: raise SystemExit('auth dwell integration marker missing')
          s = s.replace(history_marker, history_new, 1)
          p.write_text(s)

          # Permanent tests.
          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:stop-plans": "node --experimental-strip-types --test tests/truck-stop-plan.test.mjs",\n'
          if 'test:stop-dwell' not in s:
            if marker not in s: raise SystemExit('package stop plan marker missing')
            s = s.replace(marker, marker + '    "test:stop-dwell": "node --experimental-strip-types --test tests/stop-dwell.test.mjs",\n')
          p.write_text(s)

          p = Path('.github/workflows/vercel-build-check.yml')
          s = p.read_text()
          marker = '      - name: Verify truck stop plans\n        run: pnpm run test:stop-plans\n'
          if 'Verify learned agency dwell times' not in s:
            if marker not in s: raise SystemExit('CI stop plan marker missing')
            s = s.replace(marker, marker + '      - name: Verify learned agency dwell times\n        run: pnpm run test:stop-dwell\n')
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:stop-dwell
          pnpm run test:stop-plans
          pnpm run test:route-history
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/delivery-store.memory.ts app/lib/delivery-store.postgres.ts app/lib/delivery-store.cloudflare.ts app/lib/server-automation.ts app/api/deliveries/route.ts package.json .github/workflows/vercel-build-check.yml
          git commit -m "learn real agency dwell times from trip GPS history"
          git push

name: Patch ETA history

on:
  push:
    paths:
      - ".github/workflows/patch-eta-history.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ETA history persistence
        shell: python
        run: |
          from pathlib import Path

          # Memory store
          p = Path('app/lib/delivery-store.memory.ts')
          s = p.read_text()
          s = s.replace('import type { CreateDeliveryInput, DeliveryEventRow, DeliveryRow, DeliveryStore, DeliveryTransition } from "./delivery-store.types";\n', 'import type { CreateDeliveryInput, DeliveryEventRow, DeliveryRow, DeliveryStore, DeliveryTransition, EtaObservationRow } from "./delivery-store.types";\n')
          if 'const etaObservations:' not in s:
            s = s.replace('const deliveryEvents: DeliveryEventRow[] = [];\n', 'const deliveryEvents: DeliveryEventRow[] = [];\nconst etaObservations: EtaObservationRow[] = [];\n')
          marker = '''  async listEvents(deliveryId) {\n    return deliveryEvents.filter((event) => event.deliveryId === deliveryId).sort((a, b) => a.createdAt.getTime() - b.createdAt.getTime());\n  },\n'''
          block = marker + '''  async recordEtaObservation(input) {\n    if (etaObservations.some((item) => item.deliveryId === input.deliveryId && item.positionAt.getTime() === input.positionAt.getTime())) return false;\n    etaObservations.push({ ...input, createdAt: new Date() });\n    return true;\n  },\n  async listEtaObservations(deliveryId, limit = 200) {\n    return etaObservations.filter((item) => item.deliveryId === deliveryId).sort((a, b) => b.positionAt.getTime() - a.positionAt.getTime()).slice(0, Math.max(1, Math.min(2000, limit)));\n  },\n'''
          if 'async recordEtaObservation' not in s:
            if marker not in s: raise SystemExit('memory listEvents marker missing')
            s = s.replace(marker, block)
          p.write_text(s)

          # Postgres store
          p = Path('app/lib/delivery-store.postgres.ts')
          s = p.read_text()
          s = s.replace('import type { CreateDeliveryInput, DeliveryEventRow, DeliveryRow, DeliveryStatus, DeliveryStore, DeliveryTransition } from "./delivery-store.types";\n', 'import type { CreateDeliveryInput, DeliveryEventRow, DeliveryRow, DeliveryStatus, DeliveryStore, DeliveryTransition, EtaObservationRow } from "./delivery-store.types";\n')
          schema_marker = '''    await sql`CREATE TABLE IF NOT EXISTS delivery_notifications (\n      delivery_id text NOT NULL,\n      event_type text NOT NULL,\n      channel text NOT NULL,\n      attempted_at timestamptz NOT NULL,\n      sent_at timestamptz,\n      PRIMARY KEY (delivery_id, event_type, channel)\n    )`;\n'''
          eta_schema = schema_marker + '''    await sql`CREATE TABLE IF NOT EXISTS delivery_eta_observations (\n      delivery_id text NOT NULL,\n      position_at timestamptz NOT NULL,\n      estimated_arrival_at timestamptz NOT NULL,\n      planned_arrival_at timestamptz,\n      delay_minutes integer,\n      effective_speed_kmh double precision,\n      remaining_distance_km double precision NOT NULL,\n      progress integer NOT NULL,\n      confidence text NOT NULL,\n      source text NOT NULL,\n      created_at timestamptz NOT NULL,\n      PRIMARY KEY (delivery_id, position_at)\n    )`;\n    await sql`CREATE INDEX IF NOT EXISTS idx_eta_observations_delivery_position ON delivery_eta_observations(delivery_id, position_at DESC)`;\n'''
          if 'delivery_eta_observations' not in s:
            if schema_marker not in s: raise SystemExit('postgres schema marker missing')
            s = s.replace(schema_marker, eta_schema)
          marker = '''  async listEvents(deliveryId) {\n    await ensureSchema();\n    const rows = await sql`SELECT delivery_id, type, progress, created_at FROM delivery_events WHERE delivery_id = ${deliveryId} ORDER BY created_at ASC` as RawEvent[];\n    return rows.map(hydrateEvent);\n  },\n\n'''
          block = marker + '''  async recordEtaObservation(input) {\n    await ensureSchema();\n    const rows = await sql`INSERT INTO delivery_eta_observations (\n      delivery_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at\n    ) VALUES (\n      ${input.deliveryId}, ${input.positionAt.toISOString()}, ${input.estimatedArrivalAt.toISOString()}, ${input.plannedArrivalAt?.toISOString() ?? null}, ${input.delayMinutes}, ${input.effectiveSpeedKmh}, ${input.remainingDistanceKm}, ${input.progress}, ${input.confidence}, ${input.source}, ${new Date().toISOString()}\n    ) ON CONFLICT (delivery_id, position_at) DO NOTHING RETURNING delivery_id` as Array<{ delivery_id: string }>;\n    return rows.length > 0;\n  },\n\n  async listEtaObservations(deliveryId, limit = 200) {\n    await ensureSchema();\n    const capped = Math.max(1, Math.min(2000, Math.round(limit)));\n    const rows = await sql`SELECT delivery_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at\n      FROM delivery_eta_observations WHERE delivery_id = ${deliveryId} ORDER BY position_at DESC LIMIT ${capped}` as Array<Record<string, unknown>>;\n    return rows.map((row) => ({\n      deliveryId: String(row.delivery_id), positionAt: new Date(String(row.position_at)), estimatedArrivalAt: new Date(String(row.estimated_arrival_at)),\n      plannedArrivalAt: row.planned_arrival_at ? new Date(String(row.planned_arrival_at)) : null, delayMinutes: row.delay_minutes === null ? null : Number(row.delay_minutes),\n      effectiveSpeedKmh: row.effective_speed_kmh === null ? null : Number(row.effective_speed_kmh), remainingDistanceKm: Number(row.remaining_distance_km), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(String(row.created_at)),\n    }));\n  },\n\n'''
          if 'async recordEtaObservation' not in s:
            if marker not in s: raise SystemExit('postgres listEvents marker missing')
            s = s.replace(marker, block)
          p.write_text(s)

          # Cloudflare D1 store
          p = Path('app/lib/delivery-store.cloudflare.ts')
          s = p.read_text()
          s = s.replace('import type { CreateDeliveryInput, DeliveryEventRow, DeliveryRow, DeliveryStore, DeliveryStatus, DeliveryTransition } from "./delivery-store.types";\n', 'import type { CreateDeliveryInput, DeliveryEventRow, DeliveryRow, DeliveryStore, DeliveryStatus, DeliveryTransition, EtaObservationRow } from "./delivery-store.types";\n')
          schema_marker = '''  await database.prepare(`CREATE TABLE IF NOT EXISTS delivery_notifications (\n    delivery_id text NOT NULL, event_type text NOT NULL, channel text NOT NULL,\n    attempted_at integer NOT NULL, sent_at integer,\n    PRIMARY KEY (delivery_id, event_type, channel)\n  )`).run();\n'''
          eta_schema = schema_marker + '''  await database.prepare(`CREATE TABLE IF NOT EXISTS delivery_eta_observations (\n    delivery_id text NOT NULL, position_at integer NOT NULL, estimated_arrival_at integer NOT NULL, planned_arrival_at integer,\n    delay_minutes integer, effective_speed_kmh real, remaining_distance_km real NOT NULL, progress integer NOT NULL,\n    confidence text NOT NULL, source text NOT NULL, created_at integer NOT NULL, PRIMARY KEY (delivery_id, position_at)\n  )`).run();\n'''
          if 'delivery_eta_observations' not in s:
            if schema_marker not in s: raise SystemExit('d1 schema marker missing')
            s = s.replace(schema_marker, eta_schema)
            s = s.replace('database.prepare("CREATE INDEX IF NOT EXISTS idx_delivery_events_delivery_id ON delivery_events(delivery_id)"),\n', 'database.prepare("CREATE INDEX IF NOT EXISTS idx_delivery_events_delivery_id ON delivery_events(delivery_id)"),\n    database.prepare("CREATE INDEX IF NOT EXISTS idx_eta_observations_delivery_position ON delivery_eta_observations(delivery_id, position_at DESC)"),\n')
          marker = '''  async listEvents(deliveryId) {\n    await ensureTable();\n    const result = await db().prepare(`SELECT delivery_id AS deliveryId, type, progress, created_at AS createdAt FROM delivery_events WHERE delivery_id = ? ORDER BY created_at ASC`).bind(deliveryId).all<RawDeliveryEvent>();\n    return (result.results ?? []).map(hydrateEvent);\n  },\n'''
          block = marker + '''  async recordEtaObservation(input) {\n    await ensureTable();\n    const result = await db().prepare(`INSERT OR IGNORE INTO delivery_eta_observations\n      (delivery_id, position_at, estimated_arrival_at, planned_arrival_at, delay_minutes, effective_speed_kmh, remaining_distance_km, progress, confidence, source, created_at)\n      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`\n      ).bind(input.deliveryId, input.positionAt.getTime(), input.estimatedArrivalAt.getTime(), input.plannedArrivalAt?.getTime() ?? null, input.delayMinutes, input.effectiveSpeedKmh, input.remainingDistanceKm, input.progress, input.confidence, input.source, Date.now()).run();\n    return Boolean(result.meta?.changes);\n  },\n  async listEtaObservations(deliveryId, limit = 200) {\n    await ensureTable();\n    const capped = Math.max(1, Math.min(2000, Math.round(limit)));\n    const result = await db().prepare(`SELECT delivery_id AS deliveryId, position_at AS positionAt, estimated_arrival_at AS estimatedArrivalAt, planned_arrival_at AS plannedArrivalAt, delay_minutes AS delayMinutes, effective_speed_kmh AS effectiveSpeedKmh, remaining_distance_km AS remainingDistanceKm, progress, confidence, source, created_at AS createdAt FROM delivery_eta_observations WHERE delivery_id = ? ORDER BY position_at DESC LIMIT ?`).bind(deliveryId, capped).all<Record<string, unknown>>();\n    return (result.results ?? []).map((row) => ({\n      deliveryId: String(row.deliveryId), positionAt: new Date(Number(row.positionAt)), estimatedArrivalAt: new Date(Number(row.estimatedArrivalAt)),\n      plannedArrivalAt: row.plannedArrivalAt == null ? null : new Date(Number(row.plannedArrivalAt)), delayMinutes: row.delayMinutes == null ? null : Number(row.delayMinutes),\n      effectiveSpeedKmh: row.effectiveSpeedKmh == null ? null : Number(row.effectiveSpeedKmh), remainingDistanceKm: Number(row.remainingDistanceKm), progress: Number(row.progress),\n      confidence: String(row.confidence) as EtaObservationRow["confidence"], source: String(row.source) as EtaObservationRow["source"], createdAt: new Date(Number(row.createdAt)),\n    }));\n  },\n'''
          if 'async recordEtaObservation' not in s:
            if marker not in s: raise SystemExit('d1 listEvents marker missing')
            s = s.replace(marker, block)
          p.write_text(s)

          # Autonomous scheduler collects one ETA sample per unique GPS timestamp.
          p = Path('app/lib/server-automation.ts')
          s = p.read_text()
          if 'buildEtaObservation' not in s:
            s = s.replace('import { getSendatrackSnapshot } from "./sendatrack";\n', 'import { getSendatrackSnapshot } from "./sendatrack";\nimport { buildEtaObservation } from "./eta-observation";\n')
          s = s.replace('  notificationFailures: number;\n};', '  notificationFailures: number;\n  etaObservations: number;\n};')
          s = s.replace('return { connected: false, vehicles: snapshot.vehicles.length, transitions: 0, newEvents: 0, delayEvents: 0, notificationsSent: 0, notificationFailures: 0 };', 'return { connected: false, vehicles: snapshot.vehicles.length, transitions: 0, newEvents: 0, delayEvents: 0, notificationsSent: 0, notificationFailures: 0, etaObservations: 0 };')
          marker = '''  const deliveries = await store.listForCompany(companyId);\n  for (const delivery of deliveries) {\n    const events = await store.listEvents(delivery.id);\n    if (!shouldCreateDelayEvent(delivery, events, deliveries)) continue;\n    if (await store.recordEvent(delivery.id, "DELAY_DETECTED", delivery.progress)) {\n      newEvents += 1;\n      delayEvents += 1;\n    }\n  }\n\n'''
          replacement = '''  const deliveries = await store.listForCompany(companyId);\n  let etaObservations = 0;\n  for (const delivery of deliveries) {\n    const events = await store.listEvents(delivery.id);\n    const etaObservation = buildEtaObservation(delivery, events, deliveries);\n    if (etaObservation && await store.recordEtaObservation(etaObservation)) etaObservations += 1;\n    if (!shouldCreateDelayEvent(delivery, events, deliveries)) continue;\n    if (await store.recordEvent(delivery.id, "DELAY_DETECTED", delivery.progress)) {\n      newEvents += 1;\n      delayEvents += 1;\n    }\n  }\n\n'''
          if 'let etaObservations = 0;' not in s:
            if marker not in s: raise SystemExit('automation delivery loop marker missing')
            s = s.replace(marker, replacement)
          s = s.replace('    notificationFailures: notifications.failed,\n  });', '    notificationFailures: notifications.failed,\n    etaObservations,\n  });')
          s = s.replace('    notificationFailures: notifications.failed,\n  };', '    notificationFailures: notifications.failed,\n    etaObservations,\n  };')
          p.write_text(s)

          # package script
          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:eta": "node --experimental-strip-types --test tests/eta-estimator.test.mjs",\n'
          if 'test:eta-observation' not in s:
            if marker not in s: raise SystemExit('eta package marker missing')
            s = s.replace(marker, marker + '    "test:eta-observation": "node --experimental-strip-types --test tests/eta-observation.test.mjs",\n')
          p.write_text(s)

      - name: Test ETA observations
        run: node --experimental-strip-types --test tests/eta-observation.test.mjs
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/delivery-store.memory.ts app/lib/delivery-store.postgres.ts app/lib/delivery-store.cloudflare.ts app/lib/server-automation.ts package.json
          git commit -m "persist ETA history from autonomous GPS ticks"
          git push

name: Audit types and lint

on:
  push:
    paths:
      - ".github/workflows/audit-types-and-lint.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript check (Vercel app runtime, auth fixed)
        run: pnpm exec tsc -p tsconfig.vercel.json --noEmit
      - name: ESLint check
        run: pnpm run lint

name: Patch login errors

on:
  push:
    paths:
      - ".github/workflows/patch-login-errors.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Differentiate SENDATRACK login errors
        shell: python
        run: |
          from pathlib import Path

          helper = Path("app/lib/login-error.ts")
          helper.write_text('''export type LoginErrorKind = "invalid_credentials" | "service_unavailable" | "login_failed";\n\nexport function classifyLoginError(status: number, code?: string | null): LoginErrorKind {\n  if (status === 401 || code === "authentication_failed") return "invalid_credentials";\n  if (status === 503 || code === "sendatrack_unavailable") return "service_unavailable";\n  return "login_failed";\n}\n''')

          test = Path("tests/login-error.test.mjs")
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { classifyLoginError } from "../app/lib/login-error.ts";\n\ntest("classifies rejected SENDATRACK credentials separately from provider outages", () => {\n  assert.equal(classifyLoginError(401, "authentication_failed"), "invalid_credentials");\n  assert.equal(classifyLoginError(503, "sendatrack_unavailable"), "service_unavailable");\n  assert.equal(classifyLoginError(500, "unexpected"), "login_failed");\n});\n''')

          page = Path("app/page.tsx")
          text = page.read_text()
          import_marker = 'import SiteManager from "./SiteManager";\n'
          if 'classifyLoginError' not in text:
              text = text.replace(import_marker, import_marker + 'import { classifyLoginError, type LoginErrorKind } from "./lib/login-error";\n')

          text = text.replace('function LoginScreen({ locale, busy, error, onLocale, onSubmit }: { locale: Locale; busy: boolean; error: string; onLocale: (locale: Locale) => void; onSubmit: (event: React.FormEvent<HTMLFormElement>) => void }) {', 'function LoginScreen({ locale, busy, error, onLocale, onSubmit }: { locale: Locale; busy: boolean; error: LoginErrorKind | ""; onLocale: (locale: Locale) => void; onSubmit: (event: React.FormEvent<HTMLFormElement>) => void }) {')

          old_fr = 'fr: { eyebrow: "ESPACE ENTREPRISE", title: "Connectez votre flotte SENDATRACK", body: "Utilisez les mêmes identifiants que dans l’application SENDATRACK. Votre espace TrackFleet sera reconnu automatiquement.", account: "Compte", user: "Utilisateur", password: "Mot de passe", submit: "Accéder à TrackFleet", loading: "Connexion…", error: "Identifiants incorrects ou service SENDATRACK indisponible.", privacy: "Connexion chiffrée côté TrackFleet · aucune donnée visible par vos clients" },'
          new_fr = 'fr: { eyebrow: "ESPACE ENTREPRISE", title: "Connectez votre flotte SENDATRACK", body: "Utilisez les mêmes identifiants que dans l’application SENDATRACK. Votre espace TrackFleet sera reconnu automatiquement.", account: "Compte", user: "Utilisateur", password: "Mot de passe", submit: "Accéder à TrackFleet", loading: "Connexion…", invalidCredentials: "Identifiants SENDATRACK incorrects.", serviceUnavailable: "SENDATRACK est temporairement indisponible. Réessayez dans quelques instants.", loginFailed: "Connexion impossible. Réessayez.", privacy: "Connexion chiffrée côté TrackFleet · aucune donnée visible par vos clients" },'
          old_en = 'en: { eyebrow: "COMPANY PORTAL", title: "Connect your SENDATRACK fleet", body: "Use the same credentials as in the SENDATRACK app. Your TrackFleet workspace will be recognized automatically.", account: "Account", user: "User", password: "Password", submit: "Open TrackFleet", loading: "Connecting…", error: "Incorrect credentials or SENDATRACK is unavailable.", privacy: "Encrypted by TrackFleet · credentials are never visible to customers" },'
          new_en = 'en: { eyebrow: "COMPANY PORTAL", title: "Connect your SENDATRACK fleet", body: "Use the same credentials as in the SENDATRACK app. Your TrackFleet workspace will be recognized automatically.", account: "Account", user: "User", password: "Password", submit: "Open TrackFleet", loading: "Connecting…", invalidCredentials: "Incorrect SENDATRACK credentials.", serviceUnavailable: "SENDATRACK is temporarily unavailable. Please try again shortly.", loginFailed: "Unable to sign in. Please try again.", privacy: "Encrypted by TrackFleet · credentials are never visible to customers" },'
          old_nl = 'nl: { eyebrow: "BEDRIJFSPORTAAL", title: "Koppel uw SENDATRACK-wagenpark", body: "Gebruik dezelfde gegevens als in de SENDATRACK-app. Uw TrackFleet-ruimte wordt automatisch herkend.", account: "Account", user: "Gebruiker", password: "Wachtwoord", submit: "TrackFleet openen", loading: "Verbinden…", error: "Onjuiste gegevens of SENDATRACK is niet beschikbaar.", privacy: "Versleuteld door TrackFleet · nooit zichtbaar voor klanten" },'
          new_nl = 'nl: { eyebrow: "BEDRIJFSPORTAAL", title: "Koppel uw SENDATRACK-wagenpark", body: "Gebruik dezelfde gegevens als in de SENDATRACK-app. Uw TrackFleet-ruimte wordt automatisch herkend.", account: "Account", user: "Gebruiker", password: "Wachtwoord", submit: "TrackFleet openen", loading: "Verbinden…", invalidCredentials: "Onjuiste SENDATRACK-gegevens.", serviceUnavailable: "SENDATRACK is tijdelijk niet beschikbaar. Probeer het zo opnieuw.", loginFailed: "Aanmelden mislukt. Probeer opnieuw.", privacy: "Versleuteld door TrackFleet · nooit zichtbaar voor klanten" },'
          for old, new in [(old_fr,new_fr),(old_en,new_en),(old_nl,new_nl)]:
              if old not in text:
                  raise SystemExit("login copy marker missing")
              text = text.replace(old,new)

          old_render = '{error && <p className="login-error" role="alert">{copy.error}</p>}'
          new_render = '{error && <p className="login-error" role="alert">{error === "invalid_credentials" ? copy.invalidCredentials : error === "service_unavailable" ? copy.serviceUnavailable : copy.loginFailed}</p>}'
          if old_render not in text:
              raise SystemExit("login error render marker missing")
          text = text.replace(old_render,new_render)

          text = text.replace('const [loginError, setLoginError] = useState("");', 'const [loginError, setLoginError] = useState<LoginErrorKind | "">("");')

          old_login = '''      const response = await fetch("/api/auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ accountID: form.get("accountID"), user: form.get("user"), password: form.get("password") }) });\n      if (!response.ok) throw new Error("login_failed");\n      const data = await response.json() as { company: CompanyIdentity };\n      setCompany(data.company);\n      setAuthState("authenticated");\n    } catch {\n      setLoginError("login_failed");\n'''
          new_login = '''      const response = await fetch("/api/auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ accountID: form.get("accountID"), user: form.get("user"), password: form.get("password") }) });\n      const data = await response.json() as { company?: CompanyIdentity; error?: string };\n      if (!response.ok) {\n        setLoginError(classifyLoginError(response.status, data.error));\n        return;\n      }\n      if (!data.company) {\n        setLoginError("login_failed");\n        return;\n      }\n      setCompany(data.company);\n      setAuthState("authenticated");\n    } catch {\n      setLoginError("login_failed");\n'''
          if old_login not in text:
              raise SystemExit("login handler marker missing")
          page.write_text(text.replace(old_login,new_login))

          package = Path("package.json")
          package_text = package.read_text()
          marker = '    "test:customer-contact": "node --experimental-strip-types --test tests/customer-contact.test.mjs",\n'
          if 'test:login-error' not in package_text:
              package.write_text(package_text.replace(marker, marker + '    "test:login-error": "node --experimental-strip-types --test tests/login-error.test.mjs",\n'))

      - name: Test login error classification
        run: node --experimental-strip-types --test tests/login-error.test.mjs
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/lib/login-error.ts tests/login-error.test.mjs package.json
          git commit -m "differentiate SENDATRACK login errors"
          git push

name: Patch dispatch data gate

on:
  push:
    paths:
      - ".github/workflows/patch-dispatch-data-gate.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Gate dashboard until real delivery data is resolved
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          state_marker = '  const [authState, setAuthState] = useState<"loading" | "anonymous" | "authenticated">("loading");\n'
          state_add = '  const [dispatchDataState, setDispatchDataState] = useState<"loading" | "ready" | "error">("loading");\n'
          if 'const [dispatchDataState' not in s:
            if state_marker not in s: raise SystemExit('auth state marker missing')
            s = s.replace(state_marker, state_marker + state_add, 1)

          success_marker = '''        } else if (!tracking) {\n          setDeliveries(data.deliveries);\n          if (data.deliveries.length && !data.deliveries.some((delivery) => delivery.id === selectedId)) setSelectedId(data.deliveries[0].id);\n        }'''
          success_new = '''        } else if (!tracking) {\n          setDeliveries(data.deliveries);\n          setDispatchDataState("ready");\n          if (data.deliveries.length && !data.deliveries.some((delivery) => delivery.id === selectedId)) setSelectedId(data.deliveries[0].id);\n        }'''
          if success_marker not in s: raise SystemExit('delivery refresh success marker missing')
          s = s.replace(success_marker, success_new, 1)

          catch_marker = '''      } catch {\n        if (new URLSearchParams(window.location.search).get("tracking")) setPublicTrackingState("error");\n        if (active && !silent) setToast(t.cloudReconnecting);\n      }'''
          catch_new = '''      } catch {\n        const tracking = new URLSearchParams(window.location.search).get("tracking");\n        if (tracking) setPublicTrackingState("error");\n        if (active && !tracking) {\n          setDeliveries([]);\n          setStopPlans([]);\n          setDispatchDataState("error");\n        }\n        if (active && !silent) setToast(t.cloudReconnecting);\n      }'''
          if catch_marker not in s: raise SystemExit('delivery refresh catch marker missing')
          s = s.replace(catch_marker, catch_new, 1)

          login_marker = '''      setCompany(data.company);\n      setAuthState("authenticated");'''
          login_new = '''      setCompany(data.company);\n      setDispatchDataState("loading");\n      setAuthState("authenticated");'''
          if login_marker not in s: raise SystemExit('login state marker missing')
          s = s.replace(login_marker, login_new, 1)

          logout_marker = '''    setCompany(null);\n    setAuthState("anonymous");'''
          logout_new = '''    setCompany(null);\n    setDeliveries([]);\n    setStopPlans([]);\n    setDispatchDataState("loading");\n    setAuthState("anonymous");'''
          if logout_marker not in s: raise SystemExit('logout marker missing')
          s = s.replace(logout_marker, logout_new, 1)

          render_marker = '''  if (view !== "customer" && authState === "loading") return <main className="login-page login-loading"><div className="brand brand-dark"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></div></main>;\n  if (view !== "customer" && authState === "anonymous") return <LoginScreen locale={locale} busy={loginBusy} error={loginError} onLocale={changeLocale} onSubmit={login} />;'''
          render_new = '''  if (view !== "customer" && authState === "loading") return <main className="login-page login-loading"><div className="brand brand-dark"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></div></main>;\n  if (view !== "customer" && authState === "anonymous") return <LoginScreen locale={locale} busy={loginBusy} error={loginError} onLocale={changeLocale} onSubmit={login} />;\n  if (view !== "customer" && authState === "authenticated" && dispatchDataState === "loading") return <main className="login-page login-loading"><div className="brand brand-dark"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></div></main>;\n  if (view !== "customer" && authState === "authenticated" && dispatchDataState === "error") return <main className="login-page login-loading"><section className="tracking-error"><div className="brand brand-dark"><span className="brand-mark"><span>↗</span></span><span>TrackFleet</span></div><h1>{locale === "fr" ? "Données temporairement indisponibles" : locale === "nl" ? "Gegevens tijdelijk niet beschikbaar" : "Data temporarily unavailable"}</h1><p>{locale === "fr" ? "TrackFleet n’affiche aucune donnée de démonstration à la place de vos données réelles." : locale === "nl" ? "TrackFleet toont geen demogegevens in plaats van uw echte gegevens." : "TrackFleet will not show demo data in place of your real data."}</p><button className="primary-button" onClick={() => window.location.reload()}>{locale === "fr" ? "Réessayer" : locale === "nl" ? "Opnieuw proberen" : "Retry"}</button></section></main>;'''
          if render_marker not in s: raise SystemExit('dispatch render gate marker missing')
          s = s.replace(render_marker, render_new, 1)
          p.write_text(s)

          p = Path('tests/dispatch-data-gate.test.mjs')
          p.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport fs from "node:fs";\n\nconst source = fs.readFileSync(new URL("../app/page.tsx", import.meta.url), "utf8");\n\ntest("authenticated dashboard is gated until real API data resolves", () => {\n  assert.match(source, /dispatchDataState === "loading"/);\n  assert.match(source, /setDispatchDataState\\("ready"\\)/);\n});\n\ntest("delivery API failure clears displayed rows instead of leaving demo deliveries", () => {\n  assert.match(source, /setDeliveries\\(\\[\\]\\);\\n\\s+setStopPlans\\(\\[\\]\\);\\n\\s+setDispatchDataState\\("error"\\)/);\n});\n''')

          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:route-api-context-safety": "node --test tests/route-api-context-safety.test.mjs",\n'
          if 'test:dispatch-data-gate' not in s:
            if marker not in s: raise SystemExit('package safety marker missing')
            s = s.replace(marker, marker + '    "test:dispatch-data-gate": "node --test tests/dispatch-data-gate.test.mjs",\n')
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:dispatch-data-gate
          pnpm run test:route-api-context-safety
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx tests/dispatch-data-gate.test.mjs package.json
          git commit -m "never expose demo deliveries as live dashboard data"
          git push

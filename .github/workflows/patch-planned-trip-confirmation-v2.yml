name: Patch planned trip confirmation v2

on:
  push:
    paths:
      - ".github/workflows/patch-planned-trip-confirmation-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply planned trip confirmation and current UI contract
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/patch-planned-trip-confirmation.yml').read_text()
          start = source.index('      - name: Add tenant-safe planned trip confirmation')
          run_start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - run: pnpm install --no-frozen-lockfile', run_start)
          script = textwrap.dedent(source[run_start:end])
          exec(compile(script, '<planned-trip-confirmation>', 'exec'))

          Path('tests/assignment-queue-ui.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst page = fs.readFileSync(new URL("../app/page.tsx", import.meta.url), "utf8");\n\ntest("dashboard keeps unassigned parcels in a dedicated queue", () => {\n  assert.match(page, /unassignedDeliveries/);\n  assert.match(page, /Colis à affecter/);\n});\n\ntest("planned trip suggestion requires explicit operator confirmation", () => {\n  assert.match(page, /suggestPlannedTrip/);\n  assert.match(page, /Confirmer ce voyage/);\n  assert.match(page, /assignSuggestedTrip/);\n  assert.match(page, /\\/api\\/deliveries\\/assign-trip/);\n});\n\ntest("operator can still choose another truck instead of accepting the suggestion", () => {\n  assert.match(page, /Choisir un autre camion/);\n  assert.match(page, /setVehicleLinkOpen\\(true\\)/);\n});\n''')
      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:trip-assignment
          pnpm run test:planned-trip-assignment-contract
          pnpm run test:explicit-trip-membership
          pnpm run test:assignment-queue-ui
          pnpm run test:vehicle-linking
          pnpm run test:automation-trip-sync
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app tests package.json
          git commit -m "confirm parcels onto planned trips safely"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

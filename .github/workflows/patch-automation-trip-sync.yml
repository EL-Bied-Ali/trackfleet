name: Patch autonomous trip lifecycle

on:
  push:
    paths:
      - ".github/workflows/patch-automation-trip-sync.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Keep trips synchronized during autonomous GPS ticks
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/lib/server-automation.ts')
          s = p.read_text()
          s = s.replace('import { buildEtaRouteContexts, stableEtaRouteContext } from "./route-history";\n', 'import { buildEtaRouteContexts, stableEtaRouteContext } from "./route-history";\nimport { buildTruckStopPlans } from "./truck-stop-plan";\nimport { stablePlanRouteTemplateId } from "./route-learning";\nimport { tripStatusFromDeliveryStatuses, tripStopsFromPlan } from "./trip-record";\n', 1)
          old = '  const routeContexts = buildEtaRouteContexts(deliveries);\n  let etaObservations = 0;\n'
          new = '  const routeContexts = buildEtaRouteContexts(deliveries);\n  const stableContexts = new Map<string, ReturnType<typeof stableEtaRouteContext>>();\n  let etaObservations = 0;\n'
          if old not in s: raise SystemExit('route contexts marker missing')
          s = s.replace(old, new, 1)
          old = '    const routeContext = stableEtaRouteContext(routeContexts.get(delivery.id) ?? null, previousEtaObservations, events);\n    const etaObservation = buildEtaObservation(delivery, events, deliveries, routeContext);\n'
          new = '    const routeContext = stableEtaRouteContext(routeContexts.get(delivery.id) ?? null, previousEtaObservations, events);\n    stableContexts.set(delivery.id, routeContext);\n    const etaObservation = buildEtaObservation(delivery, events, deliveries, routeContext);\n'
          if old not in s: raise SystemExit('stable context marker missing')
          s = s.replace(old, new, 1)
          marker = '  const notifications = await processPendingNotifications(companyId, origin);\n'
          block = '''  const rowById = new Map(deliveries.map((delivery) => [delivery.id, delivery]));\n  const plans = buildTruckStopPlans(deliveries);\n  const activeTripIds = new Set<string>();\n  for (const plan of plans) {\n    const deliveryIds = plan.stops.flatMap((stop) => stop.deliveryIds);\n    const routeTemplateId = stablePlanRouteTemplateId(plan.routeTemplateId, deliveryIds, stableContexts);\n    const tripInstanceId = deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n    if (!tripInstanceId) continue;\n    const persistedTrip = await store.upsertTrip({\n      id: tripInstanceId,\n      companyId,\n      routeTemplateId,\n      vehicleKey: plan.vehicleKey,\n      truck: plan.truck,\n      sendatrackVehicleId: plan.sendatrackVehicleId,\n      originSiteId: plan.originSiteId,\n      stops: tripStopsFromPlan(plan.stops),\n      status: tripStatusFromDeliveryStatuses(deliveryIds.flatMap((id) => { const status = rowById.get(id)?.status; return status ? [status] : []; })),\n    });\n    activeTripIds.add(persistedTrip.id);\n    await Promise.all(deliveryIds.map((deliveryId) => store.assignDeliveryTrip(deliveryId, companyId, persistedTrip.id)));\n  }\n\n  const persistedTrips = await store.listTrips(companyId, 500);\n  for (const trip of persistedTrips) {\n    if (trip.status === "completed" || activeTripIds.has(trip.id)) continue;\n    const deliveryIds = await store.listDeliveryIdsForTrip(companyId, trip.id);\n    const statuses = deliveryIds.flatMap((id) => { const status = rowById.get(id)?.status; return status ? [status] : []; });\n    if (tripStatusFromDeliveryStatuses(statuses) !== "completed") continue;\n    await store.upsertTrip({\n      id: trip.id, companyId: trip.companyId, routeTemplateId: trip.routeTemplateId, vehicleKey: trip.vehicleKey,\n      truck: trip.truck, sendatrackVehicleId: trip.sendatrackVehicleId, originSiteId: trip.originSiteId, stops: trip.stops, status: "completed",\n    });\n  }\n\n'''
          if marker not in s: raise SystemExit('notification marker missing')
          s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          Path('tests/automation-trip-sync.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst source = fs.readFileSync(new URL("../app/lib/server-automation.ts", import.meta.url), "utf8");\n\ntest("autonomous tick persists, assigns and completes trips", () => {\n  assert.match(source, /store\.upsertTrip/);\n  assert.match(source, /store\.assignDeliveryTrip/);\n  assert.match(source, /store\.listDeliveryIdsForTrip/);\n  assert.match(source, /tripStatusFromDeliveryStatuses/);\n  assert.match(source, /status: "completed"/);\n});\n''')

          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:automation-delay": "node --experimental-strip-types --test tests/automation-delay.test.mjs",\n'
          if marker not in s: raise SystemExit('automation delay package marker missing')
          s = s.replace(marker, marker + '    "test:automation-trip-sync": "node --test tests/automation-trip-sync.test.mjs",\n', 1)
          p.write_text(s)

      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:automation-trip-sync
          pnpm run test:automation-delay
          pnpm run test:trip-record
          pnpm run test:trip-persistence
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app tests package.json
          git commit -m "sync persistent trips during automation ticks"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

name: TrackFleet automation tick

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: trackfleet-automation-tick
  cancel-in-progress: false

jobs:
  tick:
    if: ${{ vars.TRACKFLEET_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BASE_URL: ${{ vars.TRACKFLEET_BASE_URL || 'https://trackfleet-self.vercel.app' }}
      CRON_SECRET: ${{ secrets.TRACKFLEET_CRON_SECRET }}
    steps:
      - name: Run TrackFleet automation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const secret = (process.env.CRON_SECRET || '').trim();
          if (!secret) throw new Error('TRACKFLEET_CRON_SECRET is empty');

          const healthResponse = await fetch(`${baseUrl}/api/health`, { cache: 'no-store' });
          if (!healthResponse.ok) throw new Error(`health_http_${healthResponse.status}`);
          const health = await healthResponse.json();
          const ready = health?.storage?.persistent === true
            && health?.storage?.connected === true
            && health?.automation?.tickProtected === true;
          if (!ready) throw new Error('production_not_ready');

          const probeResponse = await fetch(`${baseUrl}/api/automation/sendatrack-history-probe`, {
            headers: { authorization: `Bearer ${secret}` },
            cache: 'no-store',
          });
          console.log(`sendatrack_history_probe:${probeResponse.status}:${await probeResponse.text()}`);
          if (!probeResponse.ok) throw new Error(`probe_http_${probeResponse.status}`);
          NODE

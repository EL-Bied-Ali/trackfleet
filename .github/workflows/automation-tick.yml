name: TrackFleet automation heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Cloudflare production deploy"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: trackfleet-automation-heartbeat
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    env:
      BASE_URL: ${{ vars.TRACKFLEET_BASE_URL || 'https://trackfleet.chronoplan.workers.dev' }}
    steps:
      - name: Read production automation heartbeat
        id: heartbeat
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(`${process.env.BASE_URL}/api/health`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`health_http_${response.status}`);
          const health = await response.json();
          const automation = health?.automation ?? {};
          const summary = {
            ready: automation.ready === true,
            live: automation.live === true,
            heartbeatAvailable: automation.heartbeatAvailable === true,
            missing: Array.isArray(automation.missing) ? automation.missing : [],
          };
          console.log(JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${summary.ready ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `live=${summary.live ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `missing=${summary.missing.join(',') || 'none'}\n`);
          NODE

      - name: Publish automation heartbeat status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEARTBEAT_OUTCOME: ${{ steps.heartbeat.outcome }}
          READY: ${{ steps.heartbeat.outputs.ready }}
          LIVE: ${{ steps.heartbeat.outputs.live }}
          MISSING: ${{ steps.heartbeat.outputs.missing }}
        shell: bash
        run: |
          if [ "$HEARTBEAT_OUTCOME" != "success" ]; then
            state="failure"
            description="Production automation health could not be read"
          elif [ "$LIVE" = "true" ]; then
            state="success"
            description="Cloudflare automation heartbeat is live"
          elif [ "$READY" = "true" ]; then
            state="pending"
            description="Automation ready; waiting for Cloudflare heartbeat"
          else
            state="pending"
            description="Automation not ready: ${MISSING:-unknown}"
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" \
            -f context="trackfleet/automation-heartbeat" \
            -f target_url="$RUN_URL" \
            -f description="${description:0:140}"

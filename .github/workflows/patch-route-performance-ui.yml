name: Patch route performance UI

on:
  push:
    paths:
      - ".github/workflows/patch-route-performance-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Expose route performance and remove demo seed state
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          old = '      const learning = routeLearningState({\n        historicalTrips: history.tripCount,\n        learnedStops: futureStopIds.filter((siteId) => learnedDwell.has(siteId)).length,\n        futureStops: futureStopIds.length,\n        unconfiguredStops,\n      });'
          new = '      const learning = routeLearningState({\n        historicalTrips: history.tripCount,\n        learnedStops: futureStopIds.filter((siteId) => learnedDwell.has(siteId)).length,\n        futureStops: futureStopIds.length,\n        unconfiguredStops,\n        medianEffectiveSpeedKmh: history.medianEffectiveSpeedKmh,\n        medianDelayMinutes: history.medianDelayMinutes,\n      });'
          if old not in s: raise SystemExit('route learning API marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/page.tsx')
          s = p.read_text()
          old_type = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; tripInstanceId?: string | null; originSiteId: string | null; source: "planned-arrival"; stops: TourStop[]; learning?: { historicalTrips: number; requiredTrips: number; learnedStops: number; futureStops: number; unconfiguredStops: number; etaHistoryReady: boolean; dwellHistoryReady: boolean; stage: "collecting" | "partial" | "ready" } };'
          new_type = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; tripInstanceId?: string | null; originSiteId: string | null; source: "planned-arrival"; stops: TourStop[]; learning?: { historicalTrips: number; requiredTrips: number; learnedStops: number; futureStops: number; unconfiguredStops: number; etaHistoryReady: boolean; dwellHistoryReady: boolean; medianEffectiveSpeedKmh: number | null; medianDelayMinutes: number | null; stage: "collecting" | "partial" | "ready" } };'
          if old_type not in s: raise SystemExit('TourPlan type marker missing')
          s = s.replace(old_type, new_type, 1)

          seed_start = s.find('const initialDeliveries: Delivery[] = [')
          if seed_start == -1: raise SystemExit('demo seed start missing')
          seed_end = s.find('];\n\nconst statusClass', seed_start)
          if seed_end == -1: raise SystemExit('demo seed end missing')
          empty = 'const emptyDelivery: Delivery = {\n  id: "",\n  customer: "",\n  destination: "",\n  truck: "",\n  driver: "",\n  status: "Loading",\n  eta: "",\n  progress: 0,\n  color: "#6b7280",\n};\n\n'
          s = s[:seed_start] + empty + s[seed_end + 4:]
          s = s.replace('const [deliveries, setDeliveries] = useState(initialDeliveries);', 'const [deliveries, setDeliveries] = useState<Delivery[]>([]);', 1)
          s = s.replace('const [selectedId, setSelectedId] = useState("TF-2841");', 'const [selectedId, setSelectedId] = useState("");', 1)
          s = s.replace('const selected = deliveries.find((item) => item.id === selectedId) ?? deliveries[0] ?? initialDeliveries[0];', 'const selected = deliveries.find((item) => item.id === selectedId) ?? deliveries[0] ?? emptyDelivery;', 1)

          needle = '</span></div>}\n              <div className="tour-stops">'
          perf = '</span>{plan.learning.medianEffectiveSpeedKmh !== null && <span>{locale === "fr" ? "Vitesse médiane" : locale === "nl" ? "Mediane snelheid" : "Median speed"}: {plan.learning.medianEffectiveSpeedKmh} km/h{plan.learning.medianDelayMinutes !== null ? ` · ${locale === "fr" ? "retard médian" : locale === "nl" ? "mediane vertraging" : "median delay"}: ${plan.learning.medianDelayMinutes > 0 ? "+" : ""}${plan.learning.medianDelayMinutes} min` : ""}</span>}</div>}\n              <div className="tour-stops">'
          if needle not in s: raise SystemExit('tour learning UI marker missing')
          s = s.replace(needle, perf, 1)
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:route-learning
          pnpm run test:route-history
          pnpm run test:tour-view
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/deliveries/route.ts app/page.tsx
          git commit -m "surface route performance and remove demo delivery seeds"
          git pull --rebase origin main
          git push

name: Patch delivery trip assignment v2

on:
  push:
    paths:
      - ".github/workflows/patch-trip-assignment-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply validated patch with typed status collection
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/patch-trip-assignment.yml').read_text()
          start = source.index('      - name: Link deliveries to persistent trips')
          run_start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - name: Install dependencies', run_start)
          script = textwrap.dedent(source[run_start:end])
          script = script.replace(
            'deliveryIds.map((id) => rowById.get(id)?.status).filter((status): status is string => Boolean(status))',
            'deliveryIds.flatMap((id) => { const status = rowById.get(id)?.status; return status ? [status] : []; })'
          )
          exec(compile(script, '<trip-assignment-patch>', 'exec'))
      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:trip-record
          pnpm run test:trip-persistence
          pnpm run test:tour
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app db tests package.json
          git commit -m "link deliveries to persistent trips"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

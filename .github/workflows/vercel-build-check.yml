name: Platform build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sendatrack-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify SENDATRACK normalization
        run: pnpm run test:sendatrack
      - name: Verify SENDATRACK legacy history URL contract
        run: pnpm run test:sendatrack-history-url
      - name: Verify SENDATRACK legacy history identity and transport safety
        run: node --test tests/sendatrack-history-identity.test.mjs
      - name: Verify full fleet GPS history storage
        run: pnpm run test:fleet-position-history
      - name: Verify fleet GPS trip reconstruction
        run: pnpm run test:fleet-trip-reconstruction
      - name: Verify authenticated fleet history API
        run: pnpm run test:fleet-history-api
      - name: Verify SENDATRACK historical event parsing
        run: node --experimental-strip-types --test tests/sendatrack-history.test.mjs
      - name: Verify GPS route progress
        run: pnpm run test:route-progress
      - name: Verify delivery event detection
        run: pnpm run test:delivery-events
      - name: Verify notification retry queue
        run: pnpm run test:notifications
      - name: Verify notification activation policy
        run: pnpm run test:notification-policy
      - name: Verify public tracking expiry
        run: pnpm run test:tracking-access
      - name: Verify public provider isolation
        run: pnpm run test:public-provider-isolation
      - name: Verify customer contact normalization
        run: pnpm run test:customer-contact
      - name: Verify SENDATRACK login error classification
        run: pnpm run test:login-error
      - name: Verify remembered origin preference
        run: pnpm run test:origin-preference
      - name: Verify safe vehicle linking
        run: pnpm run test:vehicle-linking
      - name: Verify delivery vehicle creation choice
        run: pnpm run test:delivery-vehicle-choice
      - name: Verify unassigned delivery trip safety
        run: pnpm run test:unassigned-trip-safety
      - name: Verify planned trip suggestions
        run: pnpm run test:trip-suggestion
      - name: Verify parcel assignment queue UI
        run: pnpm run test:assignment-queue-ui
      - name: Verify explicit trip membership
        run: pnpm run test:explicit-trip-membership
      - name: Verify planned trip assignment rules
        run: pnpm run test:trip-assignment
      - name: Verify planned trip assignment persistence contract
        run: pnpm run test:planned-trip-assignment-contract
      - name: Verify unassigned direct vehicle link guard
        run: pnpm run test:unassigned-direct-link-guard
      - name: Verify planned trip creation rules
        run: pnpm run test:planned-trip-creation
      - name: Verify planned trip creation API and UI
        run: pnpm run test:create-trip-api-contract
      - name: Verify trip-aware dashboard keys
        run: pnpm run test:trip-ui-key-contract
      - name: Verify dashboard empty states and tracking link safety
        run: node --test tests/dashboard-polish.test.mjs
      - name: Verify WhatsApp consent withdrawal
        run: node --test tests/whatsapp-consent-withdrawal.test.mjs
      - name: Verify authenticated request origin safety
        run: node --experimental-strip-types --test tests/request-origin-security.test.mjs
      - name: Verify malformed JSON and mutation input bounds
        run: node --experimental-strip-types --test tests/request-json-safety.test.mjs
      - name: Verify tenant isolation
        run: pnpm run test:tenant-isolation
      - name: Verify agency site registry
        run: pnpm run test:known-sites
      - name: Verify persistent company site store
        run: pnpm run test:site-store
      - name: Verify tenant-safe delivery site resolution
        run: pnpm run test:delivery-site-resolution
      - name: Verify delivery persistence contract
        run: pnpm run test:delivery-persistence
      - name: Verify truck stop plans
        run: pnpm run test:stop-plans
      - name: Verify learned agency dwell times
        run: pnpm run test:stop-dwell
      - name: Verify full multi-stop tour
        run: pnpm run test:tour
      - name: Verify active tour presentation
        run: pnpm run test:tour-view
      - name: Verify route API context safety
        run: pnpm run test:route-api-context-safety
      - name: Verify dashboard data gate
        run: pnpm run test:dispatch-data-gate
      - name: Verify reusable route identity
        run: pnpm run test:route-template
      - name: Verify persistent trip snapshot model
        run: pnpm run test:trip-record
      - name: Verify delivery trip persistence
        run: pnpm run test:trip-persistence
      - name: Verify complete trip snapshot refresh
        run: pnpm run test:trip-upsert-refresh
      - name: Verify persistent completed trip history
        run: pnpm run test:trip-history
      - name: Verify completed route history summaries
        run: pnpm run test:trip-history-summary
      - name: Verify completed route history API
        run: pnpm run test:trip-route-history-api
      - name: Verify completed route history dashboard
        run: pnpm run test:trip-route-history-ui
      - name: Verify logout tenant state cleanup
        run: pnpm run test:logout-state-cleanup
      - name: Verify automation storage safety
        run: pnpm run test:automation-readiness
      - name: Verify automation health diagnostics
        run: pnpm run test:automation-health
      - name: Verify stable automation public origin
        run: node --test tests/automation-origin-contract.test.mjs
      - name: Verify WhatsApp production readiness safety
        run: pnpm run test:whatsapp-readiness
      - name: Verify WhatsApp production preflight contract
        run: pnpm run test:whatsapp-preflight
      - name: Verify WhatsApp dry-run preview safety
        run: pnpm run test:whatsapp-preview
      - name: Verify WhatsApp MVP customer flow
        run: pnpm run test:whatsapp-mvp
      - name: Verify ETA estimator
        run: pnpm run test:eta
      - name: Verify ETA history observations
        run: pnpm run test:eta-observation
      - name: Verify explainable ETA labels
        run: pnpm run test:eta-display
      - name: Verify route history ETA learning
        run: pnpm run test:route-history
      - name: Verify route learning status
        run: pnpm run test:route-learning
      - name: Verify delay detection
        run: pnpm run test:delay
      - name: Verify autonomous delay detection
        run: pnpm run test:automation-delay
      - name: Verify autonomous trip synchronization
        run: pnpm run test:automation-trip-sync

  build-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
      NITRO_PRESET: "vercel"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint application
        run: pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
      - name: Typecheck Vercel app runtime
        run: pnpm exec tsc -p tsconfig.vercel.json --noEmit
      - name: Build Vercel output
        run: pnpm run build:vercel

  build-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Cloudflare output
        run: pnpm run build

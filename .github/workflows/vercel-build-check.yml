name: Vercel build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
      NITRO_PRESET: "vercel"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Report Cloudflare-only imports
        run: grep -RIn 'cloudflare:workers' app || true
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Vercel output
        run: pnpm run build:vercel

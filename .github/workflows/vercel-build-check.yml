name: Platform build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sendatrack-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify SENDATRACK normalization
        run: pnpm run test:sendatrack
      - name: Verify GPS route progress
        run: pnpm run test:route-progress
      - name: Verify delivery event detection
        run: pnpm run test:delivery-events
      - name: Verify notification retry queue
        run: pnpm run test:notifications
      - name: Verify notification activation policy
        run: pnpm run test:notification-policy
      - name: Verify public tracking expiry
        run: pnpm run test:tracking-access
      - name: Verify customer contact normalization
        run: pnpm run test:customer-contact
      - name: Verify SENDATRACK login error classification
        run: pnpm run test:login-error
      - name: Verify remembered origin preference
        run: pnpm run test:origin-preference
      - name: Verify safe vehicle linking
        run: pnpm run test:vehicle-linking
      - name: Verify tenant isolation
        run: pnpm run test:tenant-isolation
      - name: Verify agency site registry
        run: pnpm run test:known-sites
      - name: Verify persistent company site store
        run: pnpm run test:site-store
      - name: Verify tenant-safe delivery site resolution
        run: pnpm run test:delivery-site-resolution
      - name: Verify delivery persistence contract
        run: pnpm run test:delivery-persistence
      - name: Verify truck stop plans
        run: pnpm run test:stop-plans
      - name: Verify learned agency dwell times
        run: pnpm run test:stop-dwell
      - name: Verify full multi-stop tour
        run: pnpm run test:tour
      - name: Verify active tour presentation
        run: pnpm run test:tour-view
      - name: Verify reusable route identity
        run: pnpm run test:route-template
      - name: Verify automation storage safety
        run: pnpm run test:automation-readiness
      - name: Verify automation health diagnostics
        run: pnpm run test:automation-health
      - name: Verify WhatsApp production readiness safety
        run: pnpm run test:whatsapp-readiness
      - name: Verify WhatsApp dry-run preview safety
        run: pnpm run test:whatsapp-preview
      - name: Verify ETA estimator
        run: pnpm run test:eta
      - name: Verify ETA history observations
        run: pnpm run test:eta-observation
      - name: Verify explainable ETA labels
        run: pnpm run test:eta-display
      - name: Verify route history ETA learning
        run: pnpm run test:route-history
      - name: Verify delay detection
        run: pnpm run test:delay
      - name: Verify autonomous delay detection
        run: pnpm run test:automation-delay

  build-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
      NITRO_PRESET: "vercel"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Vercel output
        run: pnpm run build:vercel

  build-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Cloudflare output
        run: pnpm run build

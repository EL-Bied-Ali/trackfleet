name: Platform build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sendatrack-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify SENDATRACK normalization
        run: pnpm run test:sendatrack
      - name: Verify GPS route progress
        run: pnpm run test:route-progress

  build-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL: "1"
      NITRO_PRESET: "vercel"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Vercel output
        run: pnpm run build:vercel

  build-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Cloudflare output
        run: pnpm run build

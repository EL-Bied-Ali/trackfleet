name: Patch online manual truck creation

on:
  push:
    paths:
      - ".github/workflows/patch-manual-truck-online.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Allow manual truck while SENDATRACK is connected
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          import_marker = 'import { customerEtaNote, etaExplanation } from "./lib/eta-display";\n'
          if 'delivery-vehicle-choice' not in s:
            if import_marker not in s: raise SystemExit('vehicle choice import marker missing')
            s = s.replace(import_marker, import_marker + 'import { resolveCreationVehicle } from "./lib/delivery-vehicle-choice";\n', 1)

          old_choice = '''    const selectedVehicleId = String(form.get("sendatrackVehicleId") ?? "").trim();
    const manualTruck = String(form.get("manualTruck") ?? "").trim();
    const liveVehicle = integration.vehicles.find((vehicle) => vehicle.id === selectedVehicleId);
    const truck = liveVehicle?.name ?? (manualTruck || selectedVehicleId);'''
          new_choice = '''    const selectedVehicleId = String(form.get("sendatrackVehicleId") ?? "").trim();
    const manualTruck = String(form.get("manualTruck") ?? "").trim();
    const vehicleChoice = resolveCreationVehicle({ manualTruck, selectedVehicleId, vehicles: integration.vehicles });
    const truck = vehicleChoice.truck;'''
          if old_choice not in s: raise SystemExit('create vehicle choice marker missing')
          s = s.replace(old_choice, new_choice, 1)
          s = s.replace('      sendatrackVehicleId: liveVehicle?.id ?? "",', '      sendatrackVehicleId: vehicleChoice.sendatrackVehicleId,', 1)

          old_form = '''{integration.connected && integration.vehicles.length ? <label>{t.assignTruck}<select name="sendatrackVehicleId" defaultValue={integration.vehicles[0]?.id ?? ""}>{integration.vehicles.map((vehicle) => <option key={vehicle.id} value={vehicle.id}>{vehicle.name}</option>)}</select></label> : <label>{t.assignTruck}<input name="manualTruck" required placeholder={locale === "fr" ? "Ex. TRK-005 / plaque" : locale === "nl" ? "Bijv. TRK-005 / nummerplaat" : "E.g. TRK-005 / plate"} /><small>{locale === "fr" ? "SENDATRACK hors ligne : le GPS sera rattaché automatiquement quand le camion réapparaîtra." : locale === "nl" ? "SENDATRACK offline: GPS wordt automatisch gekoppeld zodra de vrachtwagen terug verschijnt." : "SENDATRACK offline: GPS will attach automatically when the truck reappears."}</small></label>}'''
          new_form = '''{integration.connected && integration.vehicles.length ? <label>{t.assignTruck}<select name="sendatrackVehicleId" defaultValue={integration.vehicles[0]?.id ?? ""}>{integration.vehicles.map((vehicle) => <option key={vehicle.id} value={vehicle.id}>{vehicle.name}</option>)}</select><input name="manualTruck" placeholder={locale === "fr" ? "Camion absent ? Nom / plaque (optionnel)" : locale === "nl" ? "Voertuig ontbreekt? Naam / nummerplaat (optioneel)" : "Truck missing? Name / plate (optional)"} /><small>{locale === "fr" ? "Si vous saisissez un camion ici, il sera créé en attente GPS puis associé quand il apparaîtra dans SENDATRACK." : locale === "nl" ? "Als u hier een voertuig invoert, wordt het in afwachting van GPS aangemaakt en gekoppeld zodra het in SENDATRACK verschijnt." : "If you enter a truck here, it will be created waiting for GPS and linked when it appears in SENDATRACK."}</small></label> : <label>{t.assignTruck}<input name="manualTruck" required placeholder={locale === "fr" ? "Ex. TRK-005 / plaque" : locale === "nl" ? "Bijv. TRK-005 / nummerplaat" : "E.g. TRK-005 / plate"} /><small>{locale === "fr" ? "SENDATRACK hors ligne : le GPS sera rattaché automatiquement quand le camion réapparaîtra." : locale === "nl" ? "SENDATRACK offline: GPS wordt automatisch gekoppeld zodra de vrachtwagen terug verschijnt." : "SENDATRACK offline: GPS will attach automatically when the truck reappears."}</small></label>}'''
          if old_form not in s: raise SystemExit('connected truck form marker missing')
          s = s.replace(old_form, new_form, 1)
          p.write_text(s)

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:delivery-vehicle-choice
          pnpm run test:vehicle-linking
          pnpm exec eslint app/page.tsx app/lib/delivery-vehicle-choice.ts --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "allow manual truck creation while SENDATRACK is online"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

name: Patch assignment queue UI

on:
  push:
    paths:
      - ".github/workflows/patch-assignment-queue.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add conservative assignment queue and suggestions
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text()
          import_marker = 'import { resolveCreationVehicle, UNASSIGNED_VEHICLE_ID, isUnassignedVehicle } from "./lib/delivery-vehicle-choice";'
          alt_marker = 'import { isUnassignedVehicle, resolveCreationVehicle, UNASSIGNED_VEHICLE_ID } from "./lib/delivery-vehicle-choice";'
          target = import_marker if import_marker in s else alt_marker
          if target not in s: raise SystemExit('delivery vehicle import marker missing')
          if 'trip-suggestion' not in s:
            s = s.replace(target, target + '\nimport { suggestPlannedTrip } from "./lib/trip-suggestion";', 1)

          calc_marker = '  const mapDeliveries = integration.connected\n    ? deliveries.filter((delivery) => delivery.gpsSource === "sendatrack")\n    : deliveries;\n'
          calc_add = '''  const unassignedDeliveries = deliveries.filter((delivery) => delivery.status !== "Delivered" && isUnassignedVehicle(delivery));\n  const tripSuggestions = new Map(unassignedDeliveries.map((delivery) => [delivery.id, suggestPlannedTrip(delivery, trips)]));\n'''
          if calc_add not in s:
            if calc_marker not in s: raise SystemExit('map deliveries marker missing')
            s = s.replace(calc_marker, calc_marker + calc_add, 1)

          panel_marker = '        {stopPlans.length > 0 && <section className="tours-panel" aria-label={locale === "fr" ? "Tournées actives" : locale === "nl" ? "Actieve ritten" : "Active tours"}>\n'
          queue_panel = '''        {unassignedDeliveries.length > 0 && <section className="tours-panel" aria-label={locale === "fr" ? "Colis à affecter" : locale === "nl" ? "Toe te wijzen zendingen" : "Parcels to assign"}>\n          <div className="panel-header"><div><h2>{locale === "fr" ? "Colis à affecter" : locale === "nl" ? "Toe te wijzen zendingen" : "Parcels to assign"}</h2><p>{locale === "fr" ? "Le camion n’est pas figé à l’entrée du colis. Une suggestion apparaît seulement si un voyage planifié compatible existe." : locale === "nl" ? "Het voertuig wordt niet vastgezet bij registratie. Een suggestie verschijnt alleen voor een compatibele geplande rit." : "The truck is not locked when the parcel is registered. A suggestion appears only when a compatible planned trip exists."}</p></div><span className="tour-count">{unassignedDeliveries.length}</span></div>\n          <div className="tour-list">\n            {unassignedDeliveries.map((delivery) => {\n              const suggestion = tripSuggestions.get(delivery.id) ?? null;\n              const canPrepare = Boolean(suggestion?.sendatrackVehicleId && integration.vehicles.some((vehicle) => vehicle.id === suggestion.sendatrackVehicleId));\n              return <article className="tour-card" key={`assign-${delivery.id}`}>\n                <div className="tour-card-head"><div><strong>{delivery.customer}</strong><span>{delivery.id} · {delivery.destination}</span></div><small>{locale === "fr" ? "À affecter" : locale === "nl" ? "Toe te wijzen" : "To assign"}</small></div>\n                {suggestion ? <div className="eta-explanation"><strong>{locale === "fr" ? "Voyage compatible proposé" : locale === "nl" ? "Voorgestelde compatibele rit" : "Suggested compatible trip"}</strong><span>{suggestion.truck} · {suggestion.tripId} · {locale === "fr" ? `arrêt ${suggestion.stopSequence}` : locale === "nl" ? `stop ${suggestion.stopSequence}` : `stop ${suggestion.stopSequence}`}</span>{suggestion.plannedArrivalAt && <span>{new Date(suggestion.plannedArrivalAt).toLocaleString(locale === "fr" ? "fr-BE" : locale === "nl" ? "nl-BE" : "en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })}</span>}</div> : <div className="eta-explanation"><strong>{locale === "fr" ? "Aucune suggestion sûre" : locale === "nl" ? "Geen veilige suggestie" : "No safe suggestion"}</strong><span>{locale === "fr" ? "Le colis reste simplement en attente d’affectation." : locale === "nl" ? "De zending blijft gewoon wachten op toewijzing." : "The parcel simply remains waiting for assignment."}</span></div>}\n                <div className="popover-actions"><button type="button" onClick={() => { setSelectedId(delivery.id); setShowPopover(true); setVehicleLinkOpen(true); setVehicleLinkSearch(suggestion?.truck ?? ""); setVehicleLinkChoice(canPrepare ? suggestion?.sendatrackVehicleId ?? "" : ""); }}>{suggestion && canPrepare ? (locale === "fr" ? "Vérifier l’affectation" : locale === "nl" ? "Toewijzing controleren" : "Review assignment") : (locale === "fr" ? "Choisir un camion" : locale === "nl" ? "Voertuig kiezen" : "Choose a truck")}</button></div>\n              </article>;\n            })}\n          </div>\n        </section>}\n\n'''
          if queue_panel not in s:
            if panel_marker not in s: raise SystemExit('active tours marker missing')
            s = s.replace(panel_marker, queue_panel + panel_marker, 1)
          p.write_text(s)

          Path('tests/assignment-queue-ui.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst page = fs.readFileSync(new URL("../app/page.tsx", import.meta.url), "utf8");\n\ntest("dashboard keeps unassigned parcels in a dedicated queue", () => {\n  assert.match(page, /unassignedDeliveries/);\n  assert.match(page, /Colis à affecter/);\n});\n\ntest("suggestion remains review-only and never auto-links", () => {\n  assert.match(page, /suggestPlannedTrip/);\n  assert.match(page, /Vérifier l’affectation/);\n  assert.doesNotMatch(page, /suggestion[\\s\\S]{0,300}linkSelectedVehicle\(\)/);\n});\n''')

          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:trip-suggestion": "node --experimental-strip-types --test tests/trip-suggestion.test.mjs",\n'
          if marker not in s: raise SystemExit('trip suggestion script marker missing')
          if 'test:assignment-queue-ui' not in s:
            s = s.replace(marker, marker + '    "test:assignment-queue-ui": "node --test tests/assignment-queue-ui.test.mjs",\n', 1)
          p.write_text(s)

      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:trip-suggestion
          pnpm run test:assignment-queue-ui
          pnpm run test:unassigned-trip-safety
          pnpm run test:vehicle-linking
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app tests package.json
          git commit -m "add conservative parcel assignment queue"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

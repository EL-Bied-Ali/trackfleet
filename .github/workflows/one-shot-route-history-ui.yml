name: Apply frequent routes dashboard patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Render completed route history in dashboard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/page.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const typeAnchor = 'type TripHistoryItem = { id: string; routeTemplateId: string; vehicleKey: string; truck: string; sendatrackVehicleId: string; originSiteId: string | null; stops: Array<{ siteId: string; destination: string; sequence: number; plannedArrivalAt: string | null }>; status: "planned" | "active" | "completed"; createdAt: string; updatedAt: string };\n';
          if (!source.includes(typeAnchor)) throw new Error('route history type anchor missing');
          source = source.replace(typeAnchor, typeAnchor + 'type RouteHistoryItem = { routeTemplateId: string; originSiteId: string | null; destinationSiteIds: string[]; destinations: string[]; tripCount: number; trucks: string[]; lastCompletedAt: string };\n');

          const stateAnchor = '  const [trips, setTrips] = useState<TripHistoryItem[]>([]);\n';
          if (!source.includes(stateAnchor)) throw new Error('route history state anchor missing');
          source = source.replace(stateAnchor, stateAnchor + '  const [routeHistory, setRouteHistory] = useState<RouteHistoryItem[]>([]);\n');

          const dataTypeBefore = 'const data = await response.json() as { deliveries: Delivery[]; integration?: IntegrationState; features?: FeatureState; events?: DeliveryEventRow[]; stopPlans?: TourPlan[]; trips?: TripHistoryItem[] };';
          const dataTypeAfter = 'const data = await response.json() as { deliveries: Delivery[]; integration?: IntegrationState; features?: FeatureState; events?: DeliveryEventRow[]; stopPlans?: TourPlan[]; trips?: TripHistoryItem[]; routeHistory?: RouteHistoryItem[] };';
          if (!source.includes(dataTypeBefore)) throw new Error('route history response type anchor missing');
          source = source.replace(dataTypeBefore, dataTypeAfter);

          const setAnchor = '        if (!tracking) setTrips(data.trips ?? []);\n';
          if (!source.includes(setAnchor)) throw new Error('route history set anchor missing');
          source = source.replace(setAnchor, setAnchor + '        if (!tracking) setRouteHistory(data.routeHistory ?? []);\n');

          const clearAnchor = '          setTrips([]);\n          setDispatchDataState("error");';
          if (!source.includes(clearAnchor)) throw new Error('route history clear anchor missing');
          source = source.replace(clearAnchor, '          setTrips([]);\n          setRouteHistory([]);\n          setDispatchDataState("error");');

          const uiAnchor = '        {trips.some((trip) => trip.status === "completed") && <section className="tours-panel" aria-label={locale === "fr" ? "Voyages récents" : locale === "nl" ? "Recente ritten" : "Recent trips"}>\n';
          if (!source.includes(uiAnchor)) throw new Error('route history UI anchor missing');
          const routePanel = `        {routeHistory.length > 0 && <section className="tours-panel" aria-label={locale === "fr" ? "Routes fréquentes" : locale === "nl" ? "Frequente routes" : "Frequent routes"}>\n          <div className="panel-header"><div><h2>{locale === "fr" ? "Routes fréquentes" : locale === "nl" ? "Frequente routes" : "Frequent routes"}</h2><p>{locale === "fr" ? "Construites automatiquement à partir des tournées terminées" : locale === "nl" ? "Automatisch opgebouwd uit voltooide ritten" : "Built automatically from completed trips"}</p></div></div>\n          <div className="tour-list">\n            {routeHistory.slice(0, 6).map((route) => <article className="tour-card" key={\`\${route.routeTemplateId}-\${route.destinationSiteIds.join("-")}\`}>\n              <div className="tour-card-head"><div><strong>{route.destinations.join(" → ")}</strong><span>{route.trucks.join(" · ") || (locale === "fr" ? "Véhicule non renseigné" : locale === "nl" ? "Voertuig niet bekend" : "Vehicle unavailable")}</span></div><small>{route.tripCount} {locale === "fr" ? (route.tripCount > 1 ? "voyages" : "voyage") : locale === "nl" ? (route.tripCount > 1 ? "ritten" : "rit") : (route.tripCount > 1 ? "trips" : "trip")}</small></div>\n              <div className="tour-stops">{route.destinations.map((destination, index) => <div className="tour-stop" key={\`\${route.routeTemplateId}-\${route.destinationSiteIds[index] ?? index}\`}><i>{index + 1}</i><span><strong>{destination}</strong><small>{index === route.destinations.length - 1 ? (locale === "fr" ? "Destination finale" : locale === "nl" ? "Eindbestemming" : "Final destination") : (locale === "fr" ? "Arrêt intermédiaire" : locale === "nl" ? "Tussenstop" : "Intermediate stop")}</small></span></div>)}</div>\n              <small>{locale === "fr" ? "Dernier passage" : locale === "nl" ? "Laatste rit" : "Last run"} · {new Date(route.lastCompletedAt).toLocaleString(locale === "fr" ? "fr-BE" : locale === "nl" ? "nl-BE" : "en-GB", { day: "2-digit", month: "short", year: "numeric" })}</small>\n            </article>)}\n          </div>\n        </section>}\n\n`;
          source = source.replace(uiAnchor, routePanel + uiAnchor);
          fs.writeFileSync(path, source);

          const test = `import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst page = fs.readFileSync(new URL("../app/page.tsx", import.meta.url), "utf8");\n\ntest("dispatch dashboard consumes and renders completed route history", () => {\n  assert.match(page, /useState<RouteHistoryItem\[\]>\(\[\]\)/);\n  assert.match(page, /routeHistory\?: RouteHistoryItem\[\]/);\n  assert.match(page, /if \(!tracking\) setRouteHistory\(data\.routeHistory \?\? \[\]\)/);\n  assert.match(page, /routeHistory\.length > 0/);\n  assert.match(page, /Routes fréquentes/);\n  assert.match(page, /route\.destinations\.join\(" → "\)/);\n  assert.match(page, /route\.tripCount/);\n});\n`;
          fs.writeFileSync('tests/trip-route-history-ui.test.mjs', test);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['test:trip-route-history-ui'] = 'node --test tests/trip-route-history-ui.test.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          pnpm run test:trip-route-history-ui
          pnpm exec eslint app/page.tsx tests/trip-route-history-ui.test.mjs --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          git diff --check

          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx tests/trip-route-history-ui.test.mjs package.json
          git commit -m "show frequent completed routes in dashboard"
          git push origin HEAD:main

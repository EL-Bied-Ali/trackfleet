name: Deployed site smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for deployed Vercel site
        shell: bash
        run: |
          set -euo pipefail
          URL="https://trackfleet-self.vercel.app/"
          echo "Waiting for $URL"
          for attempt in $(seq 1 36); do
            code=$(curl --silent --location --output /tmp/trackfleet.html --write-out '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && [ -s /tmp/trackfleet.html ]; then
              echo "Live deployment returned HTTP 200 on attempt $attempt"
              grep -o -m1 '<title[^>]*>[^<]*</title>' /tmp/trackfleet.html || true
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 5
          done
          echo "Vercel site did not become ready"
          exit 1

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trackfleet-e2e
          cd /tmp/trackfleet-e2e
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://trackfleet-self.vercel.app/';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const consoleErrors = [];
          page.on('console', msg => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });

          try {
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            if (!response) throw new Error('No navigation response');
            if (!response.ok()) throw new Error(`Navigation failed with HTTP ${response.status()}`);

            await page.locator('body').waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(4000);

            const title = await page.title();
            const bodyText = (await page.locator('body').innerText()).trim();
            if (!bodyText) throw new Error('Rendered page body is empty');
            if (/404|NOT_FOUND/i.test(bodyText.slice(0, 500))) throw new Error('Vercel 404 page is still rendered');
            if (!/TrackFleet/i.test(`${title} ${bodyText.slice(0, 1000)}`)) throw new Error('TrackFleet UI was not detected');

            const markerCount = await page.locator('.maplibre-truck').count();
            if (markerCount > 0) {
              const positions = await page.locator('.maplibre-truck').evaluateAll(nodes =>
                nodes.map(node => getComputedStyle(node).position));
              if (positions.some(position => position !== 'absolute')) {
                throw new Error(`Map marker positioning regression: ${positions.join(', ')}`);
              }
            }

            console.log(`HTTP ${response.status()}`);
            console.log(`Title: ${title || '(empty)'}`);
            console.log(`Rendered body length: ${bodyText.length}`);
            console.log(`Map truck markers: ${markerCount}`);
            console.log(`Browser console errors: ${consoleErrors.length}`);
            for (const error of consoleErrors) console.log(`console-error: ${error}`);
          } finally {
            await page.screenshot({ path: 'trackfleet-vercel-home.png', fullPage: true }).catch(() => {});
            await browser.close();
          }
          EOF
          node smoke.mjs

      - name: Upload rendered screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackfleet-vercel-rendered-home
          path: /tmp/trackfleet-e2e/trackfleet-vercel-home.png
          if-no-files-found: ignore

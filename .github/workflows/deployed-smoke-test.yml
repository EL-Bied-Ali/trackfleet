name: Deployed site smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed TrackFleet origin to verify
        required: false
        default: https://trackfleet.chronoplan.workers.dev

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TRACKFLEET_BASE_URL: ${{ inputs.base_url || 'https://trackfleet.chronoplan.workers.dev' }}
    steps:
      - name: Wait for deployed client site
        shell: bash
        run: |
          set -euo pipefail
          URL="$TRACKFLEET_BASE_URL/"
          echo "Waiting for $URL"
          for attempt in $(seq 1 36); do
            code=$(curl --silent --location --output /tmp/trackfleet.html --write-out '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && [ -s /tmp/trackfleet.html ]; then
              echo "Live deployment returned HTTP 200 on attempt $attempt"
              grep -o -m1 '<title[^>]*>[^<]*</title>' /tmp/trackfleet.html || true
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 5
          done
          echo "Client site did not become ready"
          exit 1

      - name: Verify production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$TRACKFLEET_BASE_URL/api/health" -o /tmp/trackfleet-health.json
          cat /tmp/trackfleet-health.json
          node - <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/trackfleet-health.json", "utf8"));
          const failures = [];
          if (health?.ok !== true) failures.push("health.ok");
          if (health?.service !== "trackfleet") failures.push("service");
          if (health?.storage?.mode !== "postgres") failures.push("storage.mode");
          if (health?.storage?.persistent !== true) failures.push("storage.persistent");
          if (health?.storage?.connected !== true) failures.push("storage.connected");
          if (health?.sessionEncryptionConfigured !== true) failures.push("sessionEncryptionConfigured");
          if (health?.sendatrackConfigured !== true) failures.push("sendatrackConfigured");
          if (health?.automation?.tickProtected !== true) failures.push("automation.tickProtected");
          if (!Array.isArray(health?.automation?.missing) || health.automation.missing.length !== 0) failures.push("automation.missing");
          if (failures.length) {
            console.error(`Production readiness failed: ${failures.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Verify anonymous session boundary
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --output /tmp/trackfleet-session.json --write-out '%{http_code}' "$TRACKFLEET_BASE_URL/api/auth/session")
          cat /tmp/trackfleet-session.json
          test "$code" = "401"
          node - <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync("/tmp/trackfleet-session.json", "utf8"));
          if (body?.authenticated !== false) process.exit(1);
          NODE

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trackfleet-e2e
          cd /tmp/trackfleet-e2e
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium >/dev/null
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = `${process.env.TRACKFLEET_BASE_URL}/`;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const consoleErrors = [];
          page.on('console', msg => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });

          try {
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            if (!response) throw new Error('No navigation response');
            if (!response.ok()) throw new Error(`Navigation failed with HTTP ${response.status()}`);

            await page.locator('body').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('input[name="accountID"]').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('input[name="user"]').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('input[name="password"]').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('button.login-submit').waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(1000);

            const title = await page.title();
            const bodyText = (await page.locator('body').innerText()).trim();
            if (!bodyText) throw new Error('Rendered page body is empty');
            if (/404|NOT_FOUND/i.test(bodyText.slice(0, 500))) throw new Error('404 page is rendered');
            if (!/TrackFleet/i.test(`${title} ${bodyText.slice(0, 1000)}`)) throw new Error('TrackFleet UI was not detected');
            if (!/SENDATRACK/i.test(bodyText)) throw new Error('SENDATRACK login UI was not detected');

            console.log(`HTTP ${response.status()}`);
            console.log(`Title: ${title || '(empty)'}`);
            console.log(`Rendered body length: ${bodyText.length}`);
            console.log(`Browser console errors: ${consoleErrors.length}`);
            for (const error of consoleErrors) console.log(`console-error: ${error}`);
          } finally {
            await page.screenshot({ path: 'trackfleet-client-home.png', fullPage: true }).catch(() => {});
            await browser.close();
          }
          EOF
          node smoke.mjs

      - name: Upload rendered screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackfleet-client-rendered-home
          path: /tmp/trackfleet-e2e/trackfleet-client-home.png
          if-no-files-found: ignore

name: One-shot real KPI cleanup

on:
  push:
    paths:
      - .github/workflows/one-shot-real-kpis.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace demo KPIs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()

          def replace(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace(
              '''  const mapDeliveries = integration.connected\n    ? deliveries.filter((delivery) => delivery.gpsSource === "sendatrack")\n    : deliveries;''',
              '''  const mapDeliveries = integration.connected\n    ? deliveries.filter((delivery) => delivery.gpsSource === "sendatrack")\n    : deliveries;\n  const completedWithPlan = deliveries.filter((delivery) => delivery.status === "Delivered" && delivery.etaDelayMinutes != null);\n  const onTimeRate = completedWithPlan.length\n    ? Math.round((completedWithPlan.filter((delivery) => (delivery.etaDelayMinutes ?? 0) <= 0).length / completedWithPlan.length) * 1000) / 10\n    : null;\n  const delayedCount = deliveries.filter((delivery) => delivery.status !== "Delivered" && (delivery.status === "Delayed" || (delivery.etaDelayMinutes ?? 0) >= 60)).length;''',
              'real KPI calculations',
          )

          replace(
              '''<article className="stat-card"><div className="stat-head"><span>{t.onTimeRate}</span><Icon>◷</Icon></div><div><strong>94.2%</strong><em className="up">↗ 2.4%</em></div><p>{t.last30Days}</p></article>''',
              '''<article className="stat-card"><div className="stat-head"><span>{t.onTimeRate}</span><Icon>◷</Icon></div><div><strong>{onTimeRate == null ? "—" : `${onTimeRate}%`}</strong><em className="neutral">{completedWithPlan.length ? `${completedWithPlan.length} completed` : "No history"}</em></div><p>{completedWithPlan.length ? "Based on completed tracked deliveries" : "Available after completed tracked deliveries"}</p></article>''',
              'on-time KPI',
          )

          replace(
              '''<article className="stat-card"><div className="stat-head"><span>{t.delayed}</span><Icon>△</Icon></div><div><strong>3</strong><em className="warning">{t.needsAttention}</em></div><p>{t.delayReasons}</p></article>''',
              '''<article className="stat-card"><div className="stat-head"><span>{t.delayed}</span><Icon>△</Icon></div><div><strong>{delayedCount}</strong>{delayedCount > 0 && <em className="warning">{t.needsAttention}</em>}</div><p>{delayedCount > 0 ? t.delayReasons : "No material ETA delay detected"}</p></article>''',
              'delayed KPI',
          )

          replace(
              '''className={`timeline-step ${event.type === "GPS_STALE" ? "is-delayed" : "done"}`}''',
              '''className={`timeline-step ${event.type === "GPS_STALE" || event.type === "DELAY_DETECTED" ? "is-delayed" : "done"}`}''',
              'delay timeline styling',
          )

          replace(
              '''<td><strong>{delivery.eta}</strong><span>{delivery.status === "Delayed" ? t.updated : delivery.status === "Delivered" ? t.arrived : t.today}</span></td>''',
              '''<td><strong>{delivery.estimatedArrivalAt ? new Date(delivery.estimatedArrivalAt).toLocaleString(locale === "fr" ? "fr-BE" : locale === "nl" ? "nl-BE" : "en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : delivery.eta}</strong><span>{(delivery.etaDelayMinutes ?? 0) >= 60 ? `+${Math.round((delivery.etaDelayMinutes ?? 0) / 60)}h` : delivery.status === "Delivered" ? t.arrived : t.today}</span></td>''',
              'table ETA',
          )

          path.write_text(text)
          PY
      - name: Commit KPI cleanup
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --check
          git commit -m "replace demo KPIs with live delivery metrics"
          git push

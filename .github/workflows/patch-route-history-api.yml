name: Patch route history ETA API

on:
  push:
    paths:
      - ".github/workflows/patch-route-history-api.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use route history in ETA API
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          import_marker = 'import { matchDeliveryVehicle } from "../../lib/vehicle-linking";\n'
          if 'summarizeRouteHistory' not in s:
            if import_marker not in s: raise SystemExit('API import marker missing')
            s = s.replace(import_marker, import_marker + 'import { buildEtaRouteContexts, summarizeRouteHistory } from "../../lib/route-history";\n')

          old_sig = '''  events: Awaited<ReturnType<typeof store.listEvents>> = [],\n  futureServiceMinutes = 0,\n) {'''
          new_sig = '''  events: Awaited<ReturnType<typeof store.listEvents>> = [],\n  futureServiceMinutes = 0,\n  historicalEffectiveSpeedKmh: number | null = null,\n  historicalTripCount = 0,\n) {'''
          if old_sig in s: s = s.replace(old_sig, new_sig, 1)

          eta_marker = '''    delivered: row.status === "Delivered",\n    futureServiceMinutes,\n  });'''
          eta_replacement = '''    delivered: row.status === "Delivered",\n    futureServiceMinutes,\n    historicalEffectiveSpeedKmh,\n    historicalTripCount,\n  });'''
          if eta_marker in s: s = s.replace(eta_marker, eta_replacement, 1)

          return_marker = '''    pendingStopServiceMinutes: futureServiceMinutes,\n    trackingExpiresAt:'''
          return_replacement = '''    pendingStopServiceMinutes: futureServiceMinutes,\n    etaHistoryTrips: historicalTripCount,\n    etaHistoricalSpeedKmh: historicalEffectiveSpeedKmh === null ? null : Math.round(historicalEffectiveSpeedKmh),\n    trackingExpiresAt:'''
          if return_marker in s: s = s.replace(return_marker, return_replacement, 1)

          old_delay_sig = '''}>(row: T, futureServiceMinutes = 0) {\n  let events = await store.listEvents(row.id);\n  let delivery = enrichDelivery(row, events, futureServiceMinutes);'''
          new_delay_sig = '''}>(row: T, futureServiceMinutes = 0, historicalEffectiveSpeedKmh: number | null = null, historicalTripCount = 0) {\n  let events = await store.listEvents(row.id);\n  let delivery = enrichDelivery(row, events, futureServiceMinutes, historicalEffectiveSpeedKmh, historicalTripCount);'''
          if old_delay_sig in s: s = s.replace(old_delay_sig, new_delay_sig, 1)
          old_second = '    delivery = enrichDelivery(row, events, futureServiceMinutes);\n'
          if old_second in s: s = s.replace(old_second, '    delivery = enrichDelivery(row, events, futureServiceMinutes, historicalEffectiveSpeedKmh, historicalTripCount);\n', 1)

          public_old = '''      const companyRows = await store.listForCompany(row.companyId);\n      const serviceMinutes = pendingServiceMinutesBefore(row, companyRows);\n      const enriched = await enrichAndDetectDelay(row, serviceMinutes);'''
          public_new = '''      const companyRows = await store.listForCompany(row.companyId);\n      const routeContexts = buildEtaRouteContexts(companyRows);\n      const routeContext = routeContexts.get(row.id) ?? null;\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];\n      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);\n      const serviceMinutes = pendingServiceMinutesBefore(row, companyRows);\n      const enriched = await enrichAndDetectDelay(row, serviceMinutes, history.usableEffectiveSpeedKmh, history.tripCount);'''
          if public_old in s: s = s.replace(public_old, public_new, 1)
          elif 'const historyRows = routeContext ? await store.listEtaObservationsForRoute' not in s: raise SystemExit('public route history marker missing')

          auth_old = '''    const rows = await store.listForCompany(session.companyId);\n    const stopPlans = buildTruckStopPlans(rows);\n    const enrichedRows = await Promise.all(rows.map(async (row) => {\n      const serviceMinutes = pendingServiceMinutesBefore(row, rows);\n      return (await enrichAndDetectDelay(row, serviceMinutes)).delivery;\n    }));'''
          auth_new = '''    const rows = await store.listForCompany(session.companyId);\n    const stopPlans = buildTruckStopPlans(rows);\n    const routeContexts = buildEtaRouteContexts(rows, stopPlans);\n    const enrichedRows = await Promise.all(rows.map(async (row) => {\n      const serviceMinutes = pendingServiceMinutesBefore(row, rows);\n      const routeContext = routeContexts.get(row.id) ?? null;\n      const historyRows = routeContext ? await store.listEtaObservationsForRoute(routeContext.routeTemplateId, routeContext.destinationSiteId) : [];\n      const history = summarizeRouteHistory(historyRows, 5, routeContext?.tripInstanceId ?? null);\n      return (await enrichAndDetectDelay(row, serviceMinutes, history.usableEffectiveSpeedKmh, history.tripCount)).delivery;\n    }));'''
          if auth_old in s: s = s.replace(auth_old, auth_new, 1)
          elif 'const routeContexts = buildEtaRouteContexts(rows, stopPlans);' not in s: raise SystemExit('authenticated route history marker missing')
          p.write_text(s)

      - name: Build and test
        run: |
          npm install --ignore-scripts
          node --experimental-strip-types --test tests/route-history.test.mjs tests/eta-observation.test.mjs tests/eta-estimator.test.mjs
          npm run build:vercel
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/deliveries/route.ts
          git commit -m "use reusable route history to seed ETA"
          git push

name: One-shot SENDATRACK alias probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.TRACKFLEET_BASE_URL || 'https://trackfleet-self.vercel.app' }}
      CRON_SECRET: ${{ secrets.TRACKFLEET_CRON_SECRET }}
    steps:
      - name: Wait for protected probe and run once
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const secret = (process.env.CRON_SECRET || '').trim();
          if (!secret) throw new Error('TRACKFLEET_CRON_SECRET is empty');
          const url = `${baseUrl}/api/automation/sendatrack-events-alias-probe`;
          for (let attempt = 1; attempt <= 30; attempt++) {
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${secret}` },
              cache: 'no-store',
            }).catch(() => null);
            if (response && response.status !== 404) {
              const body = await response.text();
              console.log(`SENDATRACK_ALIAS_PROBE ${body}`);
              if (!response.ok) throw new Error(`probe_http_${response.status}`);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('probe_not_deployed');
          NODE

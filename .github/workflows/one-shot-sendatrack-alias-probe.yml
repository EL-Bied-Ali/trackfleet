name: One-shot SENDATRACK alias probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.TRACKFLEET_BASE_URL || 'https://trackfleet-self.vercel.app' }}
      CRON_SECRET: ${{ secrets.TRACKFLEET_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for protected probe and capture once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          node - <<'NODE'
          import fs from 'node:fs';
          const baseUrl = process.env.BASE_URL;
          const secret = (process.env.CRON_SECRET || '').trim();
          if (!secret) throw new Error('TRACKFLEET_CRON_SECRET is empty');
          const url = `${baseUrl}/api/automation/sendatrack-events-alias-probe`;
          for (let attempt = 1; attempt <= 30; attempt++) {
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${secret}` },
              cache: 'no-store',
            }).catch(() => null);
            if (response && response.status !== 404) {
              const body = await response.text();
              console.log(`SENDATRACK_ALIAS_PROBE ${body}`);
              if (!response.ok) throw new Error(`probe_http_${response.status}`);
              JSON.parse(body);
              fs.writeFileSync('.tmp/sendatrack-alias-result.json', `${body}\n`);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('probe_not_deployed');
          NODE
      - name: Commit temporary result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/sendatrack-alias-result.json
          git commit -m 'record temporary SENDATRACK alias result'
          git push

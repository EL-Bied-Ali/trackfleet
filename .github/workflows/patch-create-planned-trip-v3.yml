name: Patch planned trip creation v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply corrected planned trip patch
        run: |
          awk '/python - <<'"'"'PY'"'"'/{flag=1;next}/^          PY$/{flag=0}flag{sub(/^          /,"");print}' .github/workflows/patch-create-planned-trip-v2.yml > /tmp/patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/patch.py')
          s = p.read_text()
          s = s.replace('from "./delivery-vehicle-choice";', 'from "./delivery-vehicle-choice.ts";')
          s = s.replace('from "./route-template";', 'from "./route-template.ts";')
          p.write_text(s)
          PY
          python /tmp/patch.py
      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:planned-trip-creation
          pnpm run test:create-trip-api-contract
          pnpm run test:unassigned-direct-link-guard
          pnpm run test:trip-assignment
          pnpm run test:assignment-queue-ui
          pnpm run test:dispatch-data-gate
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/planned-trip-creation.ts app/api/deliveries/create-trip/route.ts app/page.tsx tests/planned-trip-creation.test.mjs tests/create-trip-api-contract.test.mjs package.json
          git commit -m "allow explicit creation of planned trips"
          git push

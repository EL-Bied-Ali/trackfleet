name: Patch planned trip creation v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add explicit planned trip creation
        run: |
          python - <<'PY'
          from pathlib import Path

          Path('app/lib/planned-trip-creation.ts').write_text('''import type { DeliveryRow } from "./delivery-store.types";\nimport { isUnassignedVehicle } from "./delivery-vehicle-choice";\nimport { routeTemplateId } from "./route-template";\n\nexport type PlannedTripCreationError = "delivery_not_unassigned" | "origin_required" | "destination_required" | "truck_required";\n\nexport function validateNewPlannedTrip(delivery: DeliveryRow, truck: string): PlannedTripCreationError | null {\n  if (delivery.status === "Delivered" || delivery.tripId || !isUnassignedVehicle(delivery)) return "delivery_not_unassigned";\n  if (!delivery.originSiteId) return "origin_required";\n  if (!delivery.destinationSiteId) return "destination_required";\n  if (!truck.trim()) return "truck_required";\n  return null;\n}\n\nexport function firstStopRouteTemplateId(delivery: Pick<DeliveryRow, "originSiteId" | "destinationSiteId">) {\n  return routeTemplateId(delivery.originSiteId, delivery.destinationSiteId ? [delivery.destinationSiteId] : []);\n}\n\nexport function manualTripVehicleKey(truck: string) {\n  const normalized = truck.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");\n  return `manual:${normalized || "truck"}`;\n}\n''')

          route = Path('app/api/deliveries/create-trip/route.ts')
          route.parent.mkdir(parents=True, exist_ok=True)
          route.write_text('''import { store } from "trackfleet-delivery-store";\nimport { getCompanySession } from "../../../lib/company-auth";\nimport { getSendatrackSnapshot } from "../../../lib/sendatrack";\nimport { firstStopRouteTemplateId, manualTripVehicleKey, validateNewPlannedTrip } from "../../../lib/planned-trip-creation";\n\nexport async function POST(request: Request) {\n  const session = await getCompanySession(request);\n  if (!session) return Response.json({ error: "authentication_required" }, { status: 401 });\n  const payload = await request.json() as Record<string, unknown>;\n  const deliveryId = String(payload.deliveryId ?? "").trim();\n  const vehicleId = String(payload.vehicleId ?? "").trim();\n  const manualTruck = String(payload.manualTruck ?? "").trim();\n  if (!deliveryId) return Response.json({ error: "deliveryId is required" }, { status: 400 });\n\n  const deliveries = await store.listForCompany(session.companyId);\n  const delivery = deliveries.find((item) => item.id === deliveryId) ?? null;\n  if (!delivery) return Response.json({ error: "delivery_not_found" }, { status: 404 });\n\n  let truck = manualTruck;\n  let sendatrackVehicleId = "";\n  let vehicleKey = manualTripVehicleKey(manualTruck);\n  if (vehicleId) {\n    const snapshot = await getSendatrackSnapshot(session.credentials);\n    if (!snapshot.connected) return Response.json({ error: "sendatrack_unavailable" }, { status: 503 });\n    const vehicle = snapshot.vehicles.find((item) => item.id === vehicleId);\n    if (!vehicle) return Response.json({ error: "vehicle_not_found" }, { status: 404 });\n    truck = vehicle.name;\n    sendatrackVehicleId = vehicle.id;\n    vehicleKey = vehicle.id;\n  }\n\n  const validationError = validateNewPlannedTrip(delivery, truck);\n  if (validationError) return Response.json({ error: validationError }, { status: 409 });\n  const tripId = `TRIP-${crypto.randomUUID().replace(/-/g, "").slice(0, 10).toUpperCase()}`;\n  const trip = await store.upsertTrip({\n    id: tripId, companyId: session.companyId, routeTemplateId: firstStopRouteTemplateId(delivery), vehicleKey, truck, sendatrackVehicleId,\n    originSiteId: delivery.originSiteId,\n    stops: [{ siteId: delivery.destinationSiteId!, destination: delivery.destination, sequence: 1, plannedArrivalAt: delivery.plannedArrivalAt }],\n    status: "planned",\n  });\n  const updated = await store.assignDeliveryToPlannedTrip(delivery.id, session.companyId, trip.id, trip.truck, trip.sendatrackVehicleId);\n  if (!updated) return Response.json({ error: "assignment_conflict" }, { status: 409 });\n  return Response.json({ delivery: updated, trip });\n}\n''')

          p = Path('app/page.tsx'); s = p.read_text()
          state_marker = '  const [tripAssignBusy, setTripAssignBusy] = useState<string | null>(null);\n'
          states = '  const [tripCreateDeliveryId, setTripCreateDeliveryId] = useState<string | null>(null);\n  const [tripCreateVehicleId, setTripCreateVehicleId] = useState("");\n  const [tripCreateManualTruck, setTripCreateManualTruck] = useState("");\n  const [tripCreateBusy, setTripCreateBusy] = useState(false);\n'
          if 'tripCreateDeliveryId' not in s:
            if state_marker not in s: raise SystemExit('state marker missing')
            s = s.replace(state_marker, state_marker + states, 1)

          fn_marker = '  async function createDelivery(event: React.FormEvent<HTMLFormElement>) {\n'
          fn = '''  async function createPlannedTrip(deliveryId: string) {\n    const manualTruck = tripCreateManualTruck.trim();\n    if (!tripCreateVehicleId && !manualTruck) {\n      setToast(locale === "fr" ? "Choisissez un camion ou saisissez son nom / sa plaque." : locale === "nl" ? "Kies een voertuig of voer naam / nummerplaat in." : "Choose a vehicle or enter its name / plate.");\n      return;\n    }\n    setTripCreateBusy(true);\n    try {\n      const response = await fetch("/api/deliveries/create-trip", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ deliveryId, vehicleId: tripCreateVehicleId, manualTruck }) });\n      if (!response.ok) throw new Error("trip_creation_failed");\n      const data = await response.json() as { delivery: Delivery; trip: TripHistoryItem };\n      setDeliveries((items) => items.map((delivery) => delivery.id === data.delivery.id ? { ...delivery, ...data.delivery } : delivery));\n      setTrips((items) => [data.trip, ...items.filter((trip) => trip.id !== data.trip.id)]);\n      setTripCreateDeliveryId(null);\n      setTripCreateVehicleId("");\n      setTripCreateManualTruck("");\n      setToast(locale === "fr" ? "Voyage planifié créé et colis affecté." : locale === "nl" ? "Geplande rit aangemaakt en zending toegewezen." : "Planned trip created and parcel assigned.");\n    } catch {\n      setToast(locale === "fr" ? "Impossible de créer ce voyage planifié." : locale === "nl" ? "Geplande rit kon niet worden aangemaakt." : "Could not create this planned trip.");\n    } finally {\n      setTripCreateBusy(false);\n    }\n  }\n\n'''
          if 'async function createPlannedTrip' not in s:
            if fn_marker not in s: raise SystemExit('function marker missing')
            s = s.replace(fn_marker, fn + fn_marker, 1)

          old = '                <div className="popover-actions">{suggestion && <button type="button" disabled={tripAssignBusy === delivery.id} onClick={() => void assignSuggestedTrip(delivery.id, suggestion.tripId)}>{tripAssignBusy === delivery.id ? (locale === "fr" ? "Affectation…" : locale === "nl" ? "Toewijzen…" : "Assigning…") : (locale === "fr" ? "Confirmer ce voyage" : locale === "nl" ? "Deze rit bevestigen" : "Confirm this trip")}</button>}<button type="button" className="copy-link" onClick={() => { setSelectedId(delivery.id); setShowPopover(true); }}>{locale === "fr" ? "Voir le colis" : locale === "nl" ? "Zending bekijken" : "View parcel"}</button></div>'
          new = '''                {tripCreateDeliveryId === delivery.id ? <div style={{ display: "grid", gap: 8, marginTop: 10 }}>\n                  {integration.connected && integration.vehicles.length > 0 && <select value={tripCreateVehicleId} onChange={(event) => { setTripCreateVehicleId(event.target.value); if (event.target.value) setTripCreateManualTruck(""); }}>\n                    <option value="">{locale === "fr" ? "Choisir un camion SENDATRACK" : locale === "nl" ? "Kies SENDATRACK-voertuig" : "Choose SENDATRACK vehicle"}</option>\n                    {integration.vehicles.map((vehicle) => <option key={vehicle.id} value={vehicle.id}>{vehicle.name}</option>)}\n                  </select>}\n                  <input value={tripCreateManualTruck} disabled={Boolean(tripCreateVehicleId)} onChange={(event) => setTripCreateManualTruck(event.target.value)} placeholder={locale === "fr" ? "Ou nom / plaque du camion" : locale === "nl" ? "Of naam / nummerplaat" : "Or truck name / plate"} />\n                  <small>{locale === "fr" ? "Ce colis devient le premier arrêt explicite du nouveau voyage." : locale === "nl" ? "Deze zending wordt de eerste expliciete stop van de nieuwe rit." : "This parcel becomes the first explicit stop of the new trip."}</small>\n                  <div className="popover-actions"><button type="button" disabled={tripCreateBusy} onClick={() => void createPlannedTrip(delivery.id)}>{tripCreateBusy ? (locale === "fr" ? "Création…" : locale === "nl" ? "Aanmaken…" : "Creating…") : (locale === "fr" ? "Créer et affecter" : locale === "nl" ? "Aanmaken en toewijzen" : "Create and assign")}</button><button type="button" className="copy-link" onClick={() => { setTripCreateDeliveryId(null); setTripCreateVehicleId(""); setTripCreateManualTruck(""); }}>{t.cancel}</button></div>\n                </div> : <div className="popover-actions">{suggestion ? <button type="button" disabled={tripAssignBusy === delivery.id} onClick={() => void assignSuggestedTrip(delivery.id, suggestion.tripId)}>{tripAssignBusy === delivery.id ? (locale === "fr" ? "Affectation…" : locale === "nl" ? "Toewijzen…" : "Assigning…") : (locale === "fr" ? "Confirmer ce voyage" : locale === "nl" ? "Deze rit bevestigen" : "Confirm this trip")}</button> : <button type="button" onClick={() => { setTripCreateDeliveryId(delivery.id); setTripCreateVehicleId(""); setTripCreateManualTruck(""); }}>{locale === "fr" ? "Créer un voyage planifié" : locale === "nl" ? "Geplande rit maken" : "Create planned trip"}</button>}<button type="button" className="copy-link" onClick={() => { setSelectedId(delivery.id); setShowPopover(true); }}>{locale === "fr" ? "Voir le colis" : locale === "nl" ? "Zending bekijken" : "View parcel"}</button></div>}'''
          if old not in s: raise SystemExit('queue action marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('tests/planned-trip-creation.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { UNASSIGNED_TRUCK } from "../app/lib/delivery-vehicle-choice.ts";\nimport { firstStopRouteTemplateId, manualTripVehicleKey, validateNewPlannedTrip } from "../app/lib/planned-trip-creation.ts";\nconst delivery = { id: "D1", status: "Loading", tripId: null, truck: UNASSIGNED_TRUCK, sendatrackVehicleId: "", originSiteId: "brussels", destinationSiteId: "casablanca" };\ntest("validates new planned trips", () => { assert.equal(validateNewPlannedTrip(delivery, "TRK-01"), null); assert.equal(validateNewPlannedTrip({ ...delivery, tripId: "T1" }, "TRK-01"), "delivery_not_unassigned"); assert.equal(validateNewPlannedTrip({ ...delivery, originSiteId: null }, "TRK-01"), "origin_required"); assert.equal(validateNewPlannedTrip({ ...delivery, destinationSiteId: null }, "TRK-01"), "destination_required"); assert.equal(validateNewPlannedTrip(delivery, ""), "truck_required"); });\ntest("route and manual vehicle identities are deterministic", () => { assert.equal(firstStopRouteTemplateId(delivery), firstStopRouteTemplateId({ ...delivery })); assert.equal(manualTripVehicleKey(" TRK 001 "), "manual:trk-001"); });\n''')
          Path('tests/create-trip-api-contract.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\nconst api = fs.readFileSync(new URL("../app/api/deliveries/create-trip/route.ts", import.meta.url), "utf8");\nconst page = fs.readFileSync(new URL("../app/page.tsx", import.meta.url), "utf8");\ntest("new trip API is tenant scoped and validates live vehicles", () => { assert.match(api, /getCompanySession/); assert.match(api, /store\.listForCompany\(session\.companyId\)/); assert.match(api, /snapshot\.vehicles\.find/); assert.match(api, /validateNewPlannedTrip/); assert.match(api, /status: "planned"/); assert.match(api, /assignDeliveryToPlannedTrip/); });\ntest("queue can create a first-stop planned trip", () => { assert.match(page, /Créer un voyage planifié/); assert.match(page, /Ce colis devient le premier arrêt explicite/); assert.match(page, /\/api\/deliveries\/create-trip/); });\n''')

          p = Path('package.json'); s = p.read_text(); marker = '    "test:unassigned-direct-link-guard": "node --test tests/unassigned-direct-link-guard.test.mjs",\n'
          if 'test:planned-trip-creation' not in s:
            if marker not in s: raise SystemExit('package marker missing')
            s = s.replace(marker, marker + '    "test:planned-trip-creation": "node --experimental-strip-types --test tests/planned-trip-creation.test.mjs",\n    "test:create-trip-api-contract": "node --test tests/create-trip-api-contract.test.mjs",\n', 1)
          p.write_text(s)
          PY
      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:planned-trip-creation
          pnpm run test:create-trip-api-contract
          pnpm run test:unassigned-direct-link-guard
          pnpm run test:trip-assignment
          pnpm run test:assignment-queue-ui
          pnpm run test:dispatch-data-gate
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/planned-trip-creation.ts app/api/deliveries/create-trip/route.ts app/page.tsx tests/planned-trip-creation.test.mjs tests/create-trip-api-contract.test.mjs package.json
          git commit -m "allow explicit creation of planned trips"
          git push

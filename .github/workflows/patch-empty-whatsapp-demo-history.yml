name: Patch empty WhatsApp demo history

on:
  push:
    paths:
      - ".github/workflows/patch-empty-whatsapp-demo-history.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remove seeded WhatsApp message history
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''  const [messageEvents, setMessageEvents] = useState<MessageEvent[]>([\n    { id: "demo-tracking", deliveryId: "TF-2841", kind: "tracking", time: "13:06" },\n  ]);'''
          new = '''  const [messageEvents, setMessageEvents] = useState<MessageEvent[]>([]);'''
          if old not in s: raise SystemExit('seeded WhatsApp history marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/dispatch-data-gate.test.mjs')
          s = p.read_text()
          add = '''\n\ntest("WhatsApp demo history starts empty instead of showing a fake sent message", () => {\n  assert.equal(source.includes('id: "demo-tracking"'), false);\n  assert.match(source, /useState<MessageEvent\[\]>\(\[\]\)/);\n});\n'''
          if 'WhatsApp demo history starts empty' not in s:
            s += add
          p.write_text(s)
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test and build
        run: |
          pnpm run test:dispatch-data-gate
          pnpm run build:vercel
          pnpm run build
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx tests/dispatch-data-gate.test.mjs
          git commit -m "start WhatsApp demo history empty"
          git push

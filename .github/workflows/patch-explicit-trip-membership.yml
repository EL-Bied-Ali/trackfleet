name: Patch explicit trip membership

on:
  push:
    paths:
      - ".github/workflows/patch-explicit-trip-membership.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Make persisted trip membership authoritative
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/lib/delivery-store.types.ts')
          s = p.read_text()
          marker = '  trackingToken: string | null;\n  createdAt: Date;\n'
          if marker not in s: raise SystemExit('delivery type marker missing')
          s = s.replace(marker, '  trackingToken: string | null;\n  tripId?: string | null;\n  createdAt: Date;\n', 1)
          p.write_text(s)

          p = Path('app/lib/delivery-store.postgres.ts')
          s = p.read_text()
          marker = '  tracking_token: string | null;\n  created_at: string | Date;\n'
          if marker not in s: raise SystemExit('postgres raw marker missing')
          s = s.replace(marker, '  tracking_token: string | null;\n  trip_id: string | null;\n  created_at: string | Date;\n', 1)
          marker = '    trackingToken: row.tracking_token,\n    createdAt: new Date(row.created_at),\n'
          if marker not in s: raise SystemExit('postgres hydrate marker missing')
          s = s.replace(marker, '    trackingToken: row.tracking_token,\n    tripId: row.trip_id ?? null,\n    createdAt: new Date(row.created_at),\n', 1)
          p.write_text(s)

          p = Path('app/lib/delivery-store.cloudflare.ts')
          s = p.read_text()
          marker = '  lastPositionAt: number | null; gpsSource: string; companyId: string; trackingToken: string | null; createdAt: number;\n'
          if marker not in s: raise SystemExit('D1 raw marker missing')
          s = s.replace(marker, '  lastPositionAt: number | null; gpsSource: string; companyId: string; trackingToken: string | null; tripId: string | null; createdAt: number;\n', 1)
          marker = '  tracking_token AS trackingToken, created_at AS createdAt`;\n'
          if marker not in s: raise SystemExit('D1 select marker missing')
          s = s.replace(marker, '  tracking_token AS trackingToken, trip_id AS tripId, created_at AS createdAt`;\n', 1)
          p.write_text(s)

          p = Path('app/lib/delivery-store.memory.ts')
          s = p.read_text()
          marker = '    deliveryTripAssignments.set(key, tripId);\n    return true;\n'
          if marker not in s: raise SystemExit('memory assignment marker missing')
          s = s.replace(marker, '    deliveryTripAssignments.set(key, tripId);\n    delivery.tripId = tripId;\n    return true;\n', 1)
          p.write_text(s)

          p = Path('app/lib/truck-stop-plan.ts')
          s = p.read_text()
          marker = '  routeTemplateId: string;\n  originSiteId: string | null;\n'
          if marker not in s: raise SystemExit('stop plan type marker missing')
          s = s.replace(marker, '  routeTemplateId: string;\n  tripId: string | null;\n  originSiteId: string | null;\n', 1)
          old = '''  const groups = new Map<string, DeliveryRow[]>();\n  const active = deliveries.filter((delivery) => delivery.status !== "Delivered" && delivery.destinationSiteId && !isUnassignedVehicle(delivery));\n  for (const delivery of active) {\n    const key = vehicleKey(delivery);\n    const current = groups.get(key) ?? [];\n    current.push(delivery);\n    groups.set(key, current);\n  }\n'''
          new = '''  const groups = new Map<string, DeliveryRow[]>();\n  const active = deliveries.filter((delivery) => delivery.status !== "Delivered" && delivery.destinationSiteId && !isUnassignedVehicle(delivery));\n  for (const delivery of active) {\n    const key = delivery.tripId ? `trip:${delivery.tripId}` : `vehicle:${vehicleKey(delivery)}`;\n    const current = groups.get(key) ?? [];\n    current.push(delivery);\n    groups.set(key, current);\n  }\n'''
          if old not in s: raise SystemExit('stop plan grouping marker missing')
          s = s.replace(old, new, 1)
          marker = '    const originSiteId = routeOriginSiteId(groupDeliveries);\n    return {\n      vehicleKey: key,\n'
          if marker not in s: raise SystemExit('stop plan return marker missing')
          repl = '''    const originSiteId = routeOriginSiteId(groupDeliveries);\n    const explicitTripIds = [...new Set(groupDeliveries.map((delivery) => delivery.tripId).filter((value): value is string => Boolean(value)))];\n    return {\n      vehicleKey: vehicleKey(groupDeliveries[0]),\n'''
          s = s.replace(marker, repl, 1)
          marker = '      routeTemplateId: routeTemplateId(originSiteId, stops.map((stop) => stop.siteId)),\n      originSiteId,\n'
          if marker not in s: raise SystemExit('stop plan route marker missing')
          s = s.replace(marker, '      routeTemplateId: routeTemplateId(originSiteId, stops.map((stop) => stop.siteId)),\n      tripId: explicitTripIds.length === 1 ? explicitTripIds[0] : null,\n      originSiteId,\n', 1)
          p.write_text(s)

          p = Path('app/api/deliveries/route.ts')
          s = p.read_text()
          old = '      const currentTripInstanceId = deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n'
          new = '      const currentTripInstanceId = plan.tripId ?? deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n'
          if old not in s: raise SystemExit('route trip instance marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/lib/server-automation.ts')
          s = p.read_text()
          old = '    const tripInstanceId = deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n'
          new = '    const tripInstanceId = plan.tripId ?? deliveryIds.map((id) => stableContexts.get(id)?.tripInstanceId).find(Boolean) ?? null;\n'
          if old not in s: raise SystemExit('automation trip instance marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/page.tsx')
          s = p.read_text()
          marker = '  trackingToken?: string | null;\n'
          if marker not in s: raise SystemExit('page delivery marker missing')
          s = s.replace(marker, marker + '  tripId?: string | null;\n', 1)
          marker = 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; tripInstanceId?: string | null; originSiteId: string | null;'
          if marker in s:
            s = s.replace(marker, 'type TourPlan = { vehicleKey: string; truck: string; sendatrackVehicleId: string; routeTemplateId: string; tripId?: string | null; tripInstanceId?: string | null; originSiteId: string | null;', 1)
          p.write_text(s)

          Path('tests/explicit-trip-membership.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { buildTruckStopPlans } from "../app/lib/truck-stop-plan.ts";\n\nfunction delivery(id, tripId, destinationSiteId) {\n  return { id, customer: id, originSiteId: "brussels", originLatitude: null, originLongitude: null, destinationSiteId, destination: destinationSiteId, destinationLatitude: null, destinationLongitude: null, arrivalRadiusKm: 0.5, truck: "TRK-1", driver: "", status: "Loading", eta: "", plannedArrivalAt: new Date("2026-08-20T12:00:00Z"), progress: 0, color: "#000", contact: "", sendatrackVehicleId: "gps-1", latitude: null, longitude: null, speed: null, lastPositionAt: null, gpsSource: "simulation", companyId: "c1", trackingToken: id, tripId, createdAt: new Date() };\n}\n\ntest("same truck can have separate explicit trips without mixing parcels", () => {\n  const plans = buildTruckStopPlans([delivery("A", "TRIP-A", "casablanca"), delivery("B", "TRIP-B", "agadir")]);\n  assert.equal(plans.length, 2);\n  assert.deepEqual(new Set(plans.map((plan) => plan.tripId)), new Set(["TRIP-A", "TRIP-B"]));\n});\n\ntest("legacy deliveries without trip id still group by vehicle", () => {\n  const plans = buildTruckStopPlans([delivery("A", null, "casablanca"), delivery("B", null, "agadir")]);\n  assert.equal(plans.length, 1);\n  assert.equal(plans[0].tripId, null);\n});\n''')

          p = Path('package.json')
          s = p.read_text()
          marker = '    "test:trip-suggestion": "node --experimental-strip-types --test tests/trip-suggestion.test.mjs",\n'
          if marker not in s: raise SystemExit('package marker missing')
          if 'test:explicit-trip-membership' not in s:
            s = s.replace(marker, marker + '    "test:explicit-trip-membership": "node --experimental-strip-types --test tests/explicit-trip-membership.test.mjs",\n', 1)
          p.write_text(s)

      - run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: |
          pnpm run test:explicit-trip-membership
          pnpm run test:stop-plans
          pnpm run test:tour
          pnpm run test:trip-record
          pnpm run test:automation-trip-sync
          pnpm exec eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings=0
          pnpm exec tsc -p tsconfig.vercel.json --noEmit
          pnpm run build:vercel
          pnpm run build
      - name: Commit product files
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app tests package.json
          git commit -m "make explicit trip membership authoritative"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

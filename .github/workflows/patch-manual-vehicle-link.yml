name: Patch manual vehicle linking

on:
  push:
    paths:
      - ".github/workflows/patch-manual-vehicle-link.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement manual vehicle association
        shell: python
        run: |
          from pathlib import Path

          # Extend vehicle-linking helper with search-only tolerant ranking.
          p = Path('app/lib/vehicle-linking.ts')
          s = p.read_text()
          if 'vehicleSearchIdentity' not in s:
            s += '''\nexport function vehicleSearchIdentity(value: string) {\n  return normalizeVehicleIdentity(value).replace(/\\d+/g, (digits) => String(Number(digits)));\n}\n\nexport function rankVehicleSuggestions(query: string, vehicles: SendatrackVehicle[]) {\n  const strict = normalizeVehicleIdentity(query);\n  const tolerant = vehicleSearchIdentity(query);\n  return [...vehicles]\n    .map((vehicle) => {\n      const vehicleStrict = normalizeVehicleIdentity(vehicle.name);\n      const vehicleTolerant = vehicleSearchIdentity(vehicle.name);\n      const score = !strict ? 3\n        : vehicleStrict === strict ? 0\n        : tolerant && vehicleTolerant === tolerant ? 1\n        : vehicleStrict.includes(strict) || (tolerant && vehicleTolerant.includes(tolerant)) ? 2\n        : 3;\n      return { vehicle, score };\n    })\n    .filter((entry) => !strict || entry.score < 3)\n    .sort((a, b) => a.score - b.score || a.vehicle.name.localeCompare(b.vehicle.name))\n    .map((entry) => entry.vehicle);\n}\n'''
          p.write_text(s)

          # Store interface: explicit tenant-safe manual association method.
          p = Path('app/lib/delivery-store.types.ts')
          s = p.read_text()
          s = s.replace('import type { SendatrackSnapshot } from "./sendatrack";', 'import type { SendatrackSnapshot, SendatrackVehicle } from "./sendatrack";')
          marker = '  applySendatrackSnapshot(snapshot: SendatrackSnapshot, companyId: string): Promise<DeliveryTransition[]>;\n'
          if 'linkVehicle(' not in s:
            s = s.replace(marker, marker + '  linkVehicle(deliveryId: string, companyId: string, vehicle: SendatrackVehicle): Promise<DeliveryRow | null>;\n')
          p.write_text(s)

          # Memory store manual link.
          p = Path('app/lib/delivery-store.memory.ts')
          s = p.read_text()
          marker = '  async recordEvent(deliveryId, type, progress) {\n'
          if 'async linkVehicle(' not in s:
            method = '''  async linkVehicle(deliveryId, companyId, vehicle) {\n    const delivery = deliveryStore.find((item) => item.id === deliveryId && item.companyId === companyId) ?? null;\n    if (!delivery || delivery.status === "Delivered") return null;\n    const metrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), explicitOrigin(delivery));\n    if (!deliveryEvents.some((event) => event.deliveryId === delivery.id && event.type === "GPS_BASELINE")) {\n      deliveryEvents.push({ deliveryId: delivery.id, type: "GPS_BASELINE", progress: metrics.progress, createdAt: new Date() });\n    }\n    Object.assign(delivery, {\n      sendatrackVehicleId: vehicle.id, truck: vehicle.name, latitude: vehicle.latitude, longitude: vehicle.longitude,\n      speed: vehicle.speed, lastPositionAt: new Date(vehicle.updatedAt), gpsSource: "sendatrack", status: "Loading",\n    });\n    return { ...delivery };\n  },\n'''
            if marker not in s: raise SystemExit('memory recordEvent marker missing')
            s = s.replace(marker, method + marker, 1)
          p.write_text(s)

          # Postgres store manual link.
          p = Path('app/lib/delivery-store.postgres.ts')
          s = p.read_text()
          marker = '  async recordEvent(deliveryId, type, progress) {\n'
          if 'async linkVehicle(' not in s:
            method = '''  async linkVehicle(deliveryId, companyId, vehicle) {\n    await ensureSchema();\n    const rows = await sql`SELECT * FROM deliveries WHERE id = ${deliveryId} AND company_id = ${companyId} AND status <> 'Delivered' LIMIT 1` as RawDelivery[];\n    const delivery = rows[0] ? hydrate(rows[0]) : null;\n    if (!delivery) return null;\n    const metrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), explicitOrigin(delivery));\n    await sql`INSERT INTO delivery_events (delivery_id, type, progress, created_at) VALUES (${delivery.id}, 'GPS_BASELINE', ${metrics.progress}, ${new Date().toISOString()}) ON CONFLICT (delivery_id, type) DO NOTHING`;\n    await sql`UPDATE deliveries SET\n      sendatrack_vehicle_id = ${vehicle.id}, truck = ${vehicle.name}, latitude = ${vehicle.latitude}, longitude = ${vehicle.longitude},\n      speed = ${vehicle.speed}, last_position_at = ${new Date(vehicle.updatedAt).toISOString()}, gps_source = 'sendatrack', status = 'Loading'\n      WHERE id = ${delivery.id} AND company_id = ${companyId}`;\n    const updated = await sql`SELECT * FROM deliveries WHERE id = ${delivery.id} AND company_id = ${companyId} LIMIT 1` as RawDelivery[];\n    return updated[0] ? hydrate(updated[0]) : null;\n  },\n'''
            if marker not in s: raise SystemExit('postgres recordEvent marker missing')
            s = s.replace(marker, method + marker, 1)
          p.write_text(s)

          # Cloudflare store manual link.
          p = Path('app/lib/delivery-store.cloudflare.ts')
          s = p.read_text()
          marker = '  async recordEvent(deliveryId, type, progress) {\n'
          if 'async linkVehicle(' not in s:
            method = '''  async linkVehicle(deliveryId, companyId, vehicle) {\n    await ensureTable();\n    const raw = await db().prepare(`SELECT ${selectColumns} FROM deliveries WHERE id = ? AND company_id = ? AND status != 'Delivered' LIMIT 1`).bind(deliveryId, companyId).first<RawDelivery>();\n    if (!raw) return null;\n    const delivery = hydrate(raw);\n    const metrics = calculateRouteMetrics(vehicle.latitude, vehicle.longitude, delivery.destination, explicitDestination(delivery), explicitOrigin(delivery));\n    await db().batch([\n      db().prepare(`INSERT OR IGNORE INTO delivery_events (delivery_id, type, progress, created_at) VALUES (?, 'GPS_BASELINE', ?, ?)`).bind(delivery.id, metrics.progress, Date.now()),\n      db().prepare(`UPDATE deliveries SET sendatrack_vehicle_id = ?, truck = ?, latitude = ?, longitude = ?, speed = ?, last_position_at = ?, gps_source = 'sendatrack', status = 'Loading' WHERE id = ? AND company_id = ?`).bind(vehicle.id, vehicle.name, vehicle.latitude, vehicle.longitude, vehicle.speed, vehicle.updatedAt, delivery.id, companyId),\n    ]);\n    const updated = await db().prepare(`SELECT ${selectColumns} FROM deliveries WHERE id = ? AND company_id = ? LIMIT 1`).bind(delivery.id, companyId).first<RawDelivery>();\n    return updated ? hydrate(updated) : null;\n  },\n'''
            if marker not in s: raise SystemExit('cloudflare recordEvent marker missing')
            s = s.replace(marker, method + marker, 1)
          p.write_text(s)

          # Authenticated manual-link endpoint. It only accepts an exact current SENDATRACK vehicle ID.
          endpoint = Path('app/api/deliveries/link-vehicle/route.ts')
          endpoint.parent.mkdir(parents=True, exist_ok=True)
          endpoint.write_text('''import { getCompanySession } from "../../../lib/company-auth";\nimport { store } from "../../../lib/delivery-store";\nimport { getSendatrackSnapshot } from "../../../lib/sendatrack";\n\nexport async function POST(request: Request) {\n  const session = await getCompanySession(request);\n  if (!session) return Response.json({ error: "authentication_required" }, { status: 401 });\n\n  const payload = await request.json() as Record<string, unknown>;\n  const deliveryId = String(payload.deliveryId ?? "").trim();\n  const vehicleId = String(payload.vehicleId ?? "").trim();\n  if (!deliveryId || !vehicleId) return Response.json({ error: "deliveryId and vehicleId are required" }, { status: 400 });\n\n  const snapshot = await getSendatrackSnapshot(session.credentials);\n  if (!snapshot.connected) return Response.json({ error: "sendatrack_unavailable" }, { status: 503 });\n  const vehicle = snapshot.vehicles.find((item) => item.id === vehicleId);\n  if (!vehicle) return Response.json({ error: "vehicle_not_found" }, { status: 404 });\n\n  const delivery = await store.linkVehicle(deliveryId, session.companyId, vehicle);\n  if (!delivery) return Response.json({ error: "delivery_not_found_or_not_linkable" }, { status: 404 });\n  return Response.json({ delivery });\n}\n''')

          # Client UI.
          p = Path('app/page.tsx')
          s = p.read_text()
          import_marker = 'import { originPreferenceKey, resolvePreferredOriginSite } from "./lib/origin-preference";\n'
          if 'rankVehicleSuggestions' not in s:
            s = s.replace(import_marker, import_marker + 'import { rankVehicleSuggestions } from "./lib/vehicle-linking";\n')
          state_marker = '  const [defaultOriginSiteId, setDefaultOriginSiteId] = useState("");\n'
          if 'vehicleLinkOpen' not in s:
            s = s.replace(state_marker, state_marker + '  const [vehicleLinkOpen, setVehicleLinkOpen] = useState(false);\n  const [vehicleLinkSearch, setVehicleLinkSearch] = useState("");\n  const [vehicleLinkChoice, setVehicleLinkChoice] = useState("");\n  const [vehicleLinkBusy, setVehicleLinkBusy] = useState(false);\n')

          fn_marker = '  async function createDelivery(event: React.FormEvent<HTMLFormElement>) {\n'
          if 'async function linkSelectedVehicle' not in s:
            fn = '''  async function linkSelectedVehicle() {\n    if (!vehicleLinkChoice) return;\n    setVehicleLinkBusy(true);\n    try {\n      const response = await fetch("/api/deliveries/link-vehicle", {\n        method: "POST",\n        headers: { "content-type": "application/json" },\n        body: JSON.stringify({ deliveryId: selected.id, vehicleId: vehicleLinkChoice }),\n      });\n      if (!response.ok) throw new Error("vehicle_link_failed");\n      const data = await response.json() as { delivery: Delivery };\n      setDeliveries((items) => items.map((delivery) => delivery.id === data.delivery.id ? { ...delivery, ...data.delivery } : delivery));\n      setVehicleLinkOpen(false);\n      setVehicleLinkSearch("");\n      setVehicleLinkChoice("");\n      setToast(locale === "fr" ? "Véhicule SENDATRACK associé." : locale === "nl" ? "SENDATRACK-voertuig gekoppeld." : "SENDATRACK vehicle linked.");\n    } catch {\n      setToast(locale === "fr" ? "Impossible d’associer ce véhicule." : locale === "nl" ? "Voertuig koppelen mislukt." : "Could not link this vehicle.");\n    } finally {\n      setVehicleLinkBusy(false);\n    }\n  }\n\n'''
            if fn_marker not in s: raise SystemExit('createDelivery marker missing')
            s = s.replace(fn_marker, fn + fn_marker, 1)

          # Compute suggestions near other derived values.
          marker = '  const delayedCount = deliveries.filter((delivery) => delivery.status !== "Delivered" && (delivery.status === "Delayed" || (delivery.etaDelayMinutes ?? 0) >= 60)).length;\n'
          if 'vehicleLinkSuggestions' not in s:
            s = s.replace(marker, marker + '  const vehicleLinkSuggestions = rankVehicleSuggestions(vehicleLinkSearch || selected?.truck || "", integration.vehicles);\n')

          old = '''              <div className="popover-actions"><button onClick={openCustomerView}>{t.openTracking} <span>↗</span></button><button className="copy-link" onClick={copyTrackingLink}>{t.copyLink}</button></div>'''
          new = '''              {selected.gpsSource !== "sendatrack" && <div style={{ marginTop: 10 }}>\n                {integration.connected && integration.vehicles.length ? <>\n                  {!vehicleLinkOpen ? <button className="copy-link" onClick={() => { setVehicleLinkOpen(true); setVehicleLinkSearch(selected.truck); setVehicleLinkChoice(""); }}>\n                    {locale === "fr" ? "Associer un véhicule" : locale === "nl" ? "Voertuig koppelen" : "Link a vehicle"}\n                  </button> : <div style={{ display: "grid", gap: 8 }}>\n                    <input value={vehicleLinkSearch} onChange={(event) => { setVehicleLinkSearch(event.target.value); setVehicleLinkChoice(""); }} placeholder={locale === "fr" ? "Rechercher nom / plaque" : locale === "nl" ? "Zoek naam / nummerplaat" : "Search name / plate"} />\n                    <select value={vehicleLinkChoice} onChange={(event) => setVehicleLinkChoice(event.target.value)}>\n                      <option value="">{locale === "fr" ? "Choisir le véhicule SENDATRACK" : locale === "nl" ? "Kies SENDATRACK-voertuig" : "Choose SENDATRACK vehicle"}</option>\n                      {vehicleLinkSuggestions.map((vehicle) => <option key={vehicle.id} value={vehicle.id}>{vehicle.name}</option>)}\n                    </select>\n                    <div className="popover-actions"><button disabled={!vehicleLinkChoice || vehicleLinkBusy} onClick={() => void linkSelectedVehicle()}>{vehicleLinkBusy ? (locale === "fr" ? "Association…" : "Linking…") : (locale === "fr" ? "Confirmer" : locale === "nl" ? "Bevestigen" : "Confirm")}</button><button className="copy-link" onClick={() => setVehicleLinkOpen(false)}>{t.cancel}</button></div>\n                  </div>}\n                </> : <small>{locale === "fr" ? "GPS en attente · SENDATRACK indisponible" : locale === "nl" ? "GPS in afwachting · SENDATRACK niet beschikbaar" : "Waiting for GPS · SENDATRACK unavailable"}</small>}\n              </div>}\n              <div className="popover-actions"><button onClick={openCustomerView}>{t.openTracking} <span>↗</span></button><button className="copy-link" onClick={copyTrackingLink}>{t.copyLink}</button></div>'''
          if old not in s: raise SystemExit('popover actions marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Extend tests for tolerant manual search while keeping auto-link strict.
          p = Path('tests/vehicle-linking.test.mjs')
          s = p.read_text()
          s = s.replace('import { matchDeliveryVehicle, normalizeVehicleIdentity } from "../app/lib/vehicle-linking.ts";', 'import { matchDeliveryVehicle, normalizeVehicleIdentity, rankVehicleSuggestions } from "../app/lib/vehicle-linking.ts";')
          if 'manual search tolerates leading zero differences' not in s:
            s += '''\ntest("manual search tolerates leading zero differences without changing auto-link rules", () => {\n  const vehicles = [vehicle("send-1", "TRK-014"), vehicle("send-2", "TRK-140")];\n  const suggestions = rankVehicleSuggestions("trk 14", vehicles);\n  assert.equal(suggestions[0]?.id, "send-1");\n  assert.equal(matchDeliveryVehicle({ sendatrackVehicleId: "", truck: "trk 14" }, vehicles).vehicle, null);\n});\n'''
          p.write_text(s)

      - name: Test vehicle linking
        run: node --experimental-strip-types --test tests/vehicle-linking.test.mjs
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/vehicle-linking.ts app/lib/delivery-store.types.ts app/lib/delivery-store.memory.ts app/lib/delivery-store.postgres.ts app/lib/delivery-store.cloudflare.ts app/api/deliveries/link-vehicle/route.ts app/page.tsx tests/vehicle-linking.test.mjs
          git commit -m "add manual SENDATRACK vehicle association"
          git push

name: One-shot full-address country direction

on:
  push:
    paths:
      - .github/workflows/one-shot-country-direction.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recognize full country names in routing and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/lib/route-progress.ts')
          t = p.read_text()
          anchor = 'function radians(value: number) { return value * Math.PI / 180; }\n'
          helper = '''function isBelgiumDestination(value: string) {\n  const normalized = value.trim().toUpperCase();\n  return normalized.endsWith(", BE") || normalized.includes("BELGIQUE") || normalized.includes("BELGIUM");\n}\n\n'''
          if anchor not in t: raise SystemExit('route helper anchor not found')
          t = t.replace(anchor, helper + anchor, 1)
          t = t.replace('  return normalized.endsWith(", BE") ? belgiumMoroccoCorridor[0] : belgiumMoroccoCorridor.at(-1)!;\n', '  return isBelgiumDestination(normalized) ? belgiumMoroccoCorridor[0] : belgiumMoroccoCorridor.at(-1)!;\n', 1)
          t = t.replace('  const belgiumBound = normalized.endsWith(", BE");\n', '  const belgiumBound = isBelgiumDestination(normalized);\n', 1)
          p.write_text(t)

          p = Path('tests/route-progress.test.mjs')
          t = p.read_text()
          anchor = 'test("stops the Morocco route at Tangier instead of continuing to Casablanca", () => {\n'
          addition = '''test("recognizes a full Belgian address as a Belgium-bound destination", () => {\n  const start = calculateRouteMetrics(33.5731, -7.5898, "45 Boulevard de l'Abattoir, 1000 Bruxelles, Belgique");\n  const end = calculateRouteMetrics(50.8503, 4.3517, "45 Boulevard de l'Abattoir, 1000 Bruxelles, Belgique");\n  assert.equal(start.progress, 0);\n  assert.equal(end.progress, 100);\n});\n\n'''
          if anchor not in t: raise SystemExit('country direction test anchor not found')
          p.write_text(t.replace(anchor, addition + anchor, 1))

          p = Path('app/page.tsx')
          t = p.read_text()
          old = '  const headingToMorocco = selected.destination.endsWith(", MA");\n'
          new = '  const destinationSite = knownSites.find((site) => site.id === selected.destinationSiteId);\n  const headingToMorocco = destinationSite?.country === "MA" || selected.destination.toUpperCase().includes("MAROC") || selected.destination.endsWith(", MA");\n'
          if old not in t: raise SystemExit('UI route direction anchor not found')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "104447048+EL-Bied-Ali@users.noreply.github.com"
          git add app/lib/route-progress.ts tests/route-progress.test.mjs app/page.tsx
          git commit -m "recognize full country names in delivery routing"
          git push

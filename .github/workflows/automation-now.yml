name: TrackFleet automation now

on:
  push:
    paths:
      - ".github/workflows/automation-now.yml"

jobs:
  tick-now:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BASE_URL: https://trackfleet-self.vercel.app
      CRON_SECRET: ${{ secrets.TRACKFLEET_CRON_SECRET }}
    steps:
      - name: Run production automation now
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const baseUrl = process.env.BASE_URL;
          const secret = (process.env.CRON_SECRET || '').trim();
          if (!secret) throw new Error('TRACKFLEET_CRON_SECRET is empty');

          const healthResponse = await fetch(`${baseUrl}/api/health`, { cache: 'no-store' });
          if (!healthResponse.ok) throw new Error(`health_http_${healthResponse.status}`);
          const health = await healthResponse.json();
          if (health?.storage?.persistent !== true || health?.storage?.connected !== true || health?.automation?.tickProtected !== true) {
            throw new Error(`production_not_ready:${JSON.stringify({ storage: health?.storage, automation: health?.automation })}`);
          }

          const tickResponse = await fetch(`${baseUrl}/api/automation/tick`, {
            headers: { authorization: `Bearer ${secret}` },
            cache: 'no-store',
          });
          const body = await tickResponse.text();
          console.log(body);
          if (!tickResponse.ok) throw new Error(`tick_http_${tickResponse.status}`);
          NODE

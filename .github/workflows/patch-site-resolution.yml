name: Patch site resolution

on:
  push:
    paths:
      - ".github/workflows/patch-site-resolution.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden tenant site selection and add regression test
        shell: python
        run: |
          from pathlib import Path
          route = Path("app/api/deliveries/route.ts")
          text = route.read_text()
          old_import = 'import { normalizeCustomerPhone } from "../../lib/customer-contact";\n'
          new_import = old_import + 'import { findCompanySiteByText, resolveExplicitCompanySite } from "../../lib/delivery-site-resolution";\n'
          if 'delivery-site-resolution' not in text:
              text = text.replace(old_import, new_import)

          old = '''    const companySites = await siteStore.listForCompany(session.companyId);\n    const findCompanySite = (value: string) => {\n      const wanted = normalized(value);\n      if (!wanted) return null;\n      return companySites.find((candidate) => candidate.id === value)\n        ?? companySites.find((candidate) => [candidate.label, candidate.city, candidate.address].some((entry) => normalized(entry) === wanted))\n        ?? null;\n    };\n    const originSite = findCompanySite(originSiteInput) ?? resolveKnownSite(originSiteInput);\n    const site = findCompanySite(destinationSiteId) ?? findCompanySite(destinationInput) ?? resolveKnownSite(destinationSiteId) ?? resolveKnownSite(destinationInput);\n'''
          new = '''    const companySites = await siteStore.listForCompany(session.companyId);\n    const originSelection = resolveExplicitCompanySite(companySites, originSiteInput);\n    if (originSelection.invalid) return Response.json({ error: "origin site is not available for this company" }, { status: 400 });\n    const destinationSelection = resolveExplicitCompanySite(companySites, destinationSiteId);\n    if (destinationSelection.invalid) return Response.json({ error: "destination site is not available for this company" }, { status: 400 });\n    const originSite = originSelection.site;\n    const site = destinationSelection.site ?? findCompanySiteByText(companySites, destinationInput) ?? resolveKnownSite(destinationInput);\n'''
          if old not in text:
              raise SystemExit("target delivery site block not found")
          route.write_text(text.replace(old, new))

          Path("tests/delivery-site-resolution.test.mjs").write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { findCompanySiteByText, resolveExplicitCompanySite } from "../app/lib/delivery-site-resolution.ts";\n\nfunction site(companyId, id, label, address) {\n  return { companyId, id, label, city: label.split(" · ")[0], address, country: "MA", roles: ["origin", "destination"], latitude: 34, longitude: -6, arrivalRadiusKm: 0.5, geofenceReady: true, createdAt: new Date(), updatedAt: new Date() };\n}\n\ntest("resolves tenant custom site by explicit id and text", () => {\n  const sites = [site("company-a", "custom-rabat", "Rabat · Custom", "Rue test Rabat")];\n  assert.equal(resolveExplicitCompanySite(sites, "custom-rabat").site?.id, "custom-rabat");\n  assert.equal(findCompanySiteByText(sites, "rue test rabat")?.id, "custom-rabat");\n});\n\ntest("rejects an explicit site id that is not present in the company site list", () => {\n  const companyASites = [site("company-a", "custom-rabat", "Rabat · Custom", "Rue test Rabat")];\n  const selection = resolveExplicitCompanySite(companyASites, "company-b-private-site");\n  assert.equal(selection.site, null);\n  assert.equal(selection.invalid, true);\n});\n\ntest("blank explicit site selection remains optional", () => {\n  const selection = resolveExplicitCompanySite([], "   ");\n  assert.equal(selection.site, null);\n  assert.equal(selection.invalid, false);\n});\n''')

          package = Path("package.json")
          package_text = package.read_text()
          marker = '    "test:site-store": "node --experimental-strip-types --test tests/site-store.test.mjs",\n'
          if 'test:delivery-site-resolution' not in package_text:
              package.write_text(package_text.replace(marker, marker + '    "test:delivery-site-resolution": "node --experimental-strip-types --test tests/delivery-site-resolution.test.mjs",\n'))
      - name: Commit patch
        run: |
          git config user.name "TrackFleet automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/deliveries/route.ts tests/delivery-site-resolution.test.mjs package.json
          git commit -m "harden tenant delivery site resolution"
          git push
